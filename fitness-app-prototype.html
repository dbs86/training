<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Forge" />
<meta name="theme-color" content="#08090b" />
<link rel="manifest" href="./manifest.json" />
<title>Forge — Training</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#08090b;
    --bg-soft:#0d0f12;
    --card:#15181d;
    --card-2:#1a1e24;
    --card-3:#1f242b;
    --border:rgba(255,255,255,0.07);
    --border-soft:rgba(255,255,255,0.04);
    --text:#f4f6f7;
    --text-dim:#8b93a1;
    --text-faint:#565c66;
    --accent:#2fe6c4;
    --accent-soft:rgba(47,230,196,0.14);
    --accent-glow:rgba(47,230,196,0.35);
    --purple:#9b8cfb;
    --amber:#f5c451;
    --red:#f2685f;
    --radius-lg:24px;
    --radius-md:18px;
    --radius-sm:12px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(circle at 20% -10%, #10201c 0%, var(--bg) 45%) fixed;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    overscroll-behavior:none;
  }
  #root{max-width:480px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:40px;}
  ::-webkit-scrollbar{display:none;}
  * {scrollbar-width:none;}
  button{font-family:inherit; cursor:pointer; color:inherit; text-align:inherit;}
  input{font-family:inherit;}

  .app-header{padding:22px 20px 6px;}
  .header-row{display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
  .greeting{font-size:22px; font-weight:700; letter-spacing:-0.3px;}
  .date-line{color:var(--text-dim); font-size:13px; margin-top:2px;}

  .week-nav{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:12px 14px; margin:16px 20px 0;
  }
  .week-nav .wk-btn{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--border);
    background:var(--card-2); color:var(--text); display:flex; align-items:center; justify-content:center;
  }
  .week-nav .wk-btn:active{background:var(--accent-soft); border-color:var(--accent);}
  .week-nav .wk-btn:disabled{opacity:0.3;}
  .week-mid{text-align:center;}
  .week-mid .lbl{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:1px;}
  .week-mid .num{font-size:17px; font-weight:700; margin-top:2px;}
  .week-track{height:4px; background:var(--card-3); border-radius:4px; margin:20px 20px 0; overflow:hidden;}
  .week-track-fill{height:100%; background:linear-gradient(90deg, var(--accent), #16b8a0); border-radius:4px; transition:width .3s;}

  .section-title{font-size:14px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; margin:26px 20px 10px;}

  .session-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 20px;}
  .session-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:16px; position:relative; overflow:hidden; text-align:left; color:var(--text);
    transition:transform .15s;
  }
  .session-card:active{transform:scale(0.97);}
  .session-card .glow{position:absolute; top:-30px; right:-30px; width:90px; height:90px; border-radius:50%; filter:blur(20px); opacity:.35;}
  .session-card .icon-badge{
    width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center;
    background:var(--card-3); border:1px solid var(--border); margin-bottom:14px;
  }
  .session-card .title{font-size:15px; font-weight:700; color:var(--text);}
  .session-card .subtitle{font-size:11.5px; color:var(--text-dim); margin-top:4px; line-height:1.4;}
  .session-card .meta{display:flex; align-items:center; gap:6px; margin-top:12px; font-size:11px; color:var(--text-faint);}
  .badge-optional{
    position:absolute; top:12px; right:12px; font-size:9px; font-weight:700; letter-spacing:.5px;
    color:var(--text-faint); background:var(--card-3); padding:3px 7px; border-radius:20px; text-transform:uppercase;
  }

  .stats-card{
    margin:0 20px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:18px;
  }
  .stats-tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px;}
  .stats-tiles-2{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}
  .stat-tile{background:var(--card-2); border:1px solid var(--border-soft); border-radius:var(--radius-sm); padding:12px 10px;}
  .stat-tile .v{font-size:19px; font-weight:800; letter-spacing:-.3px;}
  .stat-tile .v span{font-size:11px; color:var(--text-dim); font-weight:500;}
  .stat-tile .l{font-size:10px; color:var(--text-faint); margin-top:3px; text-transform:uppercase; letter-spacing:.5px;}
  .chart-wrap{height:130px; margin:6px 0 12px;}
  .log-btn{
    width:100%; background:var(--accent-soft); color:var(--accent); border:1px solid rgba(47,230,196,0.3);
    border-radius:var(--radius-sm); padding:12px; font-weight:700; font-size:13.5px;
  }
  .log-btn:active{background:rgba(47,230,196,0.25);}
  .history-list{margin-top:14px; display:flex; flex-direction:column; gap:8px; max-height:160px; overflow-y:auto;}
  .history-row{display:flex; justify-content:space-between; align-items:center; padding:9px 12px; background:var(--card-2); border-radius:10px; font-size:12.5px;}
  .history-row .d{color:var(--text-dim);}
  .history-row .vals{display:flex; gap:10px; font-weight:600;}
  .history-row .vals small{color:var(--text-faint); font-weight:400;}
  .empty-hint{color:var(--text-faint); font-size:12.5px; text-align:center; padding:18px 0;}

  .heatmap{display:flex; gap:4px; margin-top:14px;}
  .heat-cell{flex:1; height:22px; border-radius:5px; background:var(--card-2); border:1px solid var(--border-soft);}
  .heat-cell.lvl1{background:rgba(47,230,196,0.35); border-color:rgba(47,230,196,0.4);}
  .heat-cell.lvl2{background:var(--accent); border-color:var(--accent);}

  .fast-goal-label{font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px;}
  .fast-presets{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
  .fast-presets button{flex:1; min-width:44px; padding:9px 0; border-radius:10px; border:1px solid var(--border); background:var(--card-2); color:var(--text-dim); font-weight:700; font-size:12.5px;}
  .fast-presets button.active{background:var(--accent-soft); color:var(--accent); border-color:var(--accent);}
  .fast-ring-wrap{position:relative; width:140px; height:140px; margin:6px auto 4px;}
  .fast-ring-bg{fill:none; stroke:var(--card-3); stroke-width:8;}
  .fast-ring-fg{fill:none; stroke:var(--accent); stroke-width:8; stroke-linecap:round; transition:stroke-dashoffset 1s linear;}
  .fast-ring-label{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .fast-elapsed{font-size:22px; font-weight:800;}
  .fast-goal-sub{font-size:11px; color:var(--text-dim); margin-top:2px;}
  .fast-meta{text-align:center; font-size:11.5px; color:var(--text-faint); margin-top:2px;}
  .fast-summary{width:calc(100% - 40px); display:flex; align-items:center; justify-content:space-between; background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px 18px; margin:0 20px;}
  .fast-summary-left{display:flex; align-items:center; gap:12px;}
  .fast-summary-icon{width:38px; height:38px; border-radius:11px; background:var(--card-3); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .fast-summary-title{font-size:14.5px; font-weight:700;}
  .fast-summary-sub{font-size:11.5px; color:var(--text-dim); margin-top:2px;}

  .modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(3px); z-index:50; display:flex; align-items:flex-end;}
  .modal-sheet{
    width:100%; max-width:480px; margin:0 auto; background:var(--card); border-radius:26px 26px 0 0;
    padding:22px 20px 30px; border:1px solid var(--border); border-bottom:none;
    animation:slideUp .22s ease-out; max-height:85vh; overflow-y:auto;
  }
  @keyframes slideUp{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal-title{font-size:17px; font-weight:800; margin-bottom:16px;}
  .field{margin-bottom:12px;}
  .field label{font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px; display:block; margin-bottom:6px;}
  .field input{
    width:100%; background:var(--card-2); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:12px 14px; color:var(--text); font-size:15px; font-weight:600;
  }
  .field input:focus{outline:none; border-color:var(--accent);}
  .modal-actions{display:flex; gap:10px; margin-top:18px;}
  .btn-secondary{flex:1; background:var(--card-2); border:1px solid var(--border); color:var(--text-dim); border-radius:var(--radius-sm); padding:13px; font-weight:700;}
  .btn-primary{flex:1.4; background:var(--accent); border:none; color:#04211c; border-radius:var(--radius-sm); padding:13px; font-weight:800;}
  .btn-primary:disabled{opacity:.4;}

  .unit-toggle{display:flex; background:var(--card-2); border:1px solid var(--border); border-radius:14px; padding:4px; margin-top:4px;}
  .unit-toggle button{flex:1; padding:9px; border:none; background:transparent; color:var(--text-dim); border-radius:11px; font-weight:700; font-size:13px;}
  .unit-toggle button.active{background:var(--card-3); color:var(--text); box-shadow:0 0 0 1px var(--border);}

  /* Session view */
  .session-header{
    display:flex; align-items:center; gap:12px; padding:18px 20px 14px; position:sticky; top:0;
    background:linear-gradient(180deg, var(--bg) 70%, transparent); z-index:5;
  }
  .back-btn{width:36px; height:36px; border-radius:50%; background:var(--card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .session-header .titles{flex:1; min-width:0;}
  .session-header .titles .t{font-size:17px; font-weight:800;}
  .session-header .titles .s{font-size:11.5px; color:var(--text-dim);}

  .mode-toggle{display:flex; margin:0 20px 16px; background:var(--card-2); border:1px solid var(--border); border-radius:14px; padding:4px;}
  .mode-toggle button{flex:1; padding:9px; border:none; background:transparent; color:var(--text-dim); border-radius:11px; font-weight:700; font-size:13px;}
  .mode-toggle button.active{background:var(--card-3); color:var(--text); box-shadow:0 0 0 1px var(--border);}

  .progress-dots{display:flex; gap:5px; padding:0 20px 14px; flex-wrap:wrap;}
  .progress-dots .dot{flex:1; height:4px; border-radius:3px; background:var(--card-3); min-width:8px;}
  .progress-dots .dot.done{background:var(--accent);}
  .progress-dots .dot.current{background:var(--text-dim);}

  .step-card{
    margin:0 20px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:20px; position:relative; overflow:visible;
  }
  .step-kind{font-size:10.5px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:var(--accent); margin-bottom:4px;}
  .step-title{font-size:19px; font-weight:800; letter-spacing:-.3px; padding-right:74px;}
  .step-note{font-size:12px; color:var(--text-dim); margin-top:4px;}

  .timer-ring-wrap{position:absolute; top:16px; right:16px; width:58px; height:58px;}
  .timer-ring-wrap svg{transform:rotate(-90deg);}
  .timer-ring-bg{fill:none; stroke:var(--card-3); stroke-width:5;}
  .timer-ring-fg{fill:none; stroke:var(--accent); stroke-width:5; stroke-linecap:round; transition:stroke-dashoffset 1s linear;}
  .timer-ring-label{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800;}
  .timer-ring-label.idle{color:var(--text-faint); font-size:9px; text-align:center; line-height:1.2;}
  .timer-ring-label.resting{color:var(--accent);}
  .timer-ring-label.done{color:var(--amber);}

  .ex-row{margin-top:20px; padding-top:16px; border-top:1px solid var(--border-soft);}
  .ex-row:first-of-type{margin-top:18px; padding-top:0; border-top:none;}
  .ex-connector{font-size:11px; color:var(--text-faint); margin-bottom:4px; font-weight:700;}
  .ex-name-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .ex-name-row .ex-name{flex:1; min-width:0; cursor:pointer;}
  .ex-name{font-size:15px; font-weight:700;}
  .ex-edit-btn{width:26px; height:26px; border-radius:8px; background:var(--card-2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--text-faint); flex-shrink:0;}
  .ex-edit-input{flex:1; background:var(--card-2); border:1px solid var(--accent); border-radius:8px; padding:6px 10px; color:var(--text); font-size:15px; font-weight:700;}
  .ex-target{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .ex-hint{font-size:11px; color:var(--text-faint); margin-top:8px;}
  .ex-inputs{display:flex; gap:10px; margin-top:12px;}
  .ex-inputs .fld{flex:1;}
  .ex-inputs label{font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.5px; display:block; margin-bottom:5px;}
  .ex-inputs input{width:100%; background:var(--card-2); border:1px solid var(--border); border-radius:10px; padding:9px 10px; color:var(--text); font-size:14px; font-weight:700;}
  .ex-inputs input::placeholder{color:var(--text-faint); font-weight:500;}
  .set-dots{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .set-dot{
    width:34px; height:34px; border-radius:10px; border:1.5px solid var(--border); background:var(--card-2);
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:var(--text-faint);
  }
  .set-dot.filled{background:var(--accent); border-color:var(--accent); color:#04211c;}

  .step-footer{display:flex; gap:10px; margin:20px 20px 0;}
  .nav-btn{flex:1; padding:15px; border-radius:16px; border:1px solid var(--border); background:var(--card); color:var(--text); font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; gap:6px;}
  .nav-btn:disabled{opacity:.3;}
  .nav-btn.primary{background:var(--accent); color:#04211c; border:none;}
  .nav-btn.finish{background:linear-gradient(90deg,var(--accent),#16b8a0); color:#04211c; border:none;}

  /* Overview mode */
  .ov-list{padding:0 20px; display:flex; flex-direction:column; gap:10px;}
  .ov-group{background:var(--card); border:1px solid var(--border); border-radius:var(--radius-md); padding:15px 16px;}
  .ov-group:active{background:var(--card-2);}
  .ov-kind{font-size:10px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; color:var(--accent);}
  .ov-title{font-size:14.5px; font-weight:700; margin-top:3px;}
  .ov-exlist{margin-top:8px; display:flex; flex-direction:column; gap:3px;}
  .ov-ex{font-size:12.5px; color:var(--text-dim); display:flex; justify-content:space-between;}
  .ov-ex b{color:var(--text); font-weight:600;}
  .ov-rest{font-size:10.5px; color:var(--text-faint); margin-top:8px;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--card-3);
    border:1px solid var(--accent); color:var(--accent); padding:12px 18px; border-radius:20px; font-weight:700;
    font-size:12.5px; z-index:100; box-shadow:0 8px 30px rgba(0,0,0,.5); max-width:90%; text-align:center;
  }
  .home-footer-space{height:20px;}

  .has-ticker{padding-bottom:78px;}
  .spotify-ticker{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:rgba(21,24,29,0.94); backdrop-filter:blur(14px); border-top:1px solid var(--border); z-index:60; padding:0 14px 10px;}
  .spotify-progress{height:2px; background:var(--card-3); margin:0 -14px;}
  .spotify-progress-fill{height:100%; background:var(--accent);}
  .spotify-row{display:flex; align-items:center; gap:10px; padding-top:8px;}
  .spotify-art{width:38px; height:38px; border-radius:8px; object-fit:cover; flex-shrink:0;}
  .spotify-meta{flex:1; min-width:0;}
  .spotify-name{font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .spotify-artist{font-size:11px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .spotify-btn{width:32px; height:32px; border-radius:50%; background:var(--card-2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState, useEffect, useRef, useMemo} = React;

/* ---------------- DATA ---------------- */
const SESSIONS = [
  {id:'push', name:'Push', subtitle:'Chest · Shoulders · Triceps', duration:'55–65 min', optional:false, color:'#2fe6c4',
    groups:[
      {type:'straight', title:'Chest', exercises:[
        {name:'Barbell Bench Press', sets:5, reps:'5', rest:120, note:'Working sets'},
        {name:'Barbell Bench Press · Back-off', sets:3, reps:'8', rest:90, note:'Drop ~15% load'},
        {name:'Barbell Bench Press · Drop Set', sets:1, reps:'AMRAP', rest:90, note:'20% less weight'},
      ]},
      {type:'superset', title:'Superset A', restAfter:75, exercises:[
        {name:'Incline Dumbbell Press', sets:4, reps:'10–12'},

      ]},
      {type:'superset', title:'Superset B', restAfter:60, exercises:[
        {name:'Seated DB Shoulder Press', sets:4, reps:'10–12'},
        {name:'Lateral Raise (Thumbs-Down)', sets:4, reps:'12–15'},
      ]},
      {type:'straight', title:'Rear Delt & Rotator Cuff', exercises:[
        {name:'Rear Delt Cable Fly (Face Pull)', sets:3, reps:'15', rest:45},
        {name:'Band Pull-Apart', sets:3, reps:'20', rest:30},
      ]},
      {type:'triset', title:'Triceps Tri-Set', note:'No rest between exercises', restAfter:90, exercises:[
        {name:'Overhead Cable Extension', sets:3, reps:'10'},
        {name:'Tricep Rope Pushdown', sets:3, reps:'12'},
        {name:'Bench Dips or Bar Dips', sets:3, reps:'Failure'},

      {type:'finisher', title:'Finisher', rounds:3, restBetweenRounds:90, exercises:[
        {name:'Push-Up', reps:'Failure'},
        {name:'Wall Angels', reps:'15'},
        {name:'Plank Shoulder Taps', reps:'20 each side'},
      ]},
    ]
  },
  {id:'pull', name:'Pull', subtitle:'Back · Biceps · Rear Delts', duration:'55–65 min', optional:false, color:'#9b8cfb',
    groups:[
      {type:'straight', title:'Back · Vertical Pull', exercises:[
        {name:'Weighted Pull-Up (Pronated)', sets:5, reps:'5', rest:120},
        {name:'Neutral-Grip Pull-Up · Back-off', sets:3, reps:'8–10', rest:90},
      ]},
      {type:'superset', title:'Superset A', restAfter:75, exercises:[
        {name:'Bent-Over Barbell Row', sets:4, reps:'6–8'},
        {name:'DB Pendlay Row', sets:4, reps:'8–10'},
      ]},
      {type:'superset', title:'Superset B', restAfter:60, exercises:[
        {name:'Chest-Supported DB Row', sets:3, reps:'12'},
        {name:'Single-Arm DB Row', sets:3, reps:'10–12 each'},
      ]},
      {type:'triset', title:'Biceps Tri-Set', note:'No rest between exercises', restAfter:60, exercises:[
        {name:'Incline DB Curl (Supinated)', sets:3, reps:'10–12'},
        {name:'Hammer Curl', sets:3, reps:'12'},
        {name:'Face Pull', sets:3, reps:'15'},
      ]},
      {type:'finisher', title:'Finisher', rounds:3, restBetweenRounds:20, note:'Minimum rest between rounds', exercises:[
        {name:'Straight-Arm Lat Pulldown', reps:'15'},
        {name:'Band Pull-Apart', reps:'20'},
        {name:'Dead Hang', reps:'20–30 sec'},
      ]},
    ]
  },
  {id:'legs', name:'Legs', subtitle:'Quads · Hamstrings · Glutes · Calves', duration:'60–70 min', optional:false, color:'#f5c451',
    groups:[
      {type:'straight', title:'Quads & Glutes', exercises:[
        {name:'Barbell Back Squat', sets:5, reps:'5', rest:150},
        {name:'Barbell Back Squat · Back-off', sets:3, reps:'8', rest:120, note:'Drop 15–20%, 3 sec eccentric'},
      ]},
      {type:'straight', title:'Hamstrings', exercises:[
        {name:'Barbell Romanian Deadlift', sets:4, reps:'8–10', rest:90},
      ]},
      {type:'superset', title:'Superset A', restAfter:90, exercises:[
        {name:'Bulgarian Split Squat', sets:3, reps:'10 each'},

/* ---------------- BEEP / NOTIFY ---------------- */
let _audioCtx = null;
function getAudioCtx(){
  try{
    if(!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(_audioCtx.state === 'suspended') _audioCtx.resume().catch(()=>{});
    return _audioCtx;
  }catch(e){ return null; }
}
function playBeep(){
  const ctx = getAudioCtx();
  if(!ctx) return;
  try{
    [0,0.18,0.36].forEach((t,i)=>{
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type='sine'; o.frequency.value = i===2?1050:850;
      g.gain.setValueAtTime(0.0001, ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+t+0.15);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.16);
    });
  }catch(e){}
}
function requestNotifyPermission(){
  try{
    if('Notification' in window && Notification.permission==='default'){
      Notification.requestPermission();
    }
  }catch(e){}
}
function notify(title, body){
  try{
    if('Notification' in window && Notification.permission==='granted'){
      new Notification(title, {body});
    }
  }catch(e){}
}

/* ---------------- SPOTIFY (PKCE) ---------------- */
const SPOTIFY_SCOPES = 'user-read-currently-playing user-read-playback-state user-modify-playback-state';
function getRedirectUri(){
  return window.location.origin + window.location.pathname;
}
function base64UrlEncode(buffer){
  return btoa(String.fromCharCode(...new Uint8Array(buffer)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function generateRandomString(len){
  const arr = new Uint8Array(len);
  crypto.getRandomValues(arr);
  return base64UrlEncode(arr.buffer).slice(0,len);
}
async function sha256(plain){
  const data = new TextEncoder().encode(plain);
  return await crypto.subtle.digest('SHA-256', data);
}
async function startSpotifyAuth(clientId){
  const verifier = generateRandomString(64);
  localStorage.setItem('ftx_spotify_verifier', verifier);
  const challenge = base64UrlEncode(await sha256(verifier));
  const params = new URLSearchParams({
    client_id: clientId,
    response_type: 'code',
    redirect_uri: getRedirectUri(),
    scope: SPOTIFY_SCOPES,
    code_challenge_method: 'S256',
    code_challenge: challenge,
  });
  window.location.href = `https://accounts.spotify.com/authorize?${params.toString()}`;
}
async function exchangeSpotifyCode(clientId, code){
  const verifier = localStorage.getItem('ftx_spotify_verifier');
  const body = new URLSearchParams({
    client_id: clientId, grant_type: 'authorization_code', code,
    redirect_uri: getRedirectUri(), code_verifier: verifier,
  });
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body,
  });
  if(!res.ok) throw new Error('token exchange failed');
  return res.json();
}
async function refreshSpotifyToken(clientId, refreshToken){
  const body = new URLSearchParams({ client_id: clientId, grant_type:'refresh_token', refresh_token: refreshToken });
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body,
  });
  if(!res.ok) throw new Error('refresh failed');
  return res.json();
}
async function getValidSpotifyToken(clientId, tokens, setTokens){
  if(!tokens) return null;
  if(Date.now() < tokens.expires_at - 15000) return tokens.access_token;
  try{
    const data = await refreshSpotifyToken(clientId, tokens.refresh_token);
    const nextTokens = {access_token:data.access_token, refresh_token: data.refresh_token || tokens.refresh_token, expires_at: Date.now()+data.expires_in*1000};
    setTokens(nextTokens);
    return nextTokens.access_token;
  }catch(e){ return null; }
}

/* ---------------- MATH HELPERS ---------------- */
function roundTo(v, step){ return Math.round(v/step)*step; }
function estimate1RM(weight, reps){ return weight*(1+reps/30); }
function firstNumber(str){
  if(str==null) return null;
  const m = String(str).match(/\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : null;
}
function computeWarmup(weight){
  return [
    {pct:40, w:roundTo(weight*0.4,2.5), reps:5},
    {pct:60, w:roundTo(weight*0.6,2.5), reps:3},
    {pct:80, w:roundTo(weight*0.8,2.5), reps:2},
  ];
}
const PLATES = [25,20,15,10,5,2.5,1.25];
function computePlates(weight){
  const bar = 20;
  if(weight < bar) return null;
  let perSide = roundTo((weight-bar)/2, 1.25);
  let remaining = perSide;
  const used = [];
  for(const p of PLATES){
    while(remaining >= p - 0.001){
      used.push(p);
      remaining -= p;
      remaining = Math.round(remaining*100)/100;
    }
  }
  return used;
}
function kgToUnit(kg, unit){ return unit==='lb' ? kg*2.20462 : kg; }
function unitToKg(val, unit){ return unit==='lb' ? val/2.20462 : val; }
function computeSessionVolume(session, week, logs){
  let total = 0;
  session.groups.forEach((g, gi)=>{
    g.exercises.forEach((ex, ei)=>{
      const k = `w${week}_${session.id}_${gi}_${ei}`;
      const entry = logs[k];
      if(!entry || !entry.done) return;
      const doneCount = entry.done.filter(Boolean).length;
      if(doneCount<=0) return;
      const w = parseFloat(entry.weight);
      const r = firstNumber(entry.reps) || firstNumber(ex.reps);
      if(isFinite(w) && w>0 && r){
        total += w*r*doneCount;
      }
    });
  });
  return total;
}

/* ---------------- RING TIMER ---------------- */
function RestTimerBox({duration, triggerToken}){
  const [endAt, setEndAt] = useState(null);
  const [now, setNow] = useState(Date.now());
  const [justDone, setJustDone] = useState(false);
  const prevToken = useRef(null);
  const doneFired = useRef(false);

  useEffect(()=>{
    if(triggerToken==null || triggerToken===prevToken.current) return;
    prevToken.current = triggerToken;
    if(duration>0){
      doneFired.current = false;
      setJustDone(false);
      setEndAt(Date.now()+duration*1000);
      setNow(Date.now());
    }
  }, [triggerToken, duration]);

  useEffect(()=>{
    if(!endAt) return;
    const tick = () => setNow(Date.now());
    const iv = setInterval(tick, 1000);
    const onVis = () => { if(document.visibilityState==='visible') tick(); };
    document.addEventListener('visibilitychange', onVis);
    window.addEventListener('focus', tick);
    return () => { clearInterval(iv); document.removeEventListener('visibilitychange', onVis); window.removeEventListener('focus', tick); };
  }, [endAt]);

  const remaining = endAt ? Math.max(0, Math.ceil((endAt-now)/1000)) : 0;
  const running = !!endAt && remaining>0;

  useEffect(()=>{
    if(endAt && remaining<=0 && !doneFired.current){
      doneFired.current = true;
      playBeep();
      if(navigator.vibrate) { try{ navigator.vibrate([120,80,120]); }catch(e){} }
      notify('Rest complete', 'Time for your next set.');
      setJustDone(true);
      setEndAt(null);
      const t = setTimeout(()=> setJustDone(false), 3000);
      return ()=>clearTimeout(t);
    }
  }, [remaining, endAt]);

  const r = 24; const c = 2*Math.PI*r;
  const pct = duration ? remaining/duration : 0;
  const offset = c*(1-pct);

  return (
    <div className="timer-ring-wrap">
      <svg width="58" height="58">
        <circle className="timer-ring-bg" cx="29" cy="29" r={r}/>
        {running && <circle className="timer-ring-fg" cx="29" cy="29" r={r} strokeDasharray={c} strokeDashoffset={offset}/>}
      </svg>
      <div className={"timer-ring-label " + (running?'resting':justDone?'done':'idle')}>
        {running ? `${remaining}s` : justDone ? '✓' : (duration ? `${duration}s` : '—')}
      </div>
    </div>
  );
}

function computeBMI(weightKg, heightCm){
  if(!weightKg || !heightCm) return null;
  const h = heightCm/100;
  return weightKg/(h*h);
}

  return (

  }
  const totalSessions = completions.length;
  const cellCount = (w) => completions.filter(c=>c.week===w).length;
  return (
    <div className="stats-card">
      <div className="stats-tiles-2">
        <div className="stat-tile"><div className="v">{streak}</div><div className="l">Week Streak</div></div>
        <div className="stat-tile"><div className="v">{totalSessions}</div><div className="l">Total Sessions</div></div>
      </div>
      <div className="heatmap">
        {Array.from({length:TOTAL_WEEKS}).map((_,i)=>{
          const c = cellCount(i+1);
          const cls = c===0?'':c===1?'lvl1':'lvl2';
          return <div key={i} className={"heat-cell "+cls} title={`Week ${i+1}: ${c} session(s)`}></div>;
        })}
      </div>
    </div>
  );
}

function SpotifyTicker({clientId, tokens, setTokens}){
  const [track, setTrack] = useState(null);

  useEffect(()=>{
    if(!tokens || !clientId){ setTrack(null); return; }
    let stopped = false;
    const poll = async () => {
      const token = await getValidSpotifyToken(clientId, tokens, setTokens);
      if(!token || stopped) return;
      try{
        const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
          headers:{Authorization:`Bearer ${token}`}
        });
        if(res.status===204){ if(!stopped) setTrack(null); return; }
        if(!res.ok) return;
        const data = await res.json();
        if(!data || !data.item){ if(!stopped) setTrack(null); return; }
        if(stopped) return;
        setTrack({
          name: data.item.name,
          artists: (data.item.artists||[]).map(a=>a.name).join(', '),
          image: data.item.album && data.item.album.images && data.item.album.images.length
            ? (data.item.album.images[2] || data.item.album.images[0]).url : null,
          isPlaying: data.is_playing,
          progressMs: data.progress_ms || 0,
          durationMs: data.item.duration_ms || 0,
        });
      }catch(e){}
    };
    poll();
    const iv = setInterval(poll, 6000);
    const onVis = () => { if(document.visibilityState==='visible') poll(); };
    document.addEventListener('visibilitychange', onVis);
    return () => { stopped=true; clearInterval(iv); document.removeEventListener('visibilitychange', onVis); };
  }, [tokens, clientId]);

  const control = async (action) => {
    const token = await getValidSpotifyToken(clientId, tokens, setTokens);
    if(!token) return;
    try{
      if(action==='toggle'){
        const url = track && track.isPlaying ? 'https://api.spotify.com/v1/me/player/pause' : 'https://api.spotify.com/v1/me/player/play';
        await fetch(url, {method:'PUT', headers:{Authorization:`Bearer ${token}`}});
        setTrack(t=> t ? {...t, isPlaying: !t.isPlaying} : t);
      } else if(action==='next'){
        await fetch('https://api.spotify.com/v1/me/player/next', {method:'POST', headers:{Authorization:`Bearer ${token}`}});
      }
    }catch(e){}
  };

  if(!tokens || !track) return null;
  const pct = track.durationMs ? Math.min(100, (track.progressMs/track.durationMs)*100) : 0;

  return (
    <div className="spotify-ticker">
      <div className="spotify-progress"><div className="spotify-progress-fill" style={{width:pct+'%'}}></div></div>
      <div className="spotify-row">
        {track.image && <img src={track.image} className="spotify-art" alt=""/>}
        <div className="spotify-meta">
          <div className="spotify-name">{track.name}</div>
          <div className="spotify-artist">{track.artists}</div>
        </div>
        <button className="spotify-btn" onClick={()=>control('toggle')}>
          <Icon name={track.isPlaying ? 'pause' : 'play'} size={16}/>
        </button>
        <button className="spotify-btn" onClick={()=>control('next')}>
          <Icon name="next" size={16}/>
        </button>
      </div>
    </div>
  );
}

const FAST_PRESETS = [16, 18, 24, 36, 48, 72];

function fmtHMS(totalSec){
  const s = Math.max(0, Math.floor(totalSec));
  const hh = Math.floor(s/3600);
  const mm = Math.floor((s%3600)/60);
  const ss = s%60;
  return `${hh}h ${String(mm).padStart(2,'0')}m ${String(ss).padStart(2,'0')}s`;
}

function FastingSummary({fast, onOpen}){
  const [now, setNow] = useState(Date.now());
  useEffect(()=>{
    if(!fast) return;
    const iv = setInterval(()=> setNow(Date.now()), 1000);
    return ()=>clearInterval(iv);
  }, [fast]);
  const elapsedSec = fast ? Math.max(0, Math.floor((now - new Date(fast.startTime).getTime())/1000)) : 0;
  const hh = Math.floor(elapsedSec/3600), mm = Math.floor((elapsedSec%3600)/60);
  return (
    <button className="fast-summary" onClick={onOpen}>
      <div className="fast-summary-left">
        <div className="fast-summary-icon"><Icon name="clock" size={18} color="var(--accent)"/></div>
        <div>
          <div className="fast-summary-title">{fast ? 'Fast in progress' : 'No active fast'}</div>
          <div className="fast-summary-sub">{fast ? `${hh}h ${mm}m elapsed · goal ${fast.goalHours}h` : 'Tap to start or view history'}</div>
        </div>
      </div>
      <Icon name="chevronRight" size={16} color="var(--text-faint)"/>
    </button>
  );
}

function FastingView({fast, setFast, fastHistory, setFastHistory, onBack}){
  const [now, setNow] = useState(Date.now());
  const [goalPick, setGoalPick] = useState(16);
  const [displayMode, setDisplayMode] = useState('elapsed');
  const notifiedRef = useRef(false);

  useEffect(()=>{
    if(!fast) return;
    const tick = () => setNow(Date.now());
    const iv = setInterval(tick, 1000);
    document.addEventListener('visibilitychange', tick);
    window.addEventListener('focus', tick);
    return () => { clearInterval(iv); document.removeEventListener('visibilitychange', tick); window.removeEventListener('focus', tick); };
  }, [fast]);

  const elapsedSec = fast ? Math.max(0, Math.floor((now - new Date(fast.startTime).getTime())/1000)) : 0;
  const goalHours = fast ? fast.goalHours : goalPick;
  const goalSec = goalHours*3600;
  const remainingSec = Math.max(0, goalSec - elapsedSec);
  const overSec = Math.max(0, elapsedSec - goalSec);
  const goalReached = !!fast && elapsedSec >= goalSec;
  const pct = fast ? Math.min(100, (elapsedSec/goalSec)*100) : 0;

  useEffect(()=>{
    if(fast && goalReached && !notifiedRef.current){
      notifiedRef.current = true;
      notify('Fast complete', `You hit your ${fast.goalHours}h goal.`);
      if(navigator.vibrate){ try{ navigator.vibrate([120,80,120,80,120]); }catch(e){} }
    }
    if(!fast) notifiedRef.current = false;
  }, [goalReached, fast]);

  const startFast = () => { setFast({startTime:new Date().toISOString(), goalHours:goalPick}); notifiedRef.current=false; };
  const endFast = () => {
    if(!fast) return;
    setFastHistory(prev=>[...prev, {
      start:fast.startTime, end:new Date().toISOString(),
      hours:Number((elapsedSec/3600).toFixed(2)), goalHours:fast.goalHours, completed:goalReached,
    }]);
    setFast(null);
  };

  const r=80, ringC=2*Math.PI*r;
  const ringOffset = ringC*(1-Math.min(1,pct/100));
  const mainSec = displayMode==='elapsed' ? elapsedSec : (goalReached ? overSec : remainingSec);
  const mainLabel = displayMode==='elapsed' ? 'Elapsed' : (goalReached ? 'Over Goal' : 'Remaining');

  return (
    <div>
      <div className="session-header">
        <button className="back-btn" onClick={onBack}><Icon name="back" size={18}/></button>
        <div className="titles">
          <div className="t">Fasting</div>
          <div className="s">{fast ? `Goal: ${fast.goalHours}h` : 'Not currently fasting'}</div>
        </div>
      </div>

      {!fast ? (
        <div className="stats-card" style={{margin:'0 20px'}}>
          <div className="fast-goal-label">Fast Goal</div>
          <div className="fast-presets">
            {FAST_PRESETS.map(h=>(
              <button key={h} className={goalPick===h?'active':''} onClick={()=>setGoalPick(h)}>{h}h</button>
            ))}
          </div>
          <button className="log-btn" onClick={startFast}>Start Fast</button>
        </div>
      ) : (
        <div className="stats-card" style={{margin:'0 20px'}}>
          <div className="mode-toggle" style={{margin:'0 0 16px'}}>
            <button className={displayMode==='elapsed'?'active':''} onClick={()=>setDisplayMode('elapsed')}>Elapsed</button>
            <button className={displayMode==='remaining'?'active':''} onClick={()=>setDisplayMode('remaining')}>{goalReached ? 'Over Goal' : 'Remaining'}</button>
          </div>
          <div className="fast-ring-wrap" style={{width:180,height:180}}>
            <svg width="180" height="180" viewBox="0 0 180 180">
              <circle cx="90" cy="90" r={r} className="fast-ring-bg"/>
              <circle cx="90" cy="90" r={r} className="fast-ring-fg" strokeDasharray={ringC} strokeDashoffset={ringOffset} transform="rotate(-90 90 90)"/>
            </svg>
            <div className="fast-ring-label">
              <div className="fast-elapsed">{fmtHMS(mainSec)}</div>
              <div className="fast-goal-sub">{mainLabel}{goalReached && displayMode==='elapsed' ? ' · Goal reached!' : ''}</div>
            </div>
          </div>
          <div className="fast-meta">Started {new Date(fast.startTime).toLocaleString(undefined,{weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'})}</div>
          <button className="btn-secondary" style={{width:'100%', marginTop:14}} onClick={endFast}>End Fast</button>
        </div>
      )}

      <div className="section-title">History</div>
      <div className="stats-card" style={{margin:'0 20px'}}>
        {fastHistory.length===0 && <div className="empty-hint">No fasts logged yet</div>}
        <div className="history-list" style={{maxHeight:'none'}}>
          {[...fastHistory].reverse().map((f,i)=>(
            <div className="history-row" key={i}>
              <span className="d">{new Date(f.start).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}</span>
              <span className="vals">{f.hours}h {f.completed ? '· goal hit' : `/ ${f.goalHours}h`}</span>
            </div>
          ))}
        </div>
      </div>
      <div className="home-footer-space"></div>
    </div>
  );
}

function ExerciseHistoryModal({name, sessionId, stepIndex, exIdx, logs, pr, onClose}){
  const chartRef = useRef(null);

  const weekly = [];
  for(let w=1; w<=TOTAL_WEEKS; w++){
    const entry = logs[`w${w}_${sessionId}_${stepIndex}_${exIdx}`];
    if(entry && entry.done && entry.done.some(Boolean)){
      const wt = parseFloat(entry.weight);
      if(isFinite(wt)) weekly.push({week:w, weight:wt});
    }
  }
  useEffect(()=>{
    if(!chartRef.current) return;
    if(chartInstance.current) chartInstance.current.destroy();
    if(weekly.length<1) return;
    const ctx = chartRef.current.getContext('2d');
    chartInstance.current = new Chart(ctx, {
      type:'line',
      data:{
        labels: weekly.map(w=>`Wk ${w.week}`),
        datasets:[{ data: weekly.map(w=>w.weight), borderColor:'#2fe6c4', borderWidth:2.5, pointRadius:3,
          pointBackgroundColor:'#2fe6c4', pointBorderColor:'#08090b', pointBorderWidth:1.5, tension:0.3, fill:false }]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{legend:{display:false}},
        scales:{
          x:{grid:{display:false}, ticks:{color:'#565c66', font:{size:9}}},
          y:{grid:{color:'rgba(255,255,255,0.05)'}, ticks:{color:'#565c66', font:{size:9}}}
        }
      }
    });
  }, [weekly.length]);

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-sheet" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">{name}</div>
        {pr && <div className="step-note" style={{marginBottom:12}}>Estimated 1RM PR: {Math.round(pr.est1RM)}kg (from {pr.weight}kg × {pr.reps})</div>}
        {weekly.length>0 ? (

function targetLine(ex){
  const parts = [];
  if(ex.sets) parts.push(`${ex.sets} × ${ex.reps}`);
  else parts.push(ex.reps);
  return parts.join(' ');
}

function groupKindLabel(g){
  switch(g.type){
    case 'straight': return g.title;
    case 'superset': return 'Superset';
    case 'triset': return 'Tri-Set';
    case 'finisher': return 'Finisher';
    case 'circuit': return 'Circuit';
    default: return g.title;
  }
}

function StepCard({group, sessionId, week, stepIndex, logs, setLogs, prs, setPrs, swaps, setSwaps, setToast}){
  const isRoundsBased = !!group.rounds;
  const nSets = isRoundsBased ? group.rounds : null;
  const logKey = `w${week}_${sessionId}_${stepIndex}`;
  const prevLogKey = week>1 ? `w${week-1}_${sessionId}_${stepIndex}` : null;

  const getExRest = (exIdx) => {
    if(isRoundsBased) return exIdx===group.exercises.length-1 ? (group.restBetweenRounds||0) : 0;
    if(group.type==='straight') return group.exercises[exIdx].rest || 60;
    return exIdx===group.exercises.length-1 ? (group.restAfter||60) : 0;
  };

  const [triggerTok, setTriggerTok] = useState(0);
  const [activeRest, setActiveRest] = useState(0);
  const [editingIdx, setEditingIdx] = useState(null);
  const [historyIdx, setHistoryIdx] = useState(null);
  const seeded = useRef(false);

  const getEntry = (exIdx) => {
    const k = `${logKey}_${exIdx}`;
    return logs[k] || {weight:'', reps:'', rpe:'', done:[]};
  };
  const updateEntry = (exIdx, patch) => {
    const k = `${logKey}_${exIdx}`;
    setLogs(prev=> ({...prev, [k]: {...(prev[k]||{weight:'',reps:'',rpe:'',done:[]}), ...patch}}));
  };

  useEffect(()=>{
    if(seeded.current || !prevLogKey || isRoundsBased) return;
    seeded.current = true;
    group.exercises.forEach((ex, exIdx)=>{
      const curK = `${logKey}_${exIdx}`;
      if(logs[curK]) return;
      const prevEntry = logs[`${prevLogKey}_${exIdx}`];
      if(!prevEntry || !prevEntry.weight) return;
      const count = ex.sets || 0;
      const allDone = count>0 && (prevEntry.done||[]).filter(Boolean).length >= count;
      const prevW = parseFloat(prevEntry.weight);
      if(!isFinite(prevW)) return;
      const suggested = allDone ? roundTo(prevW+2.5, 2.5) : prevW;
      updateEntry(exIdx, {weight:String(suggested), reps: prevEntry.reps || ''});
    });
    // eslint-disable-next-line
  }, []);

  const slotKey = (exIdx) => `${sessionId}_${stepIndex}_${exIdx}`;

  const toggleSet = (exIdx, setIdx, exRest) => {
    const entry = getEntry(exIdx);
    const done = [...(entry.done||[])];
    const willComplete = !done[setIdx];
    done[setIdx] = willComplete;
    updateEntry(exIdx, {done});
    if(willComplete){
      const w = parseFloat(entry.weight);
      const r = firstNumber(entry.reps) || firstNumber(group.exercises[exIdx].reps);
      if(isFinite(w) && w>0 && r){
        const est = estimate1RM(w, r);
        const key = slotKey(exIdx);
        const prevPR = prs[key];
        if(!prevPR || est > prevPR.est1RM + 0.01){
          const name = swaps[key] || group.exercises[exIdx].name;
          setPrs(p=>({...p, [key]: {est1RM:est, weight:w, reps:r, date:new Date().toISOString(), name}}));
          if(setToast) setToast(`New PR — ${name}: ${w}kg × ${r}`);
        }
      }
    }
    if(willComplete && exRest>0){
      setActiveRest(exRest);
      setTriggerTok(t=>t+1);
    }
  };

  const setCountFor = (exIdx) => isRoundsBased ? nSets : group.exercises[exIdx].sets;

  return (
    <div className="step-card">
      <RestTimerBox duration={activeRest} triggerToken={triggerTok} />
      <div className="step-kind">{groupKindLabel(group)}</div>
      <div className="step-title">{group.title}</div>
      {group.note && <div className="step-note">{group.note}</div>}

      {group.exercises.map((ex, exIdx)=>{
        const entry = getEntry(exIdx);
        const count = setCountFor(exIdx);
        const isFollow = (group.type==='superset'||group.type==='triset') && exIdx>0;
        const key = slotKey(exIdx);
        const displayName = swaps[key] || ex.name;
        const weightNum = parseFloat(entry.weight);
        const showWarmup = !isRoundsBased && isFinite(weightNum) && weightNum>0 && (count||0)>=3;
        const showPlates = !isRoundsBased && isFinite(weightNum) && weightNum>=20 && displayName.toLowerCase().includes('barbell');
        const plateInfo = showPlates ? (computePlates(weightNum)||[]) : [];
        const pr = prs[key];
        return (
          <div className="ex-row" key={exIdx}>
            {isFollow && <div className="ex-connector">↳ then</div>}
            <div className="ex-name-row">
              {editingIdx===exIdx ? (
                <input className="ex-edit-input" autoFocus defaultValue={displayName}
                  onBlur={e=>{ const v=e.target.value.trim(); setSwaps(s=>({...s, [key]: v||ex.name})); setEditingIdx(null); }}
                  onKeyDown={e=>{ if(e.key==='Enter') e.target.blur(); }} />
              ) : (
                <div className="ex-name" onClick={()=>setHistoryIdx(exIdx)}>{displayName}</div>
              )}
              <button className="ex-edit-btn" onClick={()=>setEditingIdx(editingIdx===exIdx?null:exIdx)}>
                <Icon name="edit" size={13}/>
              </button>
            </div>
            <div className="ex-target">{targetLine(ex)}{ex.note ? ` · ${ex.note}` : ''}{pr ? ` · PR ${pr.weight}kg×${pr.reps}` : ''}</div>
            {!isRoundsBased && (
              <div className="ex-inputs">
                <div className="fld">
                  <label>Weight (kg)</label>
                  <input type="number" inputMode="decimal" placeholder="—" value={entry.weight}
                    onChange={e=>updateEntry(exIdx, {weight:e.target.value})}/>
                </div>
                <div className="fld">
                  <label>Reps</label>
                  <input type="text" placeholder={String(ex.reps)} value={entry.reps}
                    onChange={e=>updateEntry(exIdx, {reps:e.target.value})}/>
                </div>
                <div className="fld">
                  <label>RPE</label>
                  <input type="number" inputMode="decimal" min="1" max="10" placeholder="—" value={entry.rpe||''}
                    onChange={e=>updateEntry(exIdx, {rpe:e.target.value})}/>
                </div>
              </div>
            )}
            {showWarmup && (
              <div className="ex-hint">Warm-up: {computeWarmup(weightNum).map(s=>`${s.w}kg×${s.reps}`).join(' · ')}</div>
            )}
            {showPlates && (
              <div className="ex-hint">Per side: {plateInfo.length ? plateInfo.join(' + ')+'kg' : 'bar only'}</div>
            )}
            <div className="set-dots">
              {Array.from({length: count||0}).map((_,si)=>(
                <div key={si} className={"set-dot " + ((entry.done||[])[si] ? 'filled':'')}
                  onClick={()=>toggleSet(exIdx, si, getExRest(exIdx))}>
                  {(entry.done||[])[si] ? '✓' : si+1}
                </div>
              ))}
            </div>
          </div>
        );
      })}
      {historyIdx!=null && (
        <ExerciseHistoryModal
          name={swaps[slotKey(historyIdx)] || group.exercises[historyIdx].name}
          sessionId={sessionId} stepIndex={stepIndex} exIdx={historyIdx} logs={logs}
          pr={prs[slotKey(historyIdx)]}
          onClose={()=>setHistoryIdx(null)} />
      )}
    </div>
  );
}

function OverviewList({session, onJump, swaps}){
  return (
    <div className="ov-list">
      {session.groups.map((g, i)=>(
        <button className="ov-group" key={i} onClick={()=>onJump(i)}>
          <div className="ov-kind">{groupKindLabel(g)}{g.rounds ? ` · ${g.rounds} rounds` : ''}</div>
          <div className="ov-title">{g.title}</div>
          <div className="ov-exlist">
            {g.exercises.map((ex,j)=>{
              const nm = (swaps && swaps[`${session.id}_${i}_${j}`]) || ex.name;
              const label = (g.type==='superset'||g.type==='triset') && j>0 ? '↳ '+nm : nm;
              return <div className="ov-ex" key={j}><span>{label}</span><b>{targetLine(ex)}</b></div>;
            })}
          </div>
          {(g.restAfter || g.restBetweenRounds) ? <div className="ov-rest">Rest {g.restAfter||g.restBetweenRounds}s after</div> : null}
        </button>
      ))}
    </div>
  );
}

function SessionView({session, week, logs, setLogs, prs, setPrs, swaps, setSwaps, setToast, onBack, onFinish}){
  const [mode, setMode] = useState('coach');
  const [stepIndex, setStepIndex] = useState(0);
  const total = session.groups.length;
  const group = session.groups[stepIndex];
  const stepKey = `${session.id}_w${week}_${stepIndex}`;

  const jump = (idx) => { setStepIndex(idx); setMode('coach'); };

  return (
    <div>
      <div className="session-header">
        <button className="back-btn" onClick={onBack}><Icon name="back" size={18}/></button>
        <div className="titles">
          <div className="t">{session.name}</div>
          <div className="s">{session.subtitle} · Week {week}</div>
        </div>
      </div>

      <div className="mode-toggle">
        <button className={mode==='coach'?'active':''} onClick={()=>setMode('coach')}>Coach Mode</button>
        <button className={mode==='overview'?'active':''} onClick={()=>setMode('overview')}>Overview</button>
      </div>

      {mode==='coach' ? (
        <React.Fragment>
          <div className="progress-dots">
            {session.groups.map((_,i)=>(
              <div key={i} className={"dot " + (i<stepIndex?'done':i===stepIndex?'current':'')}></div>
            ))}
          </div>
          <StepCard group={group} sessionId={session.id} week={week} stepIndex={stepIndex}
            logs={logs} setLogs={setLogs} prs={prs} setPrs={setPrs} swaps={swaps} setSwaps={setSwaps}
            setToast={setToast} key={stepKey}/>
          <div className="step-footer">
            <button className="nav-btn" disabled={stepIndex===0} onClick={()=>setStepIndex(i=>Math.max(0,i-1))}>
              <Icon name="chevronLeft" size={16}/> Prev
            </button>
            {stepIndex<total-1 ? (
              <button className="nav-btn primary" onClick={()=>setStepIndex(i=>Math.min(total-1,i+1))}>
                Next <Icon name="chevronRight" size={16}/>
              </button>
            ) : (
              <button className="nav-btn finish" onClick={onFinish}>
                <Icon name="flame" size={16}/> Finish Workout
              </button>
            )}
          </div>
        </React.Fragment>
      ) : (
        <OverviewList session={session} onJump={jump} swaps={swaps}/>
      )}
      <div className="home-footer-space"></div>
    </div>
  );
}

/* ---------------- APP ---------------- */
function App(){
  const [week, setWeek] = useState(()=> load('ftx_week', 1));
  const [screen, setScreen] = useState('home');
  const [activeSessionId, setActiveSessionId] = useState(null);
  const [logs, setLogs] = useState(()=> load('ftx_logs', {}));
  const [stats, setStats] = useState(()=> load('ftx_bodystats', []));
  const [height, setHeight] = useState(()=> load('ftx_height', null));
  const [unit, setUnit] = useState(()=> load('ftx_unit', 'kg'));
  const [prs, setPrs] = useState(()=> load('ftx_prs', {}));
  const [swaps, setSwaps] = useState(()=> load('ftx_swaps', {}));
  const [completions, setCompletions] = useState(()=> load('ftx_completions', []));
  const [fast, setFast] = useState(()=> load('ftx_fast', null));
  const [fastHistory, setFastHistory] = useState(()=> load('ftx_fastHistory', []));
  const [spotifyClientId, setSpotifyClientId] = useState(()=> load('ftx_spotify_client_id', ''));
  const [spotifyTokens, setSpotifyTokens] = useState(()=> load('ftx_spotify_tokens', null));
  const [showSettings, setShowSettings] = useState(false);
  const [toast, setToast] = useState(null);

  useEffect(()=> save('ftx_week', week), [week]);
  useEffect(()=> save('ftx_logs', logs), [logs]);
  useEffect(()=> save('ftx_bodystats', stats), [stats]);
  useEffect(()=> save('ftx_height', height), [height]);
  useEffect(()=> save('ftx_unit', unit), [unit]);
  useEffect(()=> save('ftx_prs', prs), [prs]);
  useEffect(()=> save('ftx_swaps', swaps), [swaps]);
  useEffect(()=> save('ftx_completions', completions), [completions]);
  useEffect(()=> save('ftx_fast', fast), [fast]);
  useEffect(()=> save('ftx_fastHistory', fastHistory), [fastHistory]);
  useEffect(()=> save('ftx_spotify_client_id', spotifyClientId), [spotifyClientId]);
  useEffect(()=> save('ftx_spotify_tokens', spotifyTokens), [spotifyTokens]);

  useEffect(()=>{
    if(!toast) return;
    const t = setTimeout(()=>setToast(null), 4500);
    return ()=>clearTimeout(t);
  }, [toast]);

  useEffect(()=>{
    const unlock = () => { getAudioCtx(); };
    document.addEventListener('pointerdown', unlock, {once:true});
    return () => document.removeEventListener('pointerdown', unlock);
  }, []);

  useEffect(()=>{
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    if(code && spotifyClientId){
      exchangeSpotifyCode(spotifyClientId, code).then(data=>{
        setSpotifyTokens({access_token:data.access_token, refresh_token:data.refresh_token, expires_at: Date.now()+data.expires_in*1000});
        setToast('Spotify connected');
        window.history.replaceState({}, '', window.location.pathname);
      }).catch(()=>{
        setToast('Spotify connection failed');
        window.history.replaceState({}, '', window.location.pathname);
      });
    } else if(code){
      window.history.replaceState({}, '', window.location.pathname);
    }
    // eslint-disable-next-line
  }, []);

  const openSession = (id) => { setActiveSessionId(id); setScreen('session'); };
  const openFasting = () => setScreen('fasting');
  const goHome = () => { setScreen('home'); setActiveSessionId(null); };
  const activeSession = SESSIONS.find(s=>s.id===activeSessionId);

  const finishWorkout = () => {
    if(!activeSession){ goHome(); return; }
    const volume = computeSessionVolume(activeSession, week, logs);
    const sessionsThisWeekSoFar = completions.filter(c=>c.week===week).length;
    setCompletions(prev=>[...prev, {date:new Date().toISOString(), week, sessionId:activeSession.id, volume}]);
    setToast(`Session complete · ${Math.round(volume).toLocaleString()}kg volume · ${sessionsThisWeekSoFar+1} session(s) this week`);
    goHome();
  };

  const exportData = () => {
    const payload = {week, logs, stats, height, unit, prs, swaps, completions, fast, fastHistory, spotifyClientId, exportedAt: new Date().toISOString()};
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `forge-training-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setToast('Backup downloaded');
  };

  const importData = (file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try{
        const data = JSON.parse(e.target.result);
        if(data.week) setWeek(data.week);
        if(data.logs) setLogs(data.logs);
        if(data.stats) setStats(data.stats);
        if(data.height!=null) setHeight(data.height);
        if(data.unit) setUnit(data.unit);
        if(data.prs) setPrs(data.prs);
        if(data.swaps) setSwaps(data.swaps);
        if(data.completions) setCompletions(data.completions);
        if(data.fast!==undefined) setFast(data.fast);
        if(data.fastHistory) setFastHistory(data.fastHistory);
        if(data.spotifyClientId) setSpotifyClientId(data.spotifyClientId);
        setToast('Data imported');
      }catch(err){
        setToast('Import failed — invalid file');
      }
    };
    reader.readAsText(file);
  };

  return (
    <div className={spotifyTokens ? 'has-ticker' : ''}>
      {screen==='home' && (
        <Home week={week} setWeek={setWeek} onOpenSession={openSession}
          stats={stats} setStats={setStats} height={height} setHeight={setHeight}
          unit={unit} onOpenSettings={()=>setShowSettings(true)} completions={completions}
          fast={fast} onOpenFasting={openFasting}/>
      )}
      {screen==='session' && activeSession && (
        <SessionView session={activeSession} week={week} logs={logs} setLogs={setLogs}
          prs={prs} setPrs={setPrs} swaps={swaps} setSwaps={setSwaps} setToast={setToast}
          onBack={goHome} onFinish={finishWorkout}/>
      )}
      {screen==='fasting' && (
        <FastingView fast={fast} setFast={setFast} fastHistory={fastHistory} setFastHistory={setFastHistory} onBack={goHome}/>
      )}
      {toast && <div className="toast">{toast}</div>}
      {showSettings && (
        <SettingsModal unit={unit} setUnit={setUnit} onClose={()=>setShowSettings(false)}
          onExport={exportData} onImport={importData}
          spotifyClientId={spotifyClientId} setSpotifyClientId={setSpotifyClientId}
          spotifyTokens={spotifyTokens} setSpotifyTokens={setSpotifyTokens} setToast={setToast} />
      )}
      <SpotifyTicker clientId={spotifyClientId} tokens={spotifyTokens} setTokens={setSpotifyTokens}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
