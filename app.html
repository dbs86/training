<link rel="apple-touch-startup-image" media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/splash-1206x2622.png" />
<link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/splash-1290x2796.png" />
<link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/splash-1179x2556.png" />
<link rel="apple-touch-startup-image" media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/splash-1284x2778.png" />
<link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/splash-1170x2532.png" />
<link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="./splash/splash-1125x2436.png" />
<link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="./splash/splash-828x1792.png" />

<title>DBS PPLX</title>
<script>
  /* Apply saved theme before first paint (no flash) */
  (function(){
    var pref = 'system';
    try { var raw = localStorage.getItem('ftx_theme'); if(raw) pref = JSON.parse(raw); } catch(e){}
    var dark = true;
    try { dark = pref === 'system' ? window.matchMedia('(prefers-color-scheme: dark)').matches : pref === 'dark'; } catch(e){}
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    var m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', dark ? '#0B0C0F' : '#F2F3F7');
  })();
</script>
<style>
  /* ================= TOKENS ================= */
  :root, [data-theme="dark"]{
    --bg:#0B0C0F; --s1:#15171B; --s2:#1C1F24; --s3:#262A31; --s4:#30343C;
    --hair:rgba(255,255,255,0.06); --hair2:rgba(255,255,255,0.10);
    --text:#F5F6F8; --t2:#9BA1AD; --t3:#626875;
    --accent:#4C7DFF; --accent-2:#7EA2FF; --accent-rgb:76,125,255; --accent-soft:rgba(76,125,255,0.14); --accent-ink:#FFFFFF;
    --green:#30D158; --green-soft:rgba(48,209,88,0.14);
    --orange:#FF9F0A; --orange-soft:rgba(255,159,10,0.14);
    --red:#FF453A; --red-soft:rgba(255,69,58,0.12);
    --shadow:0 1px 0 rgba(255,255,255,0.035) inset, 0 20px 40px -26px rgba(0,0,0,0.85);
    --shadow-float:0 18px 44px -14px rgba(0,0,0,0.7);
    --bar:rgba(18,20,24,0.78);
    --hero:linear-gradient(180deg, rgba(76,125,255,0.16) 0%, rgba(76,125,255,0.03) 55%, rgba(76,125,255,0) 100%);
    --backdrop:rgba(0,0,0,0.55);
    --chart-grid:rgba(255,255,255,0.06);
    color-scheme:dark;
  }
  [data-theme="light"]{
    --bg:#F2F3F7; --s1:#FFFFFF; --s2:#F3F4F7; --s3:#E5E7EC; --s4:#D7DAE1;
    --hair:rgba(10,14,30,0.07); --hair2:rgba(10,14,30,0.11);
    --text:#0C0E12; --t2:#5E6573; --t3:#9AA0AB;
    --accent:#2F63F0; --accent-2:#2F63F0; --accent-rgb:47,99,240; --accent-soft:rgba(47,99,240,0.09); --accent-ink:#FFFFFF;
    --green:#1A9E48; --green-soft:rgba(26,158,72,0.10);
    --orange:#D97706; --orange-soft:rgba(217,119,6,0.10);
    --red:#E0453B; --red-soft:rgba(224,69,59,0.09);
    --shadow:0 1px 2px rgba(10,14,30,0.04), 0 14px 30px -20px rgba(10,14,30,0.18);
    --shadow-float:0 16px 40px -16px rgba(10,14,30,0.28);
    --bar:rgba(250,250,252,0.82);
    --hero:linear-gradient(180deg, rgba(47,99,240,0.09) 0%, rgba(47,99,240,0) 70%);
    --backdrop:rgba(10,14,30,0.30);
    --chart-grid:rgba(10,14,30,0.07);
    color-scheme:light;
  }
  :root{
    --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-num:ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    --gutter:18px;
    --safe-t:env(safe-area-inset-top);
    --safe-b:env(safe-area-inset-bottom);
    --ease:cubic-bezier(.2,.8,.2,1);
    --spring:cubic-bezier(.32,1.24,.46,1);
  }

  /* ================= BASE ================= */
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:var(--font); font-size:15px; line-height:1.4; min-height:100vh; overscroll-behavior-y:none; -webkit-font-smoothing:antialiased; transition:background-color .3s ease, color .3s ease;}
  #root{max-width:520px; margin:0 auto; min-height:100vh; position:relative;}
  ::-webkit-scrollbar{display:none;} *{scrollbar-width:none;}
  button{font-family:inherit; cursor:pointer; color:inherit; text-align:inherit; background:none; border:none; padding:0; font-size:inherit; -webkit-user-select:none; user-select:none;}
  button:disabled{cursor:default;}
  input,select,textarea{font-family:inherit;}
  h1,h2,h3,p{margin:0;}
  svg{display:block; flex-shrink:0;}
  .num{font-family:var(--font-num); font-variant-numeric:tabular-nums;}
  .t2{color:var(--t2);} .t3{color:var(--t3);}
  .accent-txt{color:var(--accent-2);}
  .green-txt{color:var(--green);}
  .press{transition:transform .18s var(--ease), background-color .2s, opacity .2s;}
  .press:active{transform:scale(.975);}

  /* ================= SCREENS & TRANSITIONS ================= */
  .screen{min-height:100vh; padding:calc(var(--safe-t) + 6px) var(--gutter) calc(var(--safe-b) + 120px);}
  .screen.detail{padding-bottom:calc(var(--safe-b) + 150px);}
  .anim-tab{animation:tabIn .32s var(--ease) backwards;}
  .anim-push > *:not(.dock):not(.sheet-bg){animation:pushIn .42s var(--ease) backwards;}
  .anim-pop{animation:popIn .34s var(--ease) both;}
  @keyframes tabIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
  @keyframes pushIn{from{opacity:0; transform:translateX(36px);} to{opacity:1; transform:none;}}
  @keyframes popIn{from{opacity:0; transform:translateX(-24px);} to{opacity:1; transform:none;}}
  .stagger > *{animation:rise .5s var(--ease) backwards;}
  .stagger > *:nth-child(1){animation-delay:.02s;} .stagger > *:nth-child(2){animation-delay:.06s;} .stagger > *:nth-child(3){animation-delay:.1s;}
  .stagger > *:nth-child(4){animation-delay:.14s;} .stagger > *:nth-child(5){animation-delay:.18s;} .stagger > *:nth-child(6){animation-delay:.22s;}
  .stagger > *:nth-child(7){animation-delay:.26s;} .stagger > *:nth-child(n+8){animation-delay:.3s;}
  @keyframes rise{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }

  /* ================= NAV BARS ================= */
  .topbar{position:sticky; top:0; z-index:40; margin:0 calc(var(--gutter) * -1); padding:calc(var(--safe-t) + 6px) var(--gutter) 8px; display:grid; grid-template-columns:44px 1fr 44px; align-items:center; gap:8px; transition:background-color .25s, border-color .25s, backdrop-filter .25s; border-bottom:0.5px solid transparent;}
  .screen > .topbar{margin-top:calc((var(--safe-t) + 6px) * -1);}
  .topbar.scrolled{background:var(--bar); backdrop-filter:blur(22px) saturate(1.6); -webkit-backdrop-filter:blur(22px) saturate(1.6); border-bottom-color:var(--hair2);}
  .topbar .mid{text-align:center; min-width:0; transition:opacity .2s;}
  .topbar .mid b{display:block; font-size:16px; font-weight:600; letter-spacing:-0.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .topbar .mid span{display:block; font-size:12.5px; color:var(--t3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .topbar .mid.fade{opacity:0;}
  .topbar.scrolled .mid.fade{opacity:1;}
  .topbar .right{display:flex; justify-content:flex-end;}
  .cbtn{width:38px; height:38px; border-radius:50%; background:var(--s2); display:flex; align-items:center; justify-content:center; color:var(--text); transition:transform .18s var(--ease), background-color .2s;}
  .cbtn:active{transform:scale(.92); background:var(--s3);}
  .cbtn.on{background:var(--accent-soft); color:var(--accent-2);}
  .cbtn.sm{width:32px; height:32px;}
  .cbtn:disabled{opacity:.35;}

  .large{margin:4px 2px 0; display:flex; align-items:flex-end; justify-content:space-between; gap:12px;}
  .large h1{font-family:var(--font-display); font-size:34px; font-weight:700; letter-spacing:-0.03em; line-height:1.08; margin-top:2px;}
  .eyebrow{font-size:12px; font-weight:600; color:var(--t3); letter-spacing:.06em; text-transform:uppercase;}
  .avatar{width:38px; height:38px; border-radius:50%; background:linear-gradient(145deg, var(--s3), var(--s2)); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; border:0.5px solid var(--hair2); color:var(--text);}

  .detail-head{margin:14px 2px 0;}
  .detail-head h1{font-family:var(--font-display); font-size:30px; font-weight:700; letter-spacing:-0.03em; line-height:1.1; margin-top:4px;}
  .detail-head .sub{font-size:14.5px; color:var(--t2); margin-top:5px;}

  /* ================= SECTIONS / CARDS ================= */
  .sec{margin-top:28px;}
  .sec-h{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:0 4px 10px;}
  .sec-h h3{font-family:var(--font-display); font-size:20px; font-weight:700; letter-spacing:-0.02em;}
  .sec-h .link{font-size:14px; color:var(--accent-2); font-weight:500;}
  .sec-h .meta{font-size:13px; color:var(--t3); font-weight:500;}
  .card{background:var(--s1); border-radius:22px; box-shadow:var(--shadow); border:0.5px solid var(--hair);}
  .card.pad{padding:16px;}
  .card.hero{background-image:var(--hero);}
  .inset{background:var(--s2); border-radius:16px;}

  .pill{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:4px 9px; border-radius:99px; background:var(--s2); color:var(--t2); white-space:nowrap;}
  .pill.accent{background:var(--accent-soft); color:var(--accent-2);}
  .pill.green{background:var(--green-soft); color:var(--green);}
  .pill.orange{background:var(--orange-soft); color:var(--orange);}
  .dot{width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0; background:var(--c, var(--accent));}

  .btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; height:52px; padding:0 18px; border-radius:16px; font-size:16px; font-weight:600; letter-spacing:-0.01em; transition:transform .18s var(--ease), opacity .2s, background-color .2s;}
  .btn:active{transform:scale(.975);}
  .btn:disabled{opacity:.38; transform:none;}
  .btn.sm{height:40px; border-radius:12px; font-size:14px; width:auto; padding:0 14px;}
  .btn-primary{background:var(--accent); color:var(--accent-ink); box-shadow:0 10px 24px -12px rgba(var(--accent-rgb),.9);}
  .btn-tint{background:var(--accent-soft); color:var(--accent-2);}
  .btn-ghost{background:var(--s2); color:var(--text);}
  .btn-danger{background:var(--red-soft); color:var(--red);}
  .btn-row{display:flex; gap:10px;} .btn-row > *{flex:1;}

  /* Lists (iOS grouped) */
  .list{overflow:hidden;}
  .row{display:flex; align-items:center; gap:12px; padding:13px 16px; position:relative; width:100%; text-align:left; transition:background-color .15s;}
  button.row:active{background:var(--s2);}
  .row + .row::before{content:""; position:absolute; top:0; left:var(--indent, 16px); right:0; height:0.5px; background:var(--hair2);}
  .row .grow{flex:1; min-width:0;}
  .row .t{font-size:16px; font-weight:600; letter-spacing:-0.01em;}
  .row .s{font-size:13px; color:var(--t2); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row .rt{font-size:13.5px; color:var(--t3); display:flex; align-items:center; gap:6px; white-space:nowrap;}
  .row .ico{width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:var(--s2); color:var(--t2); flex-shrink:0;}
  .row .ico.tint{background:color-mix(in srgb, var(--c, var(--accent)) 16%, transparent); color:var(--c, var(--accent-2));}

  /* Stat tiles */
  .tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .tile{padding:14px 14px 13px; min-height:116px; display:flex; flex-direction:column; text-align:left; width:100%;}
  .tile .lbl{font-size:13px; font-weight:600; color:var(--t2); display:flex; align-items:center; justify-content:space-between; gap:6px;}
  .tile .v{font-family:var(--font-num); font-size:28px; font-weight:600; letter-spacing:-0.01em; margin-top:auto; line-height:1.1;}
  .tile .v small{font-family:var(--font); font-size:13px; color:var(--t3); font-weight:500; margin-left:3px; letter-spacing:0;}
  .tile .d{font-size:12px; font-weight:600; margin-top:3px; color:var(--t3);}
  .stats{display:grid; gap:0;}
  .stats.c2{grid-template-columns:1fr 1fr;} .stats.c3{grid-template-columns:repeat(3,1fr);}
  .stat{padding:4px 12px; min-width:0;}
  .stat + .stat{border-left:0.5px solid var(--hair2);}
  .stat:first-child{padding-left:2px;}
  .stat .v{font-family:var(--font-num); font-size:26px; font-weight:600; letter-spacing:-0.01em; white-space:nowrap; line-height:1.15;}
  .stat .v small{font-family:var(--font); font-size:12.5px; color:var(--t3); font-weight:500; margin-left:2px;}
  .stat .l{font-size:12.5px; color:var(--t2); font-weight:500; margin-top:2px;}

  /* Segmented */
  .seg{display:flex; background:var(--s2); border-radius:11px; padding:2px; gap:2px; position:relative;}
  .seg button{flex:1; display:flex; align-items:center; justify-content:center; gap:6px; height:32px; border-radius:9px; font-size:13.5px; font-weight:600; color:var(--t2); transition:background-color .2s, color .2s, box-shadow .2s;}
  .seg button.on{background:var(--s4); color:var(--text); box-shadow:0 2px 6px rgba(0,0,0,.18);}
  [data-theme="light"] .seg button.on{background:#fff; box-shadow:0 1px 4px rgba(10,14,30,.12);}

  /* Number field with − / + */
  .nf{background:var(--s2); border-radius:16px; padding:9px 8px 8px; text-align:center; min-width:0;}
  .nf .k{font-size:11.5px; font-weight:600; color:var(--t3); letter-spacing:.05em; text-transform:uppercase;}
  .nf .ctl{display:flex; align-items:center; justify-content:space-between; gap:4px; margin-top:3px;}
  .nf .pm{width:36px; height:36px; border-radius:11px; background:var(--s3); display:flex; align-items:center; justify-content:center; color:var(--t2); flex-shrink:0; transition:transform .15s var(--ease), background-color .15s;}
  .nf .pm:active{transform:scale(.9); background:var(--s4);}
  .nf input{width:100%; min-width:0; background:transparent; border:none; outline:none; text-align:center; color:var(--text); font-family:var(--font-num); font-size:30px; font-weight:600; letter-spacing:-0.01em; padding:0; -moz-appearance:textfield;}
  .nf input::-webkit-outer-spin-button, .nf input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  .nf input::placeholder{color:var(--t3);}
  .stepper{display:flex; align-items:center; gap:2px; background:var(--s2); border-radius:12px; padding:3px; flex-shrink:0;}
  .stepper button{width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; color:var(--t2);}
  .stepper button:active{background:var(--s3);}
  .stepper span{min-width:30px; text-align:center; font-family:var(--font-num); font-size:19px; font-weight:600;}

  /* Rings */
  .ring{position:relative; flex-shrink:0;}
  .ring > svg{transform:rotate(-90deg);}
  .ring .track{fill:none; stroke:var(--s3);}
  .ring .arc{fill:none; stroke-linecap:round; transition:stroke-dashoffset .9s var(--ease), stroke .3s;}
  .ring .in{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;}

  /* Forms */
  .field{margin-bottom:14px;}
  .field > label, .flabel{display:block; font-size:13px; font-weight:600; color:var(--t2); margin:0 2px 7px;}
  .input{width:100%; background:var(--s2); border:1px solid transparent; border-radius:14px; height:50px; padding:0 14px; color:var(--text); font-size:17px; font-weight:500; outline:none; transition:border-color .15s, box-shadow .15s; -webkit-appearance:none; appearance:none;}
  .input:focus{border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft);}
  .input::placeholder{color:var(--t3);}
  .help{font-size:12.5px; color:var(--t3); line-height:1.5; margin-top:8px;}
  .help b{color:var(--t2); font-weight:600; word-break:break-all;}
  .empty{padding:26px 16px; text-align:center; color:var(--t2); font-size:14px;}
  .empty .ei{width:44px; height:44px; border-radius:14px; background:var(--s2); color:var(--t3); display:flex; align-items:center; justify-content:center; margin:0 auto 10px;}
  .empty b{display:block; color:var(--text); font-size:15px; font-weight:600; margin-bottom:3px;}

  .row .rt.accent-txt{color:var(--accent-2);}
  .eyebrow.accent-txt{color:var(--accent-2);}
  .input[type=number]::-webkit-outer-spin-button, .input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  .input[type=number]{-moz-appearance:textfield;}
  /* ================= TAB BAR ================= */
  .tabbar{position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:520px; z-index:60; background:var(--bar); backdrop-filter:blur(24px) saturate(1.7); -webkit-backdrop-filter:blur(24px) saturate(1.7); border-top:0.5px solid var(--hair2); display:grid; grid-template-columns:repeat(4,1fr); padding:7px 10px calc(var(--safe-b) + 6px); animation:barIn .35s var(--ease) both;}
  @keyframes barIn{from{transform:translate(-50%, 100%);} to{transform:translate(-50%,0);}}
  .tab{display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; font-weight:600; color:var(--t3); padding:2px 0; transition:color .2s;}
  .tab svg{transition:transform .25s var(--spring);}
  .tab.on{color:var(--accent-2);}
  .tab.on svg{transform:scale(1.06);}
  .tab:active svg{transform:scale(.88);}

  /* ================= BOTTOM DOCK (detail screens) ================= */
  .dock{position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:520px; z-index:50; padding:16px var(--gutter) calc(var(--safe-b) + 12px); background:linear-gradient(180deg, transparent, var(--bg) 30%);}
  .dock .btn-row{align-items:center;}
  .dock .cbtn{width:52px; height:52px; flex:0 0 52px; border-radius:16px;}
  .has-ticker .dock{padding-bottom:calc(var(--safe-b) + 78px);}

  .rest-pill{display:flex; align-items:center; gap:12px; padding:9px 10px 9px 9px; border-radius:18px; background:var(--s1); border:0.5px solid var(--hair2); box-shadow:var(--shadow-float); margin-bottom:10px; animation:restIn .35s var(--spring) both;}
  @keyframes restIn{from{opacity:0; transform:translateY(14px) scale(.98);} to{opacity:1; transform:none;}}
  .rest-pill .rt{flex:1; min-width:0;}
  .rest-pill .rt b{font-family:var(--font-num); font-size:22px; font-weight:600; display:block; line-height:1.1;}
  .rest-pill .rt span{font-size:12.5px; color:var(--t2);}
  .rest-pill .skip{font-size:14.5px; font-weight:600; color:var(--accent-2); padding:8px 10px;}
  .rest-pill.go{border-color:color-mix(in srgb, var(--green) 50%, transparent);}
  .rest-pill.go .rt b{color:var(--green);}

  /* ================= SHEETS ================= */
  .sheet-bg{position:fixed; inset:0; background:var(--backdrop); z-index:90; display:flex; align-items:flex-end; animation:bgIn .25s ease both;}
  .sheet-bg.closing{animation:bgOut .22s ease both;}
  @keyframes bgIn{from{opacity:0;} to{opacity:1;}}
  @keyframes bgOut{to{opacity:0;}}
  .sheet{width:100%; max-width:520px; margin:0 auto; background:var(--s1); border-radius:30px 30px 0 0; padding:0 20px calc(var(--safe-b) + 20px); max-height:90vh; overflow-y:auto; animation:sheetUp .42s var(--spring) both; touch-action:pan-y;}
  [data-theme="dark"] .sheet{background:#17191D;}
  .sheet.closing{animation:sheetDown .24s ease-in both;}
  @keyframes sheetUp{from{transform:translateY(100%);} to{transform:none;}}
  @keyframes sheetDown{to{transform:translateY(100%);}}
  .sheet-grab{position:sticky; top:0; z-index:2; padding:10px 0 6px; background:inherit; cursor:grab; touch-action:none;}
  .sheet-grab i{display:block; width:38px; height:5px; border-radius:3px; background:var(--s4); margin:0 auto;}
  .sheet-title{font-family:var(--font-display); font-size:24px; font-weight:700; letter-spacing:-0.02em; margin:8px 2px 16px;}
  .sheet-actions{display:flex; gap:10px; margin-top:22px;}
  .sheet-actions .btn{flex:1;} .sheet-actions .btn-primary{flex:1.5;}

  /* ================= TODAY ================= */
  .hero-card{margin-top:16px; padding:18px; position:relative; overflow:hidden;}
  .hero-top{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .hero-card h2{font-family:var(--font-display); font-size:26px; font-weight:700; letter-spacing:-0.025em; margin-top:12px; line-height:1.15;}
  .hero-card .sub{font-size:14px; color:var(--t2); margin-top:4px;}
  .hero-meta{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:16px 0;}
  .hero-meta div{font-size:12.5px; color:var(--t2);}
  .hero-meta b{display:block; font-family:var(--font-num); font-size:20px; color:var(--text); font-weight:600; margin-bottom:1px;}
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px;}
  .chips span{font-size:12.5px; padding:6px 10px; border-radius:10px; background:var(--s2); color:var(--t2); font-weight:500;}
  .done-banner{display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:14px; background:var(--green-soft); color:var(--green); font-weight:600; font-size:14.5px; margin-bottom:12px;}
  .week7{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; padding:14px 10px 12px;}
  .wd{display:flex; flex-direction:column; align-items:center; gap:7px; font-size:11.5px; font-weight:600; color:var(--t3);}
  .wd.today{color:var(--text);}

  /* ================= TRAIN ================= */
  .week-card{padding:16px 16px 14px;}
  .week-row{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .week-big{font-family:var(--font-num); font-size:40px; font-weight:600; letter-spacing:-0.02em; line-height:1;}
  .week-big small{font-family:var(--font); font-size:16px; color:var(--t3); font-weight:500; margin-left:6px; letter-spacing:0;}
  .segs{display:grid; grid-template-columns:repeat(var(--n,12),1fr); gap:4px; margin-top:14px;}
  .segs i{height:5px; border-radius:3px; background:var(--s3); display:block; transition:background-color .3s;}
  .segs i.done{background:rgba(var(--accent-rgb),.45);}
  .segs i.now{background:var(--accent);}
  .cali-strip{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; padding:14px 14px 4px;}
  .cs{display:flex; flex-direction:column; align-items:center; gap:6px; font-size:11px; font-weight:600; color:var(--t3);}
  .cs i{width:30px; height:30px; border-radius:50%; background:var(--s2); display:flex; align-items:center; justify-content:center; position:relative;}
  .cs i::after{content:""; position:absolute; width:6px; height:6px; border-radius:50%; background:var(--c); bottom:-1px; right:-1px; box-shadow:0 0 0 2px var(--s1);}
  .cs.done i{background:var(--accent); color:#fff;}
  .cs.today i{box-shadow:inset 0 0 0 2px var(--accent);}
  .cs.today{color:var(--text);}

  /* ================= PROGRESS ================= */
  .heat{display:grid; grid-template-columns:repeat(12,1fr); gap:5px; margin-top:14px;}
  .heat i{aspect-ratio:1; border-radius:6px; background:var(--s2); display:block;}
  .heat i.l1{background:rgba(var(--accent-rgb),.3);} .heat i.l2{background:rgba(var(--accent-rgb),.6);} .heat i.l3{background:var(--accent);}
  .heat i.now{box-shadow:0 0 0 2px var(--s1), 0 0 0 3.5px var(--t2);}
  .heat-l{display:flex; justify-content:space-between; font-size:11.5px; color:var(--t3); margin-top:7px; font-weight:500;}
  .chart-box{position:relative;}

  /* ================= WORKOUT ================= */
  .wsegs{display:grid; gap:4px; margin:12px 2px 0;}
  .wsegs button{height:5px; border-radius:3px; background:var(--s3); padding:0; transition:background-color .3s;}
  .wsegs button.done{background:rgba(var(--accent-rgb),.45);}
  .wsegs button.now{background:var(--accent);}
  .exc{margin-top:12px; padding:16px;}
  .exc-head{display:flex; align-items:flex-start; gap:12px;}
  .badge{min-width:32px; height:32px; padding:0 7px; border-radius:10px; background:var(--s2); display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; color:var(--t2); flex-shrink:0;}
  .exc-name{flex:1; min-width:0; text-align:left;}
  .exc-name b{display:block; font-size:17px; font-weight:600; letter-spacing:-0.015em; line-height:1.25;}
  .exc-name span{display:block; font-size:13px; color:var(--t2); margin-top:2px;}
  .exc-edit{flex:1; background:var(--s2); border:1px solid var(--accent); border-radius:12px; height:40px; padding:0 12px; color:var(--text); font-size:16px; font-weight:600; outline:none;}
  .prev{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:13px; color:var(--t2); margin-top:12px;}
  .prev b{color:var(--text); font-weight:600;}
  .nfs{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;}
  .rpe{display:grid; grid-template-columns:auto repeat(5,1fr); gap:6px; align-items:center; margin-top:10px;}
  .rpe .k, .sets-row .k{font-size:11.5px; font-weight:600; color:var(--t3); letter-spacing:.05em; padding-right:4px;}
  .rpe button{height:34px; border-radius:10px; background:var(--s2); display:flex; align-items:center; justify-content:center; font-family:var(--font-num); font-size:14.5px; font-weight:600; color:var(--t2); transition:all .15s;}
  .rpe button.on{background:var(--accent-soft); color:var(--accent-2); box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),.5);}
  .hints{margin-top:12px; padding:10px 12px; border-radius:12px; background:var(--s2); display:flex; flex-direction:column; gap:5px;}
  .hint{display:flex; gap:10px; font-size:12.5px; color:var(--t2);}
  .hint b{color:var(--t3); font-weight:600; min-width:64px;}
  .sets-row{display:flex; gap:9px; margin-top:14px; align-items:center; flex-wrap:wrap;}
  .set{width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--font-num); font-weight:600; font-size:16px; background:var(--s2); color:var(--t2); transition:transform .2s var(--spring), background-color .2s;}
  .set:active{transform:scale(.88);}
  .set.on{background:var(--accent); color:#fff; animation:pop .35s var(--spring);}
  .set.cur{background:transparent; box-shadow:inset 0 0 0 2px var(--accent); color:var(--text);}
  @keyframes pop{0%{transform:scale(.8);} 60%{transform:scale(1.08);} 100%{transform:scale(1);}}
  .link-down{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--t3); margin:10px 0 -2px 18px; letter-spacing:.02em;}
  .ov-item{padding:14px 16px; width:100%; text-align:left; margin-top:10px; display:block;}
  .ov-item.cur{box-shadow:var(--shadow), inset 0 0 0 1.5px rgba(var(--accent-rgb),.6);}
  .ov-top{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .ov-title{font-size:17px; font-weight:600; letter-spacing:-0.015em; margin-top:3px;}
  .ov-ex{display:flex; justify-content:space-between; gap:10px; font-size:14px; color:var(--t2); padding:4px 0;}
  .ov-ex b{color:var(--text); font-weight:600; white-space:nowrap; font-family:var(--font-num);}

  /* Checklist rows (warm-up, circuits, cool-down) */
  .chk{display:flex; align-items:center; gap:14px; width:100%; padding:14px 16px; text-align:left; position:relative; transition:background-color .15s; cursor:pointer;}
  .chk + .chk::before{content:""; position:absolute; top:0; left:60px; right:0; height:0.5px; background:var(--hair2);}
  .chk:active{background:var(--s2);}
  .chk .tick{width:28px; height:28px; border-radius:50%; box-shadow:inset 0 0 0 2px var(--s4); display:flex; align-items:center; justify-content:center; color:transparent; flex-shrink:0; transition:all .25s var(--spring);}
  .chk.on .tick{background:var(--accent); box-shadow:none; color:#fff; transform:scale(1.04);}
  .chk .nm{flex:1; min-width:0; font-size:16px; font-weight:600; letter-spacing:-0.01em; transition:color .2s;}
  .chk .nm small{display:block; font-size:12.5px; font-weight:500; color:var(--t3); margin-top:2px;}
  .chk.on .nm{color:var(--t2);}
  .chk .val{font-family:var(--font-num); font-size:20px; font-weight:600; color:var(--t2); white-space:nowrap;}
  .chk .val small{font-size:13px; color:var(--t3); font-weight:600;}
  .chk .det{font-size:13px; color:var(--t2); font-weight:500; text-align:right; max-width:42%;}
  .chk.running{background:var(--accent-soft);}
  .chk.static{cursor:default;} .chk.static:active{background:transparent;}
  .steps{display:grid; gap:5px; margin:14px 0 4px;}
  .step{height:32px; border-radius:10px; background:var(--s2); display:flex; align-items:center; justify-content:center; font-family:var(--font-num); font-size:14px; font-weight:600; color:var(--t3); transition:all .25s var(--ease);}
  .step.done{background:var(--accent-soft); color:var(--accent-2);}
  .step.now{background:var(--accent); color:#fff;}
  .meta-row{display:flex; justify-content:space-between; gap:10px; font-size:13px; color:var(--t2); margin:10px 4px 14px;}
  .meta-row span{display:inline-flex; align-items:center; gap:5px;}
  .meta-row b{color:var(--text); font-weight:600; font-family:var(--font-num);}
  .block-head{display:flex; align-items:flex-end; justify-content:space-between; gap:10px; padding:16px 16px 6px;}
  .block-head h2{font-family:var(--font-display); font-size:24px; font-weight:700; letter-spacing:-0.025em; line-height:1.15; margin-top:3px;}
  .block-head h2 span{color:var(--t3); font-weight:600;}

  /* EMOM */
  .emom-ring{display:flex; justify-content:center; margin-top:10px;}
  .emom-big{font-family:var(--font-num); font-size:72px; font-weight:600; letter-spacing:-0.03em; line-height:1;}
  .emom-cap{font-size:14px; color:var(--t2); margin-top:6px; font-weight:500;}
  .now-card{margin-top:18px; padding:16px 18px; display:flex; align-items:center; gap:14px;}
  .now-card h3{font-family:var(--font-display); font-size:22px; font-weight:700; letter-spacing:-0.02em; margin-top:3px;}
  .now-card .reps{font-family:var(--font-num); font-size:32px; font-weight:600; color:var(--accent-2); text-align:right; line-height:1;}
  .now-card .reps small{font-family:var(--font); font-size:11.5px; color:var(--t3); display:block; font-weight:600; margin-top:3px; letter-spacing:.04em;}
  .up-next{display:flex; align-items:center; justify-content:space-between; padding:13px 18px; margin-top:8px; font-size:14px; color:var(--t2);}
  .up-next b{color:var(--text); font-weight:600;}
  .mins{display:grid; gap:3px; margin:16px 2px 0;}
  .mins i{height:22px; border-radius:5px; background:var(--s2); display:block; transition:background-color .3s;}
  .mins i.done{background:rgba(var(--accent-rgb),.5);}
  .mins i.now{background:var(--accent);}

  /* Finish / progression */
  .fin-result{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:12px; padding:13px 14px; border-radius:14px; background:var(--s2); font-size:14px; color:var(--t2);}
  .fin-result b{color:var(--text); font-size:19px; display:flex; align-items:center; gap:8px; white-space:nowrap; font-family:var(--font-num); font-weight:600;}
  .prog-opt{display:flex; align-items:flex-start; gap:12px; width:100%; padding:13px 14px; border-radius:14px; background:var(--s2); margin-bottom:8px; text-align:left; transition:box-shadow .2s, background-color .2s;}
  .prog-opt .tick{width:24px; height:24px; border-radius:7px; box-shadow:inset 0 0 0 2px var(--s4); display:flex; align-items:center; justify-content:center; color:transparent; flex-shrink:0; margin-top:1px; transition:all .2s;}
  .prog-opt.on{background:var(--accent-soft); box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),.45);}
  .prog-opt.on .tick{background:var(--accent); box-shadow:none; color:#fff;}
  .prog-opt b{display:block; font-size:15px; font-weight:600;}
  .prog-opt small{display:block; font-size:13px; color:var(--t2); margin-top:2px;}
  .banner{display:flex; gap:12px; align-items:flex-start; padding:14px; border-radius:18px; background:var(--orange-soft); margin-top:12px;}
  .banner .t{font-weight:600; font-size:15px;}
  .banner .s{font-size:13px; color:var(--t2); margin-top:2px;}

  /* Fasting */
  .presets{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .preset{height:62px; border-radius:14px; background:var(--s2); display:flex; flex-direction:column; align-items:center; justify-content:center; transition:all .2s var(--ease);}
  .preset b{font-family:var(--font-num); font-size:22px; font-weight:600; line-height:1;}
  .preset small{font-size:11.5px; color:var(--t3); font-weight:500; margin-top:3px;}
  .preset.on{background:var(--accent-soft); box-shadow:inset 0 0 0 1.5px var(--accent);}
  .preset.on b{color:var(--accent-2);}
  .big-time{font-family:var(--font-num); font-size:44px; font-weight:600; letter-spacing:-0.02em; line-height:1;}

  /* Profile */
  .profile{display:flex; align-items:center; gap:14px; padding:16px;}
  .profile .av{width:58px; height:58px; border-radius:50%; background:linear-gradient(145deg, var(--accent), #2448C9); display:flex; align-items:center; justify-content:center; color:#fff; font-size:24px; font-weight:700;}
  .profile b{display:block; font-size:20px; font-weight:700; letter-spacing:-0.02em;}
  .profile span{font-size:13.5px; color:var(--t2);}
  .set-block{padding:14px 16px;}
  .set-block + .set-block{border-top:0.5px solid var(--hair2);}
  .set-block .h{font-size:15px; font-weight:600; margin-bottom:10px; display:flex; align-items:center; gap:10px;}


  /* ================= v4 ADDITIONS ================= */
  .chart-box{position:relative; user-select:none; -webkit-user-select:none;}
  .chart-line{stroke-dasharray:1; stroke-dashoffset:1; animation:draw 1.1s var(--ease) .1s forwards;}
  .chart-area{opacity:0; animation:fadeArea .8s ease .5s forwards;}
  .chart-dot{opacity:0; animation:fadeArea .3s ease forwards;}
  @keyframes draw{to{stroke-dashoffset:0;}}
  @keyframes fadeArea{to{opacity:1;}}
  .chart-tip{position:absolute; transform:translateX(-50%); background:var(--s1); border:0.5px solid var(--hair2); box-shadow:var(--shadow-float); border-radius:12px; padding:6px 10px; text-align:center; pointer-events:none; white-space:nowrap; animation:tipIn .18s var(--ease) both;}
  .chart-tip b{display:block; font-size:15px; font-weight:600;}
  .chart-tip span{font-size:11px; color:var(--t3); font-weight:600;}
  @keyframes tipIn{from{opacity:0; transform:translate(-50%,4px);} to{opacity:1; transform:translate(-50%,0);}}

  .exc-head .form-btn{margin-right:-2px;}
  .chk .form-btn{margin-left:-4px; background:transparent; color:var(--t3);}
  .now-card .form-btn{align-self:flex-start;}
  .form-hero{display:flex; align-items:center; gap:16px; padding:12px; border-radius:20px; background:var(--s2);}
  .form-hero svg{background:var(--s1); border-radius:16px; flex-shrink:0;}
  .form-meta b{display:block; font-size:16px; font-weight:600; margin-top:4px; line-height:1.3;}
  .form-meta{display:flex; flex-direction:column; align-items:flex-start; min-width:0;}

  .stable{margin-top:14px; border-radius:16px; background:var(--s2); padding:4px 0;}
  .sth, .str{display:grid; grid-template-columns:36px minmax(0,1fr) 66px 56px 46px; align-items:center; gap:6px; padding:0 8px 0 10px;}
  .sth{height:30px; font-size:11px; font-weight:600; color:var(--t3); letter-spacing:.05em; text-transform:uppercase;}
  .sth span:nth-child(3), .sth span:nth-child(4){text-align:center;}
  .str{height:50px; border-top:0.5px solid var(--hair); transition:background-color .2s;}
  .str .sn{font-size:15px; font-weight:600; color:var(--t2); text-align:center;}
  .str .sp{font-size:13.5px; color:var(--t3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .str .si{width:100%; height:36px; border-radius:10px; border:1px solid transparent; background:var(--s3); color:var(--text); text-align:center; font-size:17px; font-weight:600; outline:none; padding:0 4px; -webkit-appearance:none;}
  .str .si:focus{border-color:var(--accent); background:var(--s1);}
  .str .si::placeholder{color:var(--t2); opacity:.75;}
  .str .sck{width:38px; height:36px; border-radius:11px; background:var(--s3); color:var(--t3); display:flex; align-items:center; justify-content:center; justify-self:end; transition:all .2s var(--spring);}
  .str .sck:active{transform:scale(.88);}
  .str.cur{background:rgba(var(--accent-rgb),.07);}
  .str.cur .sn{color:var(--accent-2);}
  .str.done{background:var(--green-soft);}
  .str.done .sck{background:var(--green); color:#fff; animation:pop .35s var(--spring);}
  .str.done .si{background:transparent; color:var(--text);}
  .str.done .sn{color:var(--green);}
  .swipe-hint{display:flex; align-items:center; justify-content:center; gap:6px; font-size:12px; color:var(--t3); margin-top:16px; font-weight:500;}

  .summary{position:fixed; inset:0; z-index:110; background:var(--bg); overflow-y:auto; padding:calc(var(--safe-t) + 34px) var(--gutter) calc(var(--safe-b) + 110px); animation:sumIn .45s var(--ease) both;}
  .summary.closing{animation:sumOut .26s ease-in both;}
  @keyframes sumIn{from{opacity:0; transform:scale(1.04);} to{opacity:1; transform:none;}}
  @keyframes sumOut{to{opacity:0; transform:scale(.97);}}
  .summary-in{max-width:520px; margin:0 auto; text-align:center;}
  .sum-ring{display:flex; justify-content:center; animation:markIn .7s var(--spring) both;}
  .sum-check{stroke-dasharray:24; stroke-dashoffset:24; animation:checkDraw .5s .55s var(--ease) forwards;}
  .sum-check path{stroke-dasharray:24; stroke-dashoffset:24; animation:checkDraw .5s .55s var(--ease) forwards;}
  @keyframes checkDraw{to{stroke-dashoffset:0;}}
  .sum-eyebrow{margin-top:22px; animation:rise .5s .15s var(--ease) both;}
  .sum-title{font-family:var(--font-display); font-size:32px; font-weight:700; letter-spacing:-0.03em; margin-top:6px; animation:rise .5s .2s var(--ease) both;}
  .sum-sub{font-size:15px; color:var(--t2); margin-top:4px; animation:rise .5s .25s var(--ease) both;}
  .sum-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:24px; text-align:left;}
  .sum-stat{padding:16px; animation:rise .5s var(--ease) both;}
  .sum-stat .v{font-size:32px; font-weight:600; letter-spacing:-0.02em; line-height:1.1;}
  .sum-stat .v small{font-family:var(--font); font-size:14px; color:var(--t3); font-weight:500; margin-left:3px;}
  .sum-stat .l{font-size:13px; color:var(--t2); margin-top:4px; font-weight:500;}
  .sum-compare{display:flex; align-items:center; gap:8px; justify-content:center; margin-top:14px; padding:12px 14px; border-radius:14px; background:var(--s2); color:var(--t2); font-size:14px; font-weight:600; animation:rise .5s .45s var(--ease) both;}
  .sum-compare.up{background:var(--green-soft); color:var(--green);}
  .sum-compare.down{background:var(--orange-soft); color:var(--orange);}
  .sum-hl{margin-top:12px; display:flex; flex-direction:column; gap:8px; text-align:left;}
  .sum-h{display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:14px; background:var(--accent-soft); color:var(--accent-2); font-size:14.5px; font-weight:600; animation:rise .5s var(--ease) both;}
  .sum-h.gold{background:var(--orange-soft); color:var(--orange);}
  .summary-actions{position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:520px; display:flex; gap:10px; padding:16px var(--gutter) calc(var(--safe-b) + 14px); background:linear-gradient(180deg, transparent, var(--bg) 35%);}
  .summary-actions .btn{flex:1;} .summary-actions .btn-primary{flex:1.6;}

  .checkin{padding:16px; background-image:var(--hero); cursor:pointer;}
  .ck-title{font-family:var(--font-display); font-size:22px; font-weight:700; letter-spacing:-0.02em; margin-top:8px;}
  .ck-tip{display:flex; align-items:center; gap:8px; margin-top:14px; padding:10px 12px; border-radius:12px; background:var(--s2); font-size:14px; font-weight:600; color:var(--text);}
  .ck-tip svg:last-child{margin-left:auto; color:var(--t3);}
  .tip{display:flex; gap:12px; align-items:flex-start; padding:13px 14px; border-radius:16px; background:var(--s2); margin-bottom:8px;}
  .tip .ti{width:30px; height:30px; border-radius:10px; background:var(--accent-soft); color:var(--accent-2); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .tip.gold .ti{background:var(--orange-soft); color:var(--orange);}
  .tip b{display:block; font-size:15px; font-weight:600;}
  .tip span{display:block; font-size:13.5px; color:var(--t2); margin-top:2px; line-height:1.45;}


  /* ================= v5 DECLUTTER ================= */
  .hero-card{padding:20px 18px 18px;}
  .hero-card h2{font-size:28px; margin-top:10px;}
  .hero-line{font-size:15px; color:var(--t2); margin:6px 0 18px; font-weight:500;}
  .done-banner{width:100%; justify-content:flex-start; margin-bottom:0;}
  .done-banner svg:last-child{margin-left:auto;}
  .notice{display:flex; align-items:center; gap:12px; margin-top:16px; padding:12px 12px 12px 14px; border-radius:16px; background:var(--accent-soft); cursor:pointer;}
  .notice .ni{width:32px; height:32px; border-radius:10px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .notice .grow{flex:1; min-width:0;}
  .notice b{display:block; font-size:15px; font-weight:600;}
  .notice span{display:block; font-size:13px; color:var(--t2);}
  .notice .nx{width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--t2); flex-shrink:0;}
  .week7{width:100%;}
  .next-row{border-radius:20px;}
  .tile{min-height:122px;}
  .exc-name b{display:flex; align-items:center; gap:4px;}
  .exc-head{align-items:center;}
  .nf-badge{display:inline-block; margin-left:6px; padding:1px 6px; border-radius:6px; background:var(--accent-soft); color:var(--accent-2); font-size:10.5px; letter-spacing:0; text-transform:none; font-weight:600;}
  .hint-line{display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:12px; padding:0 2px; font-size:12.5px; color:var(--t2);}
  .hint-line b{color:var(--t3); font-weight:600; margin-right:3px;}
  .exc .rpe{margin-top:12px;}
  .exc .rpe button{height:30px; font-size:13.5px;}

  .work-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:14px; padding:8px 8px 8px 14px; border-radius:16px; background:var(--s2);}
  .work-row .wl{font-size:14px; font-weight:600; color:var(--t2); display:flex; align-items:center; flex-wrap:wrap; gap:4px;}
  .work-row .wctl{display:flex; align-items:center; gap:4px;}
  .work-row .pm{width:36px; height:36px; border-radius:11px; background:var(--s3); display:flex; align-items:center; justify-content:center; color:var(--t2);}
  .work-row .pm:active{transform:scale(.9);}
  .work-row input{width:64px; background:transparent; border:none; outline:none; text-align:right; color:var(--text); font-size:22px; font-weight:600; padding:0;}
  .work-row .wu{font-size:13px; color:var(--t3); font-weight:600; margin-right:6px;}
  /* ================= TOAST / TICKER / SPLASH ================= */
  .toast{position:fixed; left:50%; top:calc(var(--safe-t) + 10px); transform:translateX(-50%); z-index:120; display:flex; align-items:center; gap:10px; max-width:calc(100% - 28px); width:max-content; padding:11px 16px 11px 11px; border-radius:20px; background:var(--bar); backdrop-filter:blur(24px) saturate(1.7); -webkit-backdrop-filter:blur(24px) saturate(1.7); color:var(--text); border:0.5px solid var(--hair2); font-weight:600; font-size:14px; line-height:1.3; box-shadow:var(--shadow-float); animation:toastIn .5s var(--spring) both;}
  .toast .ti{width:26px; height:26px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  @keyframes toastIn{from{opacity:0; transform:translate(-50%, -24px) scale(.94);} to{opacity:1; transform:translate(-50%,0);}}
  .ticker{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(var(--safe-b) + 72px); width:calc(100% - 20px); max-width:500px; z-index:55; border-radius:18px; overflow:hidden; background:var(--bar); backdrop-filter:blur(22px) saturate(1.6); -webkit-backdrop-filter:blur(22px) saturate(1.6); border:0.5px solid var(--hair2); box-shadow:var(--shadow-float);}
  .ticker.low{bottom:calc(var(--safe-b) + 10px);}
  .ticker-prog{height:2px; background:var(--s3);} .ticker-prog i{display:block; height:100%; background:var(--accent);}
  .ticker-row{display:flex; align-items:center; gap:10px; padding:8px 8px 8px 9px;}
  .ticker-art{width:38px; height:38px; border-radius:9px; object-fit:cover; flex-shrink:0; background:var(--s3);}
  .ticker-meta{flex:1; min-width:0;}
  .ticker-name{font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ticker-artist{font-size:12px; color:var(--t2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  #splash{position:fixed; inset:0; z-index:200; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; transition:opacity .45s ease, transform .45s ease;}
  #splash.hide{opacity:0; transform:scale(1.04); pointer-events:none;}
  #splash .mark{width:84px; height:84px; border-radius:22px; background:linear-gradient(160deg, #1C1F25, #0E1013); display:flex; align-items:center; justify-content:center; box-shadow:0 20px 50px -18px rgba(76,125,255,.5), inset 0 0 0 0.5px rgba(255,255,255,.08); animation:markIn .7s var(--spring) both;}
  #splash .word{font-family:var(--font-display); font-weight:700; font-size:17px; letter-spacing:.18em; color:var(--text); animation:rise .6s .15s var(--ease) both;}
  #splash .word span{color:var(--accent-2);}
  @keyframes markIn{from{opacity:0; transform:scale(.8);} to{opacity:1; transform:none;}}
</style>
</head>

  </div>
  <div class="word">DBS PPL<span>X</span></div>
