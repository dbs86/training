function MorningView({active, setActive, log, setLog, plan, setPlan, onBack, onLogged, setToast}){
  const today = dayKey(new Date());
  const s = resolveMorning(active, plan);
  const R = s.plan.rounds;
  const lastStep = R + 1;
  const step = Math.min(s.step||0, lastStep);
  const stale = !!s.startedAt && s.date !== today;
  const [mode, setMode] = useState('coach');
  const [showFinish, setShowFinish] = useState(false);
  const [confirmReset, setConfirmReset] = useState(false);
  const [pullDraft, setPullDraft] = useState(null);

  const timersOn = !!s.restEndsAt || !!s.coolTimer;
  const clockOn = !!s.startedAt && !s.completedAt;
  const now = useNow(timersOn || clockOn, timersOn ? 250 : 1000);
  const elapsed = s.startedAt ? ((s.completedAt ? new Date(s.completedAt).getTime() : now) - new Date(s.startedAt).getTime())/1000 : 0;
  const roundsDone = mRoundsDone(s);
  const totals = mRepTotals(s);
  const totalReps = Object.values(totals).reduce((a,b)=>a+b,0);

  // Functional update so timer callbacks never write stale state
  const update = (fn, start=true) => setActive(prev=>{
    const base = resolveMorning(prev, plan);
    const next = fn({...base});
    if(start && !next.startedAt) next.startedAt = new Date().toISOString();
    return next;
  });
  const goStep = (i) => { update(x=>({...x, step:Math.max(0, Math.min(lastStep, i))}), false); setPullDraft(null); window.scrollTo({top:0, behavior:'smooth'}); };

  useEffect(()=>{ if(!confirmReset) return; const t = setTimeout(()=>setConfirmReset(false), 3000); return ()=>clearTimeout(t); }, [confirmReset]);

  /* ---- rest timer: vibrate at 60s, beep at 90s ---- */
  const restFired = useRef({});
  useEffect(()=>{
    if(!s.restEndsAt || !s.restStartedAt) return;
    const key = s.restStartedAt;
    const el = (now - new Date(s.restStartedAt).getTime())/1000;
    const f = restFired.current[key] || (restFired.current[key] = {});
    if(el >= MORNING.restMin && !f.min){ f.min = true; vibrate(60); }
    if(el >= MORNING.restMax && !f.max){
      f.max = true; playBeep(); vibrate([120,80,120]); notify('Rest over', 'Next round.');
      update(x=>({...x, restEndsAt:null, restStartedAt:null}), false);
    }
    // eslint-disable-next-line
  }, [now, s.restEndsAt, s.restStartedAt]);

  /* ---- cool-down timer: tick, beep, roll into the next stretch ---- */
  const coolFired = useRef({});
  useEffect(()=>{
    const t = s.coolTimer;
    if(!t || now < t.endsAt || coolFired.current[t.endsAt]) return;
    coolFired.current[t.endsAt] = true;
    playBeep(); vibrate([80,60,80]);
    update(x=>{
      const cool = [...x.cool]; cool[t.idx] = true;
      const nextIdx = cool.findIndex((d,i)=> !d && i>t.idx);
      const n = Date.now();
      return {...x, cool, coolTimer: nextIdx>=0 ? {idx:nextIdx, startsAt:n+3000, endsAt:n+3000+MORNING.cooldown[nextIdx].secs*1000} : null};
    });
    // eslint-disable-next-line
  }, [now, s.coolTimer]);

  const toggleWarm = (i) => update(x=>{ const warm=[...x.warm]; warm[i]=!warm[i]; return {...x, warm}; });
  const tickAllWarm = () => update(x=>({...x, warm: x.warm.every(Boolean) ? x.warm.map(()=>false) : x.warm.map(()=>true)}));

  const roundIdx = step - 1; // valid when 0 <= roundIdx < R
  const setRoundField = (ri, id, val) => {
    const wasDone = mRoundDone(s.rounds[ri]);
    const nr = {...(s.rounds[ri]||{}), [id]: val};
    const nowDone = mRoundDone(nr);
    update(x=>{
      const rounds = x.rounds.map((r,i)=> i===ri ? {...(r||{}), [id]:val} : r);
      let extra = {};
      if(nowDone && !wasDone && ri < R-1){
        const n = new Date();
        extra = {restStartedAt:n.toISOString(), restEndsAt:new Date(n.getTime()+MORNING.restMax*1000).toISOString()};
      }
      return {...x, rounds, ...extra};
    });
    if(nowDone && !wasDone){
      vibrate([30,40,60]);
      if(ri < R-1){ setToast(`Round ${ri+1} done — rest ${MORNING.restMin}–${MORNING.restMax}s`); setTimeout(()=>goStep(ri+2), 500); }
      else { setToast('Circuit done — on to the cool-down'); setTimeout(()=>goStep(lastStep), 600); }
    } else vibrate(12);
  };
  const pullValueFor = (ri) => {
    const r = s.rounds[ri] || {};
    if(r.pullup!=null) return r.pullup;
    if(pullDraft!=null) return pullDraft;
    for(let i=ri-1;i>=0;i--){ if(s.rounds[i] && s.rounds[i].pullup!=null) return s.rounds[i].pullup; }
    return s.plan.pullMax;
  };

  const startCool = (idx) => update(x=>{
    if(x.coolTimer && x.coolTimer.idx===idx) return {...x, coolTimer:null}; // tap again = stop
    const n = Date.now();
    return {...x, coolTimer:{idx, startsAt:n, endsAt:n+MORNING.cooldown[idx].secs*1000}};
  });
  const toggleCool = (idx) => update(x=>{ const cool=[...x.cool]; cool[idx]=!cool[idx]; return {...x, cool, coolTimer: x.coolTimer && x.coolTimer.idx===idx ? null : x.coolTimer}; });

  const anyProgress = !!s.startedAt;
  const saveSession = (feel, chosen) => {
    const entry = {
      v:2, date: s.startedAt || new Date().toISOString(),
      plan: s.plan, rounds: roundsDone,
      reps: totals, totalReps,
      pullPerRound: s.rounds.slice(0,R).map(r=> r && r.pullup!=null ? r.pullup : null),
      durationSec: stale ? null : Math.round(elapsed),
      feel, warmupDone: s.warm.every(Boolean), cooldownDone: s.cool.every(Boolean),
    };
    const prevPB = morningPullPB(log);
    setLog(prev=>[...prev, entry]);
    if(chosen.length) setPlan(p=> chosen.reduce((acc,x)=> x.apply(acc), {...p}));
    setActive(null);
    setShowFinish(false);
    onLogged(entry, entry.reps.pullup > prevPB && entry.reps.pullup>0, chosen);
  };
  const reset = () => {
    if(!confirmReset){ setConfirmReset(true); return; }
    setActive(null); setConfirmReset(false);
  };

  const circuitSub = `${MORNING.equipment} · ${MORNING.duration}`;

  /* ---------- step bodies ---------- */
  let body = null;
  if(step===0){
    const allWarm = s.warm.every(Boolean);
    body = (
      <div className="card m-round">
        <div className="m-round-head">
          <div>
            <div className="eyebrow">Block 1 · 1 round, no rest</div>
            <div className="m-round-num" style={{marginTop:4}}>Warm-up</div>
          </div>
          <button className="btn btn-soft" style={{width:'auto', padding:'10px 14px', fontSize:13}} onClick={tickAllWarm}>{allWarm ? 'Untick all' : <React.Fragment><Icon name="check" size={15} stroke={3}/>All done</React.Fragment>}</button>
        </div>
        {MORNING.warmup.map((w,i)=>(
          <button key={w.id} className={`m-ex ${s.warm[i]?'on':''}`} onClick={()=>toggleWarm(i)} aria-pressed={!!s.warm[i]}>
            <span className="tick"><Icon name="check" size={16} stroke={3}/></span>
            <span className="nm">{w.name}</span>
            <span className="det">{w.detail}</span>
          </button>
        ))}
      </div>
    );
  } else if(step===lastStep){
    const t = s.coolTimer;
    const allCool = s.cool.every(Boolean);
    const firstOpen = s.cool.findIndex(d=>!d);
    body = (
      <div className="card m-round">
        <div className="m-round-head">
          <div>
            <div className="eyebrow">Block 3 · 30s each</div>
            <div className="m-round-num" style={{marginTop:4}}>Cool-down</div>
          </div>
          {!allCool && !t && (
            <button className="btn btn-soft" style={{width:'auto', padding:'10px 14px', fontSize:13}} onClick={()=>startCool(firstOpen)}><Icon name="play" size={13}/>Start</button>
          )}
        </div>
        {MORNING.cooldown.map((c,i)=>{
          const running = t && t.idx===i;
          const lead = running && now < t.startsAt;
          const left = running ? Math.max(0, Math.ceil((t.endsAt - Math.max(now, t.startsAt))/1000)) : c.secs;
          const pct = running && !lead ? 1 - left/c.secs : 0;
          return (
            <div key={c.id} className={`m-ex ${s.cool[i]?'on':''} ${running?'running':''}`} onClick={()=>!s.cool[i] && startCool(i)} role="button">
              <button className="tick" onClick={e=>{ e.stopPropagation(); toggleCool(i); }} aria-label="Mark done"><Icon name="check" size={16} stroke={3}/></button>
              <span className="nm">{c.name}{c.side && <small className="side">{c.side}</small>}</span>
              {running ? (
                <Ring size={44} stroke={4} pct={pct} color="var(--accent)">
                  <span className="tabnum" style={{fontWeight:800, fontSize:lead?10:13}}>{lead ? 'GET' : left}</span>
                </Ring>
              ) : (
                <span className="det">{s.cool[i] ? 'Done' : `${c.secs}s`}</span>
              )}
            </div>
          );
        })}
        <div className="help" style={{marginTop:12}}>Tap a stretch to start its 30s timer — it rolls straight into the next one. Tap the circle to tick one off without the timer.</div>
      </div>
    );
  } else {
    const r = s.rounds[roundIdx] || {};
    const pv = pullValueFor(roundIdx);
    body = (
      <React.Fragment>
        <RestBanner s={s} now={now} onSkip={()=>update(x=>({...x, restEndsAt:null, restStartedAt:null}), false)}/>
        <div className="card m-round" style={{marginTop: s.restEndsAt ? 12 : 0}}>
          <div className="m-round-head">
            <div>
              <div className="eyebrow sun-ink">Block 2 · Circuit</div>
              <div className="m-round-num tabnum" style={{marginTop:4}}>Round {roundIdx+1} <span>/ {R}</span></div>
            </div>
          </div>
          {MORNING.circuit.map(ex=>{
            if(ex.logActual){
              const on = r[ex.id]!=null;
              return (
                <div key={ex.id} className={`m-ex ${on?'on':''}`} onClick={()=> setRoundField(roundIdx, ex.id, on ? null : pv)} role="button" aria-pressed={on}>
                  <span className="tick"><Icon name="check" size={16} stroke={3}/></span>
                  <span className="nm">{ex.name}<small className="side">Target {s.plan.pullMin}–{s.plan.pullMax} · log actual</small></span>
                  <Stepper value={pv} min={0} max={40} onChange={v=>{ if(on) setRoundField(roundIdx, ex.id, v); else setPullDraft(v); }}/>
                </div>
              );
            }
            const on = !!r[ex.id];
            return (
              <button key={ex.id} className={`m-ex ${on?'on':''}`} onClick={()=>setRoundField(roundIdx, ex.id, !on)} aria-pressed={on}>
                <span className="tick"><Icon name="check" size={16} stroke={3}/></span>
                <span className="nm">{ex.name}</span>
                <span className="reps tabnum"><small>×</small>{circuitReps(ex, s.plan)}</span>
              </button>
            );
          })}
        </div>
      </React.Fragment>
    );
  }

  return (
    <div className="page" style={{'--c':'#FF8A3D'}}>
      <PageHeader title="Morning" sub={circuitSub} onBack={onBack}/>
      <Segmented value={mode} onChange={setMode} options={[
        {value:'coach', label:'Coach', icon:'timer'},
        {value:'overview', label:'Overview', icon:'list'},
      ]}/>

      {mode==='overview' ? (
        <MorningOverview plan={plan} setPlan={setPlan} log={log}/>
      ) : (
        <React.Fragment>
          {stale && (
            <div className="banner" style={{marginTop:14}}>
              <Icon name="clock" size={20} color="var(--warn)"/>
              <div style={{flex:1}}>
                <div className="t">Unfinished from {fmtDate(s.startedAt, {weekday:'long', day:'numeric', month:'short'})}</div>
                <div className="s">{plural(roundsDone,'round')} done. Log it, or clear it to start today fresh.</div>
                <div className="btn-row" style={{marginTop:10}}>
                  <button className="btn btn-soft" style={{padding:'10px'}} onClick={()=>setShowFinish(true)}>Log it</button>
                  <button className="btn btn-ghost" style={{padding:'10px'}} onClick={()=>setActive(null)}>Clear</button>
                </div>
              </div>
            </div>
          )}

          <MorningStepPills s={s} step={step} onJump={goStep}/>
          <div className="m-meta">
            <span><Icon name="timer" size={13}/><b className="tabnum">{fmtMS(elapsed)}</b>{s.startedAt ? '' : ' · starts on first tick'}</span>
            <span><b className="tabnum">{roundsDone}/{R}</b> rounds · <b className="tabnum">{totals.pullup}</b> pull-ups</span>
          </div>

          {body}

          {anyProgress && !stale && (
            <button className="btn btn-danger" style={{marginTop:14}} onClick={reset}><Icon name="reset" size={16}/>{confirmReset ? 'Tap again to clear this session' : 'Reset session'}</button>
          )}

          <div className="step-nav">
            <button className="btn btn-ghost" disabled={step===0} onClick={()=>goStep(step-1)}>
              <Icon name="chevronLeft" size={17}/>Prev
            </button>
            {step<lastStep ? (
              <button className="btn btn-primary" onClick={()=>goStep(step+1)}>
                {step===0 ? 'Start circuit' : step===R ? 'Cool-down' : 'Next round'}<Icon name="chevronRight" size={17}/>
              </button>
            ) : (
              <button className="btn btn-sunrise" disabled={!anyProgress} onClick={()=>setShowFinish(true)}>
                <Icon name="check" size={17} stroke={3}/>Finish
              </button>
            )}
          </div>
        </React.Fragment>
      )}

      {showFinish && (
        <MorningFinishSheet s={s} log={log} roundsDone={roundsDone} totals={totals} elapsed={stale ? 0 : elapsed}
          onClose={()=>setShowFinish(false)} onSave={saveSession}/>
      )}
    </div>
  );
}

/* =========================================================
   APP
   ========================================================= */
const BACKUP_KEYS = ['week','logs','stats','height','unit','prs','swaps','completions','fast','fastHistory','cardioLog','stretchLog','spotifyClientId','morningLog','morningActive','morningPlan','themePref'];

function App(){
  const [week, setWeek] = usePersisted('ftx_week', 1);
  const [logs, setLogs] = usePersisted('ftx_logs', {});
  const [stats, setStats] = usePersisted('ftx_bodystats', []);
  const [height, setHeight] = usePersisted('ftx_height', null);
  const [unit, setUnit] = usePersisted('ftx_unit', 'kg');
  const [prs, setPrs] = usePersisted('ftx_prs', {});
  const [swaps, setSwaps] = usePersisted('ftx_swaps', {});
  const [completions, setCompletions] = usePersisted('ftx_completions', []);
  const [fast, setFast] = usePersisted('ftx_fast', null);
  const [fastHistory, setFastHistory] = usePersisted('ftx_fastHistory', []);
  const [cardioLog, setCardioLog] = usePersisted('ftx_cardioLog', []);
  const [stretchLog, setStretchLog] = usePersisted('ftx_stretchLog', []);
  const [morningLog, setMorningLog] = usePersisted('ftx_morningLog', []);
  const [morningActive, setMorningActive] = usePersisted('ftx_morningActive', null);
  const [morningPlan, setMorningPlan] = usePersisted('ftx_morningPlan', MORNING_PLAN_DEFAULT);
  const [spotifyClientId, setSpotifyClientId] = usePersisted('ftx_spotify_client_id', '');
  const [spotifyTokens, setSpotifyTokens] = usePersisted('ftx_spotify_tokens', null);
  const [themePref, setThemePref] = usePersisted('ftx_theme', 'system');

  const [screen, setScreen] = useState('home');
  const [activeSessionId, setActiveSessionId] = useState(null);
  const [showSettings, setShowSettings] = useState(false);
  const [toast, setToast] = useState(null);

  // Theme — applied during render so charts read the right colours
  const sysDark = useSystemDark();
  const resolvedTheme = themePref==='system' ? (sysDark ? 'dark' : 'light') : themePref;
  applyTheme(resolvedTheme);

  useEffect(()=>{
    if(!toast) return;
    const t = setTimeout(()=>setToast(null), 3800);
    return ()=>clearTimeout(t);
  }, [toast]);

  useEffect(()=>{
    const unlock = () => { getAudioCtx(); };
    document.addEventListener('pointerdown', unlock, {once:true});
    return () => document.removeEventListener('pointerdown', unlock);
  }, []);

  useEffect(()=>{
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    if(code && spotifyClientId){
      exchangeSpotifyCode(spotifyClientId, code).then(data=>{
        setSpotifyTokens({access_token:data.access_token, refresh_token:data.refresh_token, expires_at:Date.now()+data.expires_in*1000});
        setToast('Spotify connected');
      }).catch(()=> setToast('Spotify connection failed'))
        .finally(()=> window.history.replaceState({}, '', window.location.pathname));
    } else if(code){
      window.history.replaceState({}, '', window.location.pathname);
    }
    // eslint-disable-next-line
  }, []);

  const nav = (s) => { setScreen(s); window.scrollTo({top:0}); };
  const openSession = (id) => {
    if(id==='cardio' || id==='stretch'){ nav(id); return; }
    setActiveSessionId(id); nav('session');
  };
  const goHome = () => { nav('home'); setActiveSessionId(null); };
  const activeSession = SESSIONS.find(s=>s.id===activeSessionId);

  const finishWorkout = () => {
    if(!activeSession){ goHome(); return; }
    const volume = computeSessionVolume(activeSession, week, logs);
    const n = completions.filter(c=>c.week===week).length + 1;
    setCompletions(prev=>[...prev, {date:new Date().toISOString(), week, sessionId:activeSession.id, volume}]);
    setToast(`${activeSession.name} done · ${Math.round(volume).toLocaleString('en-GB')}kg volume · ${plural(n,'session')} this week`);
    goHome();
  };

  const exportData = () => {
    const payload = {app:APP_NAME, week, logs, stats, height, unit, prs, swaps, completions, fast, fastHistory, cardioLog, stretchLog,
      spotifyClientId, morningLog, morningActive, morningPlan, themePref, exportedAt:new Date().toISOString()};
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `dbs-pplx-backup-${dayKey(new Date())}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    setToast('Backup downloaded');
  };

  const importData = (file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try{
        const data = JSON.parse(e.target.result);
        if(!data || typeof data!=='object' || !BACKUP_KEYS.some(k=> k in data)) throw new Error('not a backup');
        const arr = v => Array.isArray(v);
        const obj = v => v && typeof v==='object' && !Array.isArray(v);
        if(typeof data.week==='number') setWeek(Math.min(TOTAL_WEEKS, Math.max(1, data.week)));
        if(obj(data.logs)) setLogs(data.logs);
        if(arr(data.stats)) setStats(data.stats);
        if(data.height!=null) setHeight(data.height);
        if(data.unit==='kg' || data.unit==='lb') setUnit(data.unit);
        if(obj(data.prs)) setPrs(data.prs);
        if(obj(data.swaps)) setSwaps(data.swaps);
        if(arr(data.completions)) setCompletions(data.completions);
        if(data.fast!==undefined) setFast(data.fast);
        if(arr(data.fastHistory)) setFastHistory(data.fastHistory);
        if(arr(data.cardioLog)) setCardioLog(data.cardioLog);
        if(arr(data.stretchLog)) setStretchLog(data.stretchLog);
        if(arr(data.morningLog)) setMorningLog(data.morningLog);
        if(data.morningActive!==undefined) setMorningActive(data.morningActive);
        if(obj(data.morningPlan) && data.morningPlan.rounds) setMorningPlan({...MORNING_PLAN_DEFAULT, ...data.morningPlan});
        if(['light','dark','system'].includes(data.themePref)) setThemePref(data.themePref);
        if(data.spotifyClientId) setSpotifyClientId(data.spotifyClientId);
        setToast('Data imported');
      }catch(err){
        setToast('Import failed — not a valid backup file');
      }
    };
    reader.readAsText(file);
  };

  return (
    <ThemeContext.Provider value={resolvedTheme}>
      <div className={spotifyTokens ? 'has-ticker' : ''}>
        {screen==='home' && (
          <Home week={week} setWeek={setWeek} onOpenSession={openSession}
            stats={stats} height={height} unit={unit} onOpenSettings={()=>setShowSettings(true)}
            completions={completions} fast={fast} onOpenFasting={()=>nav('fasting')} onOpenBodyStats={()=>nav('bodystats')}
            morningActive={morningActive} morningLog={morningLog} morningPlan={morningPlan} onOpenMorning={()=>nav('morning')}
            cardioLog={cardioLog} stretchLog={stretchLog}/>
        )}
        {screen==='session' && activeSession && (
          <SessionView session={activeSession} week={week} logs={logs} setLogs={setLogs}
            prs={prs} setPrs={setPrs} swaps={swaps} setSwaps={setSwaps} setToast={setToast}
            onBack={goHome} onFinish={finishWorkout}/>
        )}
        {screen==='morning' && (
          <MorningView active={morningActive} setActive={setMorningActive} log={morningLog} setLog={setMorningLog}
            plan={morningPlan} setPlan={setMorningPlan} setToast={setToast} onBack={goHome}
            onLogged={(e, pb, lvl)=>{ setToast(`Morning logged · ${e.rounds} rounds · ${e.reps.pullup} pull-ups${pb ? ' — new PB!' : ''}${lvl.length ? ' · level up saved' : ''}`); goHome(); }}/>
        )}
        {screen==='fasting' && (
          <FastingView fast={fast} setFast={setFast} fastHistory={fastHistory} setFastHistory={setFastHistory} onBack={goHome}/>
        )}
        {screen==='bodystats' && (
          <BodyStatsView stats={stats} setStats={setStats} height={height} setHeight={setHeight} unit={unit} onBack={goHome}/>
        )}
        {screen==='cardio' && <ActivityLogView kind="cardio" entries={cardioLog} setEntries={setCardioLog} onBack={goHome}/>}
        {screen==='stretch' && <ActivityLogView kind="stretch" entries={stretchLog} setEntries={setStretchLog} onBack={goHome}/>}

        {toast && <div className="toast" role="status">{toast}</div>}
        {showSettings && (
          <SettingsModal themePref={themePref} setThemePref={setThemePref}
            unit={unit} setUnit={setUnit} onClose={()=>setShowSettings(false)}
            onExport={exportData} onImport={importData}
            spotifyClientId={spotifyClientId} setSpotifyClientId={setSpotifyClientId}
            spotifyTokens={spotifyTokens} setSpotifyTokens={setSpotifyTokens} setToast={setToast} />
        )}
        <SpotifyTicker clientId={spotifyClientId} tokens={spotifyTokens} setTokens={setSpotifyTokens}/>
      </div>
    </ThemeContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
