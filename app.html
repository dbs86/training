<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DBS PPLX">
<title>DBS PPLX</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600;700&display=swap');
:root{
  --bg:#0D0E10;--surface:#17181B;--surface2:#1F2023;--border:#2A2B2E;--border2:#3A3B3F;
  --text:#F2F2F0;--text2:#9A9B9F;--text3:#5F6063;
  --navy:#3B5BA9;--navy-bg:#16203D;--navy-text:#7FA0E8;--navy-bright:#5B82D6;
  --amber:#D99A3D;--amber-bg:#332512;--amber-text:#E8B768;
  --green:#3EA887;--green-bg:#16302A;--green-text:#6FD9B8;--green-border:#2C5A4C;
  --red-bg:#331818;--red-text:#E08080;
  --r:12px;--r-sm:8px;--r-lg:16px;
  --mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5;overflow-x:hidden;width:100%;}

/* ── SCREENS ── */
.screen{display:none;min-height:100vh;}
.screen.active{display:block;}

/* ── HOME SCREEN ── */
.home{padding:0 0 40px;background:var(--bg);min-height:100vh;}
.home-hero{
  background:var(--bg);
  border-bottom:1px solid var(--border);
  padding:56px 24px 32px;
  position:relative;
  overflow:hidden;
}
.home-hero::before{
  content:'';position:absolute;top:-60px;right:-60px;
  width:220px;height:220px;
  background:radial-gradient(circle, rgba(59,91,169,0.15) 0%, transparent 70%);
  border-radius:50%;
}

.home-hero h1{font-size:28px;font-weight:700;letter-spacing:-.5px;line-height:1.15;margin-bottom:6px;}
.home-hero p{font-size:13px;color:var(--text2);line-height:1.5;}

.home-section-label{
  font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text3);padding:24px 20px 10px;
}

.workout-list{padding:0 16px;display:flex;flex-direction:column;gap:10px;}

.workout-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);overflow:hidden;cursor:pointer;
  transition:border-color .2s,transform .15s;
  text-decoration:none;color:inherit;
  display:block;
  position:relative;
}
.workout-card:active{transform:scale(.985);}
.workout-card:hover{border-color:var(--border2);}
.workout-card.navy-accent{border-left:3px solid var(--navy);}
.workout-card.amber-accent{border-left:3px solid var(--amber);}
.workout-card.green-accent{border-left:3px solid var(--green);}

.workout-card-inner{padding:16px 18px;display:flex;align-items:center;gap:14px;}
.workout-card-icon{
  width:44px;height:44px;border-radius:var(--r-sm);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
}
.workout-card-icon.navy{background:var(--navy-bg);}
.workout-card-icon.amber{background:var(--amber-bg);}
.workout-card-icon.green{background:var(--green-bg);}

.workout-card-text{flex:1;min-width:0;}
.workout-card-title{font-size:15px;font-weight:600;letter-spacing:-.1px;margin-bottom:3px;}
.workout-card-sub{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.workout-card-arrow{font-size:18px;color:var(--text3);flex-shrink:0;}
.workout-card-badge{
  position:absolute;top:12px;right:36px;
  font-size:10px;font-weight:600;letter-spacing:.06em;
  padding:2px 8px;border-radius:20px;
}
.badge-optional{background:var(--surface2);color:var(--text3);}

/* ── WORKOUT SCREEN ── */
.workout-screen{padding-bottom:100px;background:var(--bg);min-height:100vh;}

.workout-header{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0;position:sticky;top:0;z-index:50;
}
.workout-header-top{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;border-bottom:1px solid var(--border);
}
.back-btn{
  width:34px;height:34px;border-radius:var(--r-sm);
  border:1px solid var(--border2);background:var(--surface2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--text2);flex-shrink:0;font-family:var(--sans);
  transition:all .15s;
}
.back-btn:active{background:var(--border);}
.workout-header-title{flex:1;min-width:0;}
.workout-header-title h2{font-size:16px;font-weight:600;letter-spacing:-.2px;}
.workout-header-title p{font-size:11px;color:var(--text2);margin-top:1px;}
.mode-toggle{display:flex;border:1px solid var(--border2);border-radius:var(--r-sm);overflow:hidden;flex-shrink:0;}
.mode-btn{padding:5px 11px;border:none;background:transparent;cursor:pointer;font-size:11px;font-family:var(--sans);color:var(--text2);transition:all .15s;white-space:nowrap;}
.mode-btn.active{background:var(--navy);color:white;}

.workout-focus{
  background:var(--navy-bg);border-bottom:1px solid var(--navy);
  padding:9px 16px;font-size:12px;color:var(--navy-text);font-style:italic;line-height:1.5;
}

/* ── COACH MODE ── */
.coach-wrap{padding:14px 14px 20px;background:var(--bg);min-height:100vh;}

.progress-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:12px 14px;margin-bottom:12px;
}
.progress-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.progress-label{font-size:12px;font-weight:500;}
.progress-frac{font-family:var(--mono);font-size:11px;color:var(--text3);}
.progress-track{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:8px;}
.progress-fill{height:100%;background:var(--navy);border-radius:2px;transition:width .4s ease;}
.progress-dots{display:flex;gap:4px;flex-wrap:wrap;}
.progress-dot{
  width:8px;height:8px;border-radius:50%;background:var(--border2);
  cursor:pointer;transition:all .2s;
}
.progress-dot.done{background:var(--green);}
.progress-dot.current{background:var(--navy);transform:scale(1.3);}

.ss-banner{
  background:var(--amber-bg);border:1px solid var(--amber);
  border-radius:var(--r);padding:11px 14px;margin-bottom:10px;
  display:flex;align-items:center;gap:10px;
}
.ss-banner-icon{font-size:18px;flex-shrink:0;}
.ss-banner-title{font-size:13px;font-weight:600;color:var(--amber-text);}
.ss-banner-sub{font-size:11px;color:var(--amber-text);opacity:.75;margin-top:1px;}

.ex-coach-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);overflow:hidden;margin-bottom:8px;
}
.ex-coach-card+.ss-arrow{text-align:center;font-size:22px;color:var(--amber);padding:2px 0;}
.ex-coach-top{padding:14px 16px 12px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px;}
.ex-coach-top-left{flex:1;min-width:0;}
.ex-coach-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.ex-coach-group{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);}
.ex-coach-num{font-family:var(--mono);font-size:10px;color:var(--text3);}
.ex-coach-name{font-size:17px;font-weight:600;line-height:1.25;letter-spacing:-.2px;margin-bottom:5px;}
.ex-coach-scheme{font-family:var(--mono);font-size:12px;color:var(--text2);margin-bottom:8px;}
.ex-pills{display:flex;gap:6px;flex-wrap:wrap;}
.ex-pill{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:20px;}
.pill-compound{background:var(--navy-bg);color:var(--navy-text);}
.pill-superset{background:var(--amber-bg);color:var(--amber-text);}
.pill-isolation{background:var(--surface2);color:var(--text3);}

.ex-coach-cue{
  padding:11px 16px;font-size:12px;color:var(--text2);
  font-style:italic;line-height:1.65;background:var(--surface2);
  border-bottom:1px solid var(--border);
}

.ex-sets{padding:13px 14px;}
.ex-sets-label{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;}

.set-row{
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;border:1px solid var(--border);
  border-radius:var(--r-sm);margin-bottom:8px;
  background:var(--bg);transition:all .15s;
}
.set-row.done{background:var(--green-bg);border-color:var(--green-border);}
.set-row-label{font-family:var(--mono);font-size:11px;color:var(--text3);font-weight:500;min-width:40px;}
.set-inputs{display:flex;gap:8px;flex:1;}
.set-field{display:flex;flex-direction:column;gap:3px;flex:1;}
.set-field label{font-size:10px;color:var(--text3);}
.set-field input{
  width:100%;padding:7px 9px;
  border:1px solid var(--border2);border-radius:var(--r-sm);
  background:var(--surface);color:var(--text);
  font-family:var(--mono);font-size:14px;-webkit-appearance:none;
  transition:border-color .15s;
}
.set-field input:focus{outline:none;border-color:var(--navy);}
.set-row.done .set-field input{border-color:var(--green-border);}
.tick-btn{
  width:40px;height:40px;flex-shrink:0;
  border:1px solid var(--border2);border-radius:var(--r-sm);
  background:var(--surface);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;color:var(--text3);transition:all .15s;font-family:var(--sans);
}
.tick-btn:active{transform:scale(.9);}
.tick-btn.done{background:var(--green);border-color:var(--green);color:white;}

.ex-footer{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px;}
.ex-footer-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.rest-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 16px;border:1px solid var(--border2);border-radius:var(--r-sm);
  background:var(--surface2);cursor:pointer;font-size:12px;font-family:var(--sans);
  color:var(--text2);transition:all .15s;font-weight:500;
}
.rest-btn.running{background:var(--amber-bg);border-color:var(--amber);color:var(--amber-text);}
.rest-btn.done-rest{background:var(--green-bg);border-color:var(--green-border);color:var(--green-text);}

/* Rest timer box — top right of exercise card */
.rest-timer-box{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:64px;height:64px;border-radius:var(--r-sm);
  border:1px solid var(--border2);background:var(--surface2);
  cursor:pointer;flex-shrink:0;transition:all .2s;padding:6px;
  text-align:center;font-family:var(--sans);
}
.rest-timer-box:active{transform:scale(.95);}
.rest-timer-box.running{background:var(--amber-bg);border-color:var(--amber);}
.rest-timer-box.done-rest{background:var(--green-bg);border-color:var(--green-border);}
.rest-timer-box-label{font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:3px;}
.rest-timer-box.running .rest-timer-box-label{color:var(--amber-text);}
.rest-timer-box.done-rest .rest-timer-box-label{color:var(--green-text);}
.rest-timer-box-time{font-family:var(--mono);font-size:16px;font-weight:500;color:var(--text2);line-height:1;}
.rest-timer-box.running .rest-timer-box-time{color:var(--amber-text);}
.rest-timer-box.done-rest .rest-timer-box-time{color:var(--green-text);}
.rest-timer-box-sub{font-size:9px;color:var(--text3);margin-top:3px;line-height:1.2;}
.rest-timer-box.running .rest-timer-box-sub{color:var(--amber-text);opacity:.7;}
.rest-timer-box.done-rest .rest-timer-box-sub{color:var(--green-text);opacity:.7;}
.pb-chip{
  font-size:11px;color:var(--green-text);background:var(--green-bg);
  padding:4px 10px;border-radius:20px;font-weight:600;
  border:1px solid var(--green-border);
}
.note-input{flex:1;min-width:0;}
.note-input input{
  width:100%;padding:7px 10px;border:1px solid var(--border);
  border-radius:var(--r-sm);background:var(--surface2);color:var(--text2);
  font-family:var(--sans);font-size:12px;font-style:italic;-webkit-appearance:none;
}
.note-input input:focus{outline:none;border-color:var(--border2);color:var(--text);}

/* ── SS ARROW ── */
.ss-arrow-divider{text-align:center;padding:3px 0;font-size:22px;color:var(--amber);}

/* ── FINISHER ── */
.finisher-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);margin:12px 14px 0;overflow:hidden;
}
.finisher-hdr{
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  cursor:pointer;background:var(--red-bg);border-bottom:1px solid var(--border);
}
.finisher-badge{
  font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.08);color:var(--red-text);flex-shrink:0;
}
.finisher-title{font-size:13px;font-weight:500;color:var(--red-text);flex:1;}
.finisher-chevron{font-size:15px;color:var(--red-text);opacity:.5;transition:transform .2s;}
.finisher-chevron.open{transform:rotate(180deg);}
.finisher-body{padding:10px 14px;}
.finisher-line{
  display:flex;align-items:flex-start;gap:8px;
  padding:6px 0;font-size:13px;color:var(--text2);
  border-bottom:1px solid var(--border);
}
.finisher-line:last-child{border-bottom:none;}
.finisher-bullet{color:var(--text3);flex-shrink:0;margin-top:2px;font-size:10px;}

/* ── NAV BUTTONS ── */
.coach-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--surface);border-top:1px solid var(--border);
  padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));
  display:flex;gap:10px;z-index:80;
}
.btn-next{
  flex:1;padding:15px;border:none;border-radius:var(--r);
  background:var(--navy);color:white;cursor:pointer;
  font-size:15px;font-weight:600;font-family:var(--sans);
  transition:all .15s;letter-spacing:-.1px;
}
.btn-next:active{transform:scale(.97);background:#2d4a8f;}
.btn-next.complete{background:var(--green);}
.btn-prev{
  padding:15px 20px;border:1px solid var(--border2);border-radius:var(--r);
  background:var(--surface2);color:var(--text2);cursor:pointer;
  font-size:15px;font-family:var(--sans);transition:all .15s;flex-shrink:0;
}
.btn-prev:active{transform:scale(.97);}

/* ── OVERVIEW MODE ── */
.overview-content{padding:12px 14px 20px;background:var(--bg);min-height:100vh;}
.mg-hdr{
  font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text3);padding:14px 0 7px;
  border-bottom:1px solid var(--border);margin-bottom:8px;
}
.ex-overview-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);margin-bottom:8px;overflow:hidden;
}
.ex-overview-card.complete{border-color:var(--green-border);}
.ex-ov-hdr{
  display:flex;align-items:center;gap:8px;
  padding:11px 14px;cursor:pointer;
}
.ex-ov-name{font-size:13px;font-weight:500;flex:1;min-width:0;line-height:1.3;}
.ex-ov-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.ov-dots{display:flex;gap:3px;}
.ov-dot{width:6px;height:6px;border-radius:50%;background:var(--border2);}
.ov-dot.done{background:var(--green);}
.ov-chevron{font-size:15px;color:var(--text3);transition:transform .2s;}
.ov-chevron.open{transform:rotate(180deg);}
.ex-ov-body{padding:0 14px 14px;border-top:1px solid var(--border);}
.ex-ov-cue{font-size:12px;color:var(--text2);font-style:italic;padding:9px 0 11px;line-height:1.6;border-bottom:1px solid var(--border);margin-bottom:10px;}
.ov-sets-stack{display:flex;flex-direction:column;gap:7px;margin-bottom:10px;}
.ss-ov-conn{display:flex;align-items:center;gap:8px;margin:2px 0 4px;}
.ss-ov-line{flex:1;height:1px;background:var(--amber);opacity:.3;}
.ss-ov-lbl{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--amber-text);}

/* ── SESSION COMPLETE ── */
.session-complete{
  margin:16px 14px;background:var(--green-bg);
  border:1px solid var(--green-border);border-radius:var(--r-lg);
  padding:28px 20px;text-align:center;
}
.session-complete h3{font-size:24px;font-weight:700;color:var(--green-text);margin-bottom:6px;}
.session-complete p{font-size:13px;color:var(--green-text);opacity:.8;}
.session-stats{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
.stat-chip{
  background:var(--surface2);border-radius:var(--r-sm);
  padding:10px 18px;text-align:center;border:1px solid var(--green-border);
}
.stat-val{font-size:22px;font-weight:700;font-family:var(--mono);color:var(--green-text);}
.stat-lbl{font-size:10px;color:var(--green-text);opacity:.6;margin-top:2px;}
.home-btn{
  margin-top:18px;padding:12px 28px;
  border:1px solid var(--green-border);border-radius:var(--r-sm);
  background:transparent;color:var(--green-text);cursor:pointer;
  font-size:14px;font-family:var(--sans);font-weight:600;transition:all .15s;
}
.home-btn:active{background:var(--surface2);}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* ── STATS SCREEN ── */
.stats-screen{padding:14px 14px 40px;background:var(--bg);min-height:100vh;}

.stat-hero{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:18px;margin-bottom:12px;
}
.stat-hero-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:12px;}
.stat-hero-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:10px;}
.stat-hero-item{text-align:center;padding:12px 8px;background:var(--surface2);border-radius:var(--r-sm);border:1px solid var(--border);}
.stat-hero-val{font-family:var(--mono);font-size:22px;font-weight:500;color:var(--text);line-height:1;}
.stat-hero-val.navy{color:var(--navy-text);}
.stat-hero-val.green{color:var(--green-text);}
.stat-hero-unit{font-size:11px;color:var(--text3);font-family:var(--sans);}
.stat-hero-lbl{font-size:10px;color:var(--text3);margin-top:5px;letter-spacing:.04em;}
.stat-hero-delta{font-size:10px;margin-top:3px;font-family:var(--mono);}
.delta-down{color:var(--green-text);}
.delta-up{color:var(--amber-text);}
.delta-none{color:var(--text3);}

.stat-log-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);overflow:hidden;margin-bottom:12px;
}
.stat-log-hdr{
  padding:14px 16px;border-bottom:1px solid var(--border);
  background:var(--surface2);
  display:flex;align-items:center;justify-content:space-between;
}
.stat-log-hdr h3{font-size:14px;font-weight:600;}
.stat-log-hdr span{font-size:11px;color:var(--text3);}
.stat-log-body{padding:14px 16px;}
.stat-input-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px;}
.stat-input-group{display:flex;flex-direction:column;gap:4px;}
.stat-input-group label{font-size:11px;color:var(--text3);font-weight:500;}
.stat-input-group input{
  width:100%;padding:10px 12px;
  border:1px solid var(--border2);border-radius:var(--r-sm);
  background:var(--bg);color:var(--text);
  font-family:var(--mono);font-size:15px;-webkit-appearance:none;
  transition:border-color .15s;
}
.stat-input-group input:focus{outline:none;border-color:var(--navy);}
.stat-input-hint{font-size:10px;color:var(--text3);font-style:italic;margin-top:2px;}

.save-stat-btn{
  width:100%;padding:14px;border:none;border-radius:var(--r);
  background:var(--navy);color:white;cursor:pointer;
  font-size:14px;font-weight:600;font-family:var(--sans);transition:all .15s;
}
.save-stat-btn:active{transform:scale(.98);background:#2d4a8f;}

/* Chart */
.chart-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);overflow:hidden;margin-bottom:12px;
}
.chart-hdr{

function lsGet(k,d){ try{const v=localStorage.getItem('dsv3_'+k);return v!==null?JSON.parse(v):d;}catch(e){return d;} }
function lsSet(k,v){ try{localStorage.setItem('dsv3_'+k,JSON.stringify(v));}catch(e){} }

function sfGet(wid,exId,s,f){ return lsGet(`${wid}_w${activeWeek}_${exId}_s${s}_${f}`,''); }
function sfSet(wid,exId,s,f,v){ lsSet(`${wid}_w${activeWeek}_${exId}_s${s}_${f}`,v); }
function sfGetWeek(wid,exId,s,f,week){ return lsGet(`${wid}_w${week}_${exId}_s${s}_${f}`,''); }

function getPrevWeekVal(wid,exId,s,f){
  if(activeWeek<=1) return '';
  return sfGetWeek(wid,exId,s,f,activeWeek-1);
}

function prePopulateFromPrev(wid){
  const w=WORKOUTS.find(x=>x.id===wid);
  if(!w||activeWeek<=1) return;
  for(const g of w.groups) for(const ex of g.exercises){
    for(let s=0;s<ex.sets;s++){
      // only populate if current week is empty
      if(sfGet(wid,ex.id,s,'kg')===''){
        const prevKg=sfGetWeek(wid,ex.id,s,'kg',activeWeek-1);
        if(prevKg!=='') sfSet(wid,ex.id,s,'kg',prevKg);
      }
      if(sfGet(wid,ex.id,s,'reps')===''){
        const prevReps=sfGetWeek(wid,ex.id,s,'reps',activeWeek-1);
        if(prevReps!=='') sfSet(wid,ex.id,s,'reps',prevReps);
      }
    }
  }
}

function checkAutoAdvance(wid){
  if(!isSessionDone(wid)) return;
  if(activeWeek>=12) return;
  const nextWeek=activeWeek+1;
  activeWeek=nextWeek;
  lsSet('activeWeek',activeWeek);
  prePopulateFromPrev(wid);
  showToast(`Week ${nextWeek-1} complete! Moving to Week ${nextWeek} 🎉`);
}

function showToast(msg){
  const ex=document.getElementById('toast');
  if(ex) ex.remove();
  const t=document.createElement('div');
  t.id='toast';
  t.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--green);color:white;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:600;font-family:var(--sans);z-index:999;box-shadow:0 4px 16px rgba(0,0,0,.4);text-align:center;max-width:280px;white-space:nowrap;';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),3500);
}

function getDoneSets(wid,exId,numSets){
  let c=0;
  for(let s=0;s<numSets;s++) if(sfGet(wid,exId,s,'done')===true) c++;
  return c;
}
function getPB(wid,exId){
  let best=0;
  for(let s=0;s<20;s++){
    const kg=parseFloat(sfGet(wid,exId,s,'kg'));
    if(!isNaN(kg)&&kg>best) best=kg;
  }
  return best>0?best:null;
}
function sessionVolume(wid){
  let vol=0,sets=0;
  const w=WORKOUTS.find(x=>x.id===wid);
  if(!w) return {vol:0,sets:0};
  for(const g of w.groups) for(const ex of g.exercises){
    if(ex.bw) continue;
    for(let s=0;s<ex.sets;s++){
      const kg=parseFloat(sfGet(wid,ex.id,s,'kg'));
      const reps=parseInt(sfGet(wid,ex.id,s,'reps'));
      if(!isNaN(kg)&&!isNaN(reps)){vol+=kg*reps;sets++;}
    }
  }
  return {vol:Math.round(vol),sets};
}
function isSessionDone(wid){
  const w=WORKOUTS.find(x=>x.id===wid);
  if(!w) return false;
  for(const g of w.groups) for(const ex of g.exercises)
    for(let s=0;s<ex.sets;s++) if(sfGet(wid,ex.id,s,'done')!==true) return false;
  return true;
}

function fmtT(s){const m=Math.floor(s/60),sec=s%60;return m>0?`${m}:${sec.toString().padStart(2,'0')}`:`${s}s`;}
function beep(){try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(0.4,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.6);o.start();o.stop(a.currentTime+0.6);}catch(e){}}

function startTimer(exId,sec){
  if(timerIvs[exId]){clearInterval(timerIvs[exId]);delete timerIvs[exId];}
  timers[exId]={total:sec,remaining:sec,running:true};
  timerIvs[exId]=setInterval(()=>{
    timers[exId].remaining--;
    if(timers[exId].remaining<=0){
      timers[exId].running=false;clearInterval(timerIvs[exId]);delete timerIvs[exId];beep();
      // auto reset box after 3 seconds — update in place, no re-render
      setTimeout(()=>{
        delete timers[exId];
        const box=document.getElementById(`rtbox_${exId}`);
        if(box){
          box.className='rest-timer-box';
          const timeEl=box.querySelector('.rest-timer-box-time');
          const subEl=box.querySelector('.rest-timer-box-sub');
          if(timeEl) timeEl.textContent=box.dataset.default||'—';
          if(subEl) subEl.textContent='tap to start';
        }
        const btn=document.getElementById(`rbtn_${exId}`);
        if(btn){btn.className='rest-btn';btn.textContent='⏱ Start rest';}
      },3000);
    }
    updateRestBtn(exId);
  },1000);
  updateRestBtn(exId);
}
function updateRestBtn(exId){
  // Update overview-mode button if present
  const btn=document.getElementById(`rbtn_${exId}`);
  if(btn){
    const t=timers[exId];
    if(!t){btn.className='rest-btn';btn.textContent='⏱ Start rest';return;}
    if(!t.running&&t.remaining<=0){btn.className='rest-btn done-rest';btn.textContent='✓ Rest done';return;}
    btn.className='rest-btn running';btn.textContent=`⏸ ${fmtT(t.remaining)}`;
  }
  // Update coach-mode timer boxes in-place — no full re-render
  const box=document.getElementById(`rtbox_${exId}`);
  if(box){
    const t=timers[exId];
    const timeEl=box.querySelector('.rest-timer-box-time');
    const subEl=box.querySelector('.rest-timer-box-sub');
    if(!t){
      box.className='rest-timer-box';
      if(timeEl) timeEl.textContent=box.dataset.default||'—';
      if(subEl) subEl.textContent='tap to start';
      return;
    }
    if(!t.running&&t.remaining<=0){
      box.className='rest-timer-box done-rest';
      if(timeEl) timeEl.textContent='Done';
      if(subEl) subEl.textContent='tap to reset';
      return;
    }
    box.className='rest-timer-box running';
    if(timeEl) timeEl.textContent=fmtT(t.remaining);
    if(subEl) subEl.textContent='tap to stop';
  }
}

function handleRestBox(exId, restSec){
  const t=timers[exId];
  if(t&&t.running){
    // tap while running — stop it
    clearInterval(timerIvs[exId]);delete timerIvs[exId];
    delete timers[exId];
    renderWorkout();
  } else if(t&&!t.running&&t.remaining<=0){
    // tap when done — reset
    delete timers[exId];
    renderWorkout();
  } else {
    // start timer
    startTimer(exId,restSec);
  }
}

function fmtDate(iso){
  const d=new Date(iso);
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
}

function calcFFMI(weightLbs, bfPct){
  if(!weightLbs||!bfPct) return null;
  const weightKg=weightLbs*0.453592;
  const heightM=1.7526; // 5'9"
  const leanKg=weightKg*(1-(bfPct/100));
  const ffmi=leanKg/(heightM*heightM);
  const normalised=ffmi+(6.1*(1.8-heightM));
  return normalised.toFixed(1);
}

function calcBMI(weightLbs){
  if(!weightLbs) return null;
  const weightKg=weightLbs*0.453592;
  const heightM=1.7526; // 5'9"
  const bmi=weightKg/(heightM*heightM);
  return bmi.toFixed(1);
}

function renderStats(){
  const stats=getStats().sort((a,b)=>new Date(b.date)-new Date(a.date));

    {key:'waist',    label:'Waist',    unit:'in',   cls:'',      lowerBetter:true},
  ];
  const bmiVal=latest&&latest.weight?calcBMI(latest.weight):null;
  const bmiPrev=prev&&prev.weight?calcBMI(prev.weight):null;

  heroItems.forEach(item=>{
    const val=latest&&latest[item.key]?latest[item.key]:null;
    const prevVal=prev&&prev[item.key]?prev[item.key]:null;

        delta=`<div class="stat-hero-delta ${cls}">${d>0?'+':''}${d}</div>`;

    }
    html+=`<div class="stat-hero-item">
      <div class="stat-hero-val ${item.cls}">${val||'—'}<span class="stat-hero-unit">${val?item.unit:''}</span></div>
      <div class="stat-hero-lbl">${item.label}</div>
      ${delta}
    </div>`;
  });

  // BMI computed
  html+=`<div class="stat-hero-item">
    <div class="stat-hero-val">${bmiVal||'—'}</div>
    <div class="stat-hero-lbl">BMI</div>
  </div>`;

  // FFMI computed
  const ffmi=latest?calcFFMI(latest.weight,latest.bodyfat):null;
  html+=`<div class="stat-hero-item">
    <div class="stat-hero-val navy">${ffmi||'—'}</div>
    <div class="stat-hero-lbl">FFMI</div>
  </div>`;

  html+=`</div></div>`;

  // ── TARGET NOTE ──
  html+=`<div class="stat-note">Target: 185 lbs at ~12% body fat. Weigh in the same way each week — same day, first thing, before eating. Weekly trend matters more than any single number.</div>`;

  // ── LOG NEW ENTRY ──
  const today=new Date().toISOString().split('T')[0];
  html+=`<div class="stat-log-card">
    <div class="stat-log-hdr">
      <h3>Log Entry</h3>
      <span>Weekly</span>
    </div>
    <div class="stat-log-body">
      <div class="stat-input-grid">
        <div class="stat-input-group">
          <label>Date</label>
          <input type="date" id="statDate" value="${today}">
        </div>
        <div class="stat-input-group">
          <label>Weight (lbs)</label>
          <input type="number" step="0.1" min="0" inputmode="decimal" id="statWeight" placeholder="—">
        </div>
        <div class="stat-input-group">
          <label>Body Fat (%)</label>
          <input type="number" step="0.1" min="0" max="60" inputmode="decimal" id="statBodyfat" placeholder="—">
        </div>
        <div class="stat-input-group">
          <label>Waist (in)</label>
          <input type="number" step="0.1" min="0" inputmode="decimal" id="statWaist" placeholder="—">
        </div>
      </div>
      <button class="save-stat-btn" onclick="saveStatEntry()">Save Entry</button>
    </div>
  </div>`;

  // ── CHART ──
  html+=`<div class="chart-card">
    <div class="chart-hdr">
      <h3>Progress</h3>
      <div class="chart-metric-toggle">
        ${[['weight','Weight'],['bodyfat','Body Fat'],['waist','Waist']].map(([k,l])=>
          `<button class="chart-metric-btn ${chartMetric===k?'active':''}" onclick="setChartMetric('${k}')">${l}</button>`
        ).join('')}
      </div>
    </div>
    <div class="chart-body">${renderChart(stats)}</div>
  </div>`;

  // ── HISTORY ──
  html+=`<div class="history-card">
    <div class="history-hdr">
      <h3>History</h3>
      <span>${stats.length} ${stats.length===1?'entry':'entries'}</span>
    </div>`;

  if(stats.length===0){
    html+=`<div class="history-empty">No entries yet — log your first above</div>`;
  } else {
    stats.forEach((s,i)=>{
      const bmi=s.weight?calcBMI(s.weight):null;
      html+=`<div class="history-row">

          ${bmi?`<div class="history-val"><span class="history-val-num">${bmi}</span><span class="history-val-lbl">BMI</span></div>`:''}
        </div>
        <button class="history-delete" onclick="deleteStatEntry('${s.date}')">×</button>
      </div>`;
    });
  }
  html+=`</div>`;

  document.getElementById('statsContent').innerHTML=html;
}

function renderChart(stats){
  const metricLabels={weight:'Weight (lbs)',bodyfat:'Body Fat (%)',waist:'Waist (in)'};
  const pts=stats.filter(s=>s[chartMetric]).sort((a,b)=>new Date(a.date)-new Date(b.date));

  if(pts.length<2) return `<div class="chart-empty">Log at least 2 entries to see your ${metricLabels[chartMetric].toLowerCase()} trend</div>`;

  const vals=pts.map(p=>parseFloat(p[chartMetric]));
  const min=Math.min(...vals), max=Math.max(...vals);
  const range=(max-min)||1;
  const pad=range*0.15;
  const yMin=min-pad, yMax=max+pad, yRange=yMax-yMin;

  const w=100, h=100;
  const coords=pts.map((p,i)=>{
    const x=(i/(pts.length-1))*w;
    const y=h-(((parseFloat(p[chartMetric])-yMin)/yRange)*h);
    return {x,y,val:p[chartMetric],date:p.date};
  });

  const linePath=coords.map((c,i)=>`${i===0?'M':'L'}${c.x.toFixed(2)},${c.y.toFixed(2)}`).join(' ');
  const areaPath=linePath+` L${w},${h} L0,${h} Z`;

  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:150px;overflow:visible;">
    <defs>
      <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3B5BA9" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="#3B5BA9" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <line x1="0" y1="0" x2="${w}" y2="0" stroke="#2A2B2E" stroke-width="0.4" vector-effect="non-scaling-stroke"/>
    <line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="#2A2B2E" stroke-width="0.4" vector-effect="non-scaling-stroke"/>
    <line x1="0" y1="${h}" x2="${w}" y2="${h}" stroke="#2A2B2E" stroke-width="0.4" vector-effect="non-scaling-stroke"/>
    <path d="${areaPath}" fill="url(#chartGrad)"/>
    <path d="${linePath}" fill="none" stroke="#5B82D6" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
    ${coords.map(c=>`<circle cx="${c.x.toFixed(2)}" cy="${c.y.toFixed(2)}" r="3" fill="#0D0E10" stroke="#5B82D6" stroke-width="2" vector-effect="non-scaling-stroke"/>`).join('')}
  </svg>
  <div style="display:flex;justify-content:space-between;margin-top:10px;font-family:var(--mono);font-size:10px;color:var(--text3);">
    <span>${fmtDate(pts[0].date)} · ${pts[0][chartMetric]}</span>
    <span style="color:var(--navy-text);font-weight:500;">${fmtDate(pts[pts.length-1].date)} · ${pts[pts.length-1][chartMetric]}</span>
  </div>`;
}

function setChartMetric(m){ chartMetric=m; renderStats(); }

function saveStatEntry(){
  const date=document.getElementById('statDate').value;
  if(!date){ alert('Pick a date'); return; }

  const entry={
    date,
    weight:  document.getElementById('statWeight').value||'',
    bodyfat: document.getElementById('statBodyfat').value||'',
    waist:   document.getElementById('statWaist').value||'',
  };

  if(!entry.weight&&!entry.bodyfat&&!entry.waist){
    alert('Enter at least one measurement');
    return;
  }

  let stats=getStats();
  stats=stats.filter(s=>s.date!==date); // replace same-date entry
  stats.push(entry);
  saveStats(stats);
  showToast('Entry saved 📊');
  renderStats();
  renderHome();
}

function deleteStatEntry(date){
  if(!confirm('Delete this entry?')) return;
  saveStats(getStats().filter(s=>s.date!==date));
  renderStats();
  renderHome();
}

function updateStatsSummary(){
  const el=document.getElementById('statsSummary');
  if(!el) return;
  const stats=getStats().sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(stats.length===0){ el.textContent='Weight · Body fat · Measurements'; return; }
  const l=stats[0];
  const parts=[];
  if(l.weight)  parts.push(`${l.weight} lbs`);
  if(l.bodyfat) parts.push(`${l.bodyfat}% BF`);
  if(l.waist)   parts.push(`${l.waist}" waist`);
  el.textContent=parts.length?parts.join(' · '):'Weight · Body fat · Measurements';
}

function buildScreens(w){
  const screens=[];
  for(const group of w.groups){
    const exes=group.exercises;
    let i=0;
    while(i<exes.length){
      const ex=exes[i];
      if(ex.ss){
        const chain=[ex];let j=i+1;
        while(j<exes.length&&exes[j-1].ss){chain.push(exes[j]);j++;}
        screens.push({type:'superset',group:group.name,exercises:chain});i=j;
      } else {
        screens.push({type:'single',group:group.name,exercises:[ex]});i++;
      }
    }
  }
  return screens;
}

// RENDER WORKOUT
// ═══════════════════════════════════════════════════════════════════
function renderWorkout(){
  if(!currentWorkout) return;
  const content=document.getElementById('workoutContent');
  if(mode==='overview'){content.innerHTML=renderOverview();return;}
  content.innerHTML=renderCoach();
  Object.keys(timers).forEach(id=>updateRestBtn(id));
}

function renderCoach(){
  const w=currentWorkout;
  const screens=buildScreens(w);
  const total=screens.length;

  if(isSessionDone(w.id)&&coachIdx>=total){
    const {vol,sets}=sessionVolume(w.id);
    return `<div class="session-complete">
      <h3>Session Complete 💪</h3>
      <p>${w.label} · Week ${activeWeek} · Great work</p>
      <div class="session-stats">
        <div class="stat-chip"><div class="stat-val">${vol.toLocaleString()}</div><div class="stat-lbl">kg volume</div></div>
        <div class="stat-chip"><div class="stat-val">${sets}</div><div class="stat-lbl">sets logged</div></div>
      </div>
      <button class="home-btn" onclick="resetAndGoHome('${w.id}')">← Back to Home</button>
    </div>`;
  }

  const idx=Math.min(coachIdx,total-1);
  const screen=screens[idx];
  const isSuperset=screen.type==='superset';
  const isTri=isSuperset&&screen.exercises.length>2;
  const pct=Math.round(idx/total*100);
  const restEx=screen.exercises.find(e=>e.rest>0)||screen.exercises[screen.exercises.length-1];
  const isLast=idx>=total-1;

  let html=`<div class="coach-wrap">
    <div class="progress-card">
      <div class="progress-top">
        <span class="progress-label">${isSuperset?(isTri?'Tri-Set':'Superset')+' · ':''} ${idx+1} of ${total}</span>
        <span class="progress-frac">${pct}%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-dots">
        ${screens.map((_,i)=>`<div class="progress-dot ${i<idx?'done':i===idx?'current':''}" onclick="goToScreen(${i})"></div>`).join('')}
      </div>
    </div>`;

  if(isSuperset){
    html+=`<div class="ss-banner">
      <div class="ss-banner-icon">⚡</div>
      <div>
        <div class="ss-banner-title">${isTri?'Tri-Set':'Superset'} — ${screen.exercises.length} exercises</div>
        <div class="ss-banner-sub">Perform back to back · No rest between exercises</div>
      </div>
    </div>`;
  }

  screen.exercises.forEach((ex,exIdx)=>{
    const isLastInScreen=exIdx===screen.exercises.length-1;
    const pb=ex.bw?null:getPB(w.id,ex.id);

    if(exIdx>0){html+=`<div class="ss-arrow-divider">↓</div>`;}

    const timerState=timers[ex.id];
    const timerClass=timerState?(timerState.running?'running':'done-rest'):'';
    const timerLabel=timerState&&!timerState.running&&timerState.remaining<=0?'Done':timerState&&timerState.running?fmtT(timerState.remaining):ex.rest>0?fmtT(ex.rest):'—';
    const timerSub=timerState&&timerState.running?'tap to stop':ex.rest>0?'tap to start':'bodyweight';
    html+=`<div class="ex-coach-card">
      <div class="ex-coach-top">
        <div class="ex-coach-top-left">
          <div class="ex-coach-meta">
            <span class="ex-coach-group">${screen.group}</span>
            ${isSuperset?`<span style="font-size:10px;font-family:var(--mono);color:var(--amber-text)">${exIdx+1}/${screen.exercises.length}</span>`:''}
          </div>
          <div class="ex-coach-name">${ex.name.replace('↳ ','')}</div>
          <div class="ex-coach-scheme">${ex.scheme}</div>
          <div class="ex-pills">
            <span class="ex-pill pill-${ex.type}">${ex.type==='compound'?'COMPOUND':ex.type==='superset'?'SS':'ISO'}</span>
          </div>
        </div>
        <div class="rest-timer-box ${timerClass}" id="rtbox_${ex.id}" data-default="${ex.rest>0?fmtT(ex.rest):'—'}" onclick="${ex.rest>0?`handleRestBox('${ex.id}',${ex.rest})`:''}">
          <div class="rest-timer-box-label">REST</div>
          <div class="rest-timer-box-time">${timerLabel}</div>
          <div class="rest-timer-box-sub">${timerSub}</div>
        </div>
      </div>
      <div class="ex-coach-cue">${ex.cue}</div>
      <div class="ex-sets">
        <div class="ex-sets-label">Log your sets</div>`;

    for(let s=0;s<ex.sets;s++){
      const kg=sfGet(w.id,ex.id,s,'kg');
      const reps=sfGet(w.id,ex.id,s,'reps');
      const done=sfGet(w.id,ex.id,s,'done')===true;
      html+=`<div class="set-row ${done?'done':''}" id="sr_${ex.id}_${s}">
        <span class="set-row-label">SET ${s+1}</span>
        <div class="set-inputs">
          ${!ex.bw?`<div class="set-field"><label>kg</label><input type="number" step="0.5" min="0" inputmode="decimal" value="${kg}" placeholder="0" onchange="sfSet('${w.id}','${ex.id}',${s},'kg',this.value)"></div>`:''}
          <div class="set-field"><label>reps</label><input type="number" min="0" inputmode="numeric" value="${reps}" placeholder="0" onchange="sfSet('${w.id}','${ex.id}',${s},'reps',this.value)"></div>
        </div>
        <button class="tick-btn ${done?'done':''}" onclick="tickSet('${w.id}','${ex.id}',${s},${ex.sets},${isLastInScreen?restEx.rest:0},'${restEx.id}')">✓</button>
      </div>`;
    }

    html+=`</div><div class="ex-footer">
      <div class="ex-footer-row">
        ${pb?`<span class="pb-chip">★ PB ${pb}kg</span>`:''}
        ${ex.rest===0?'<span style="font-size:11px;color:var(--text3);font-style:italic">No rest — superset</span>':''}
      </div>
      <div class="ex-footer-row">
        <div class="note-input"><input type="text" placeholder="Add note..." value="${sfGet(w.id,ex.id,0,'note')}" onchange="sfSet('${w.id}','${ex.id}',0,'note',this.value)"></div>
      </div>
    </div></div>`;
  });

  // Finisher on last screen
  if(isLast){
    const fin=w.finisher;
    const finOpen=!!openFinisher[w.id];
    html+=`<div class="finisher-card">
      <div class="finisher-hdr" onclick="toggleFin('${w.id}')">
        <span class="finisher-badge">FINISHER</span>
        <span class="finisher-title">${fin.scheme}</span>
        <span class="finisher-chevron ${finOpen?'open':''}">⌄</span>
      </div>
      ${finOpen?`<div class="finisher-body">${fin.lines.map(l=>`<div class="finisher-line"><span class="finisher-bullet">▸</span>${l}</div>`).join('')}</div>`:''}
    </div>`;
  }

  const navBtns=`
    ${idx>0?`<button class="btn-prev" onclick="goToScreen(${idx-1})">← Back</button>`:''}
    <button class="btn-next ${isLast?'complete':''}" onclick="goToScreen(${isLast?total:idx+1})">${isLast?'Complete Session ✓':'Next →'}</button>`;

  html+=`<div class="coach-nav">${navBtns}</div></div>`;
  return html;
}

function renderOverview(){
  const w=currentWorkout;
  let html=`<div class="overview-content">`;

  w.groups.forEach(group=>{
    html+=`<div class="mg-hdr">${group.name}</div>`;
    const exes=group.exercises;
    exes.forEach((ex,eIdx)=>{
      const key=`${w.id}_${ex.id}`;
      const isOpen=!!openBlocks[key];
      const ds=getDoneSets(w.id,ex.id,ex.sets);
      const allDone=ds>=ex.sets;
      const dots=Array.from({length:Math.min(ex.sets,8)},(_,i)=>`<div class="ov-dot ${i<ds?'done':''}"></div>`).join('');

      html+=`<div class="ex-overview-card ${allDone?'complete':''}">
        <div class="ex-ov-hdr" onclick="toggleBlock('${key}')">
          <span class="ex-pill pill-${ex.type}" style="flex-shrink:0">${ex.type==='compound'?'CMPD':ex.type==='superset'?'SS':'ISO'}</span>
          <div class="ex-ov-name">${ex.name.replace('↳ ','')}</div>
          <div class="ex-ov-right">
            <div class="ov-dots">${dots}</div>
            <span class="ov-chevron ${isOpen?'open':''}">⌄</span>
          </div>
        </div>`;

      if(isOpen){
        html+=`<div class="ex-ov-body">
          <div class="ex-ov-cue">${ex.cue}</div>
          <div style="font-family:var(--mono);font-size:11px;color:var(--text3);margin-bottom:8px">${ex.scheme}</div>
          <div class="ov-sets-stack">`;
        for(let s=0;s<ex.sets;s++){
          const kg=sfGet(w.id,ex.id,s,'kg');
          const rps=sfGet(w.id,ex.id,s,'reps');
          const done=sfGet(w.id,ex.id,s,'done')===true;
          html+=`<div class="set-row ${done?'done':''}">
            <span class="set-row-label">SET ${s+1}</span>
            <div class="set-inputs">
              ${!ex.bw?`<div class="set-field"><label>kg</label><input type="number" step="0.5" min="0" inputmode="decimal" value="${kg}" placeholder="0" onchange="sfSet('${w.id}','${ex.id}',${s},'kg',this.value)"></div>`:''}
              <div class="set-field"><label>reps</label><input type="number" min="0" inputmode="numeric" value="${rps}" placeholder="0" onchange="sfSet('${w.id}','${ex.id}',${s},'reps',this.value)"></div>
            </div>
            <button class="tick-btn ${done?'done':''}" onclick="ovTick('${w.id}','${ex.id}',${s},${ex.sets},${ex.rest})">✓</button>
          </div>`;
        }
        const pb=ex.bw?null:getPB(w.id,ex.id);
        html+=`</div>
          <div class="ex-footer-row" style="margin-top:6px">
            ${ex.rest>0?`<button class="rest-btn ${timers[ex.id]?(timers[ex.id].running?'running':'done-rest'):''}" id="rbtn_${ex.id}" onclick="startTimer('${ex.id}',${ex.rest})">⏱ Start rest (${fmtT(ex.rest)})</button>`:'<span style="font-size:11px;color:var(--text3);font-style:italic">No rest — superset</span>'}
            ${pb?`<span class="pb-chip">★ PB ${pb}kg</span>`:''}
          </div>
        </div>`;
      }
      html+=`</div>`;
      if(ex.ss&&eIdx<exes.length-1){
        html+=`<div class="ss-ov-conn"><div class="ss-ov-line"></div><span class="ss-ov-lbl">+ superset</span><div class="ss-ov-line"></div></div>`;
      }
    });
  });

  const fin=w.finisher;
  const finOpen=!!openFinisher[w.id];
  html+=`<div class="finisher-card" style="margin:12px 0 0">
    <div class="finisher-hdr" onclick="toggleFin('${w.id}')">
      <span class="finisher-badge">FINISHER</span>
      <span class="finisher-title">${fin.scheme}</span>
      <span class="finisher-chevron ${finOpen?'open':''}">⌄</span>
    </div>
    ${finOpen?`<div class="finisher-body">${fin.lines.map(l=>`<div class="finisher-line"><span class="finisher-bullet">▸</span>${l}</div>`).join('')}</div>`:''}
  </div></div>`;
  return html;
}

function goToScreen(idx){
  const screens=buildScreens(currentWorkout);
  coachIdx=Math.max(0,Math.min(idx,screens.length));
  renderWorkout();window.scrollTo(0,0);
}

function tickSet(wid,exId,s,totalSets,rest,timerId){
  const cur=sfGet(wid,exId,s,'done');
  sfSet(wid,exId,s,'done',cur!==true);
  if(cur!==true&&s===totalSets-1&&rest>0) startTimer(timerId,rest);
  checkAutoAdvance(wid);
  renderWorkout();
}

function ovTick(wid,exId,s,totalSets,rest){
  const cur=sfGet(wid,exId,s,'done');
  sfSet(wid,exId,s,'done',cur!==true);
  if(cur!==true&&s===totalSets-1&&rest>0) startTimer(exId,rest);
  checkAutoAdvance(wid);
  renderWorkout();
}

function toggleBlock(k){openBlocks[k]=!openBlocks[k];renderWorkout();}
function toggleFin(id){openFinisher[id]=!openFinisher[id];renderWorkout();}

function resetAndGoHome(wid){
  // Reset ticks only — keep weights and reps, keep week
  const w=WORKOUTS.find(x=>x.id===wid);
  if(w) for(const g of w.groups) for(const ex of g.exercises)
    for(let s=0;s<ex.sets;s++) sfSet(wid,ex.id,s,'done',false);
  goHome();
}

let chartMetric = 'weight';

function getStats(){ return lsGet('bodyStats',[]); }
function saveStats(arr){ lsSet('bodyStats',arr); }

function openStats(){
  showScreen('statsScreen');
  renderStats();
}

function fmtDate(iso){
  const d=new Date(iso);
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
}

function calcFFMI(weightLbs, bfPct){
  if(!weightLbs||!bfPct) return null;
  const weightKg=weightLbs*0.453592;
  const heightM=1.7526; // 5'9"
  const leanKg=weightKg*(1-(bfPct/100));
  const ffmi=leanKg/(heightM*heightM);
  const normalised=ffmi+(6.1*(1.8-heightM));
  return normalised.toFixed(1);
}

function calcBMI(weightLbs){
  if(!weightLbs) return null;
  const weightKg=weightLbs*0.453592;
  const heightM=1.7526; // 5'9"
  const bmi=weightKg/(heightM*heightM);
  return bmi.toFixed(1);
}

function renderStats(){
  const stats=getStats().sort((a,b)=>new Date(b.date)-new Date(a.date));
  const latest=stats[0];
  const prev=stats[1];

  let html='';

  // ── HERO — current numbers ──
  html+=`<div class="stat-hero">
    <div class="stat-hero-label">Current</div>
    <div class="stat-hero-grid">`;

  const heroItems=[
    {key:'weight',   label:'Weight',   unit:'lbs',  cls:'navy',  lowerBetter:false},
    {key:'bodyfat',  label:'Body Fat', unit:'%',    cls:'green', lowerBetter:true},
    {key:'waist',    label:'Waist',    unit:'in',   cls:'',      lowerBetter:true},
  ];
  const bmiVal=latest&&latest.weight?calcBMI(latest.weight):null;
  const bmiPrev=prev&&prev.weight?calcBMI(prev.weight):null;

  heroItems.forEach(item=>{
    const val=latest&&latest[item.key]?latest[item.key]:null;
    const prevVal=prev&&prev[item.key]?prev[item.key]:null;
    let delta='';
    if(val&&prevVal){
      const d=(parseFloat(val)-parseFloat(prevVal)).toFixed(1);
      if(Math.abs(d)<0.05){
        delta=`<div class="stat-hero-delta delta-none">—</div>`;
      } else {
        const isGood=item.lowerBetter?(d<0):(d>0);
        const cls=isGood?'delta-down':'delta-up';
        delta=`<div class="stat-hero-delta ${cls}">${d>0?'+':''}${d}</div>`;
      }
    }
    html+=`<div class="stat-hero-item">
      <div class="stat-hero-val ${item.cls}">${val||'—'}<span class="stat-hero-unit">${val?item.unit:''}</span></div>
      <div class="stat-hero-lbl">${item.label}</div>
      ${delta}
    </div>`;
  });

  // BMI computed
  html+=`<div class="stat-hero-item">
    <div class="stat-hero-val">${bmiVal||'—'}</div>
    <div class="stat-hero-lbl">BMI</div>
  </div>`;

  // FFMI computed
  const ffmi=latest?calcFFMI(latest.weight,latest.bodyfat):null;
  html+=`<div class="stat-hero-item">
    <div class="stat-hero-val navy">${ffmi||'—'}</div>
    <div class="stat-hero-lbl">FFMI</div>
  </div>`;

  html+=`</div></div>`;

  // ── TARGET NOTE ──
  html+=`<div class="stat-note">Target: 185 lbs at ~12% body fat. Weigh in the same way each week — same day, first thing, before eating. Weekly trend matters more than any single number.</div>`;

  // ── LOG NEW ENTRY ──
  const today=new Date().toISOString().split('T')[0];
  html+=`<div class="stat-log-card">
    <div class="stat-log-hdr">
      <h3>Log Entry</h3>
      <span>Weekly</span>
    </div>
    <div class="stat-log-body">
      <div class="stat-input-grid">
        <div class="stat-input-group">
          <label>Date</label>
          <input type="date" id="statDate" value="${today}">
        </div>
        <div class="stat-input-group">
          <label>Weight (lbs)</label>
          <input type="number" step="0.1" min="0" inputmode="decimal" id="statWeight" placeholder="—">
        </div>
        <div class="stat-input-group">
          <label>Body Fat (%)</label>
          <input type="number" step="0.1" min="0" max="60" inputmode="decimal" id="statBodyfat" placeholder="—">
        </div>
        <div class="stat-input-group">
          <label>Waist (in)</label>
          <input type="number" step="0.1" min="0" inputmode="decimal" id="statWaist" placeholder="—">
        </div>
      </div>
      <button class="save-stat-btn" onclick="saveStatEntry()">Save Entry</button>
    </div>
  </div>`;

  // ── CHART ──
  html+=`<div class="chart-card">
    <div class="chart-hdr">
      <h3>Progress</h3>
      <div class="chart-metric-toggle">
        ${[['weight','Weight'],['bodyfat','Body Fat'],['waist','Waist']].map(([k,l])=>
          `<button class="chart-metric-btn ${chartMetric===k?'active':''}" onclick="setChartMetric('${k}')">${l}</button>`
        ).join('')}
      </div>
    </div>
    <div class="chart-body">${renderChart(stats)}</div>
  </div>`;

  // ── HISTORY ──
  html+=`<div class="history-card">
    <div class="history-hdr">
      <h3>History</h3>
      <span>${stats.length} ${stats.length===1?'entry':'entries'}</span>
    </div>`;

  if(stats.length===0){
    html+=`<div class="history-empty">No entries yet — log your first above</div>`;
  } else {
    stats.forEach((s,i)=>{
      const bmi=s.weight?calcBMI(s.weight):null;
      html+=`<div class="history-row">
        <span class="history-date">${fmtDate(s.date)}</span>
        <div class="history-vals">
          ${s.weight?`<div class="history-val"><span class="history-val-num">${s.weight}</span><span class="history-val-lbl">LBS</span></div>`:''}
          ${s.bodyfat?`<div class="history-val"><span class="history-val-num">${s.bodyfat}%</span><span class="history-val-lbl">BF</span></div>`:''}
          ${s.waist?`<div class="history-val"><span class="history-val-num">${s.waist}"</span><span class="history-val-lbl">WAIST</span></div>`:''}
          ${bmi?`<div class="history-val"><span class="history-val-num">${bmi}</span><span class="history-val-lbl">BMI</span></div>`:''}
        </div>
        <button class="history-delete" onclick="deleteStatEntry('${s.date}')">×</button>
      </div>`;
    });
  }
  html+=`</div>`;

  document.getElementById('statsContent').innerHTML=html;
}

function renderChart(stats){
  const metricLabels={weight:'Weight (lbs)',bodyfat:'Body Fat (%)',waist:'Waist (in)'};
  const pts=stats.filter(s=>s[chartMetric]).sort((a,b)=>new Date(a.date)-new Date(b.date));

  if(pts.length<2) return `<div class="chart-empty">Log at least 2 entries to see your ${metricLabels[chartMetric].toLowerCase()} trend</div>`;

  const vals=pts.map(p=>parseFloat(p[chartMetric]));
  const min=Math.min(...vals), max=Math.max(...vals);
  const range=(max-min)||1;
  const pad=range*0.15;
  const yMin=min-pad, yMax=max+pad, yRange=yMax-yMin;

  const w=100, h=100;
  const coords=pts.map((p,i)=>{
    const x=(i/(pts.length-1))*w;
    const y=h-(((parseFloat(p[chartMetric])-yMin)/yRange)*h);
    return {x,y,val:p[chartMetric],date:p.date};
  });

  const linePath=coords.map((c,i)=>`${i===0?'M':'L'}${c.x.toFixed(2)},${c.y.toFixed(2)}`).join(' ');
  const areaPath=linePath+` L${w},${h} L0,${h} Z`;

  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:150px;overflow:visible;">
    <defs>
      <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3B5BA9" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="#3B5BA9" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <line x1="0" y1="0" x2="${w}" y2="0" stroke="#2A2B2E" stroke-width="0.4" vector-effect="non-scaling-stroke"/>
    <line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="#2A2B2E" stroke-width="0.4" vector-effect="non-scaling-stroke"/>
    <line x1="0" y1="${h}" x2="${w}" y2="${h}" stroke="#2A2B2E" stroke-width="0.4" vector-effect="non-scaling-stroke"/>
    <path d="${areaPath}" fill="url(#chartGrad)"/>
    <path d="${linePath}" fill="none" stroke="#5B82D6" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
    ${coords.map(c=>`<circle cx="${c.x.toFixed(2)}" cy="${c.y.toFixed(2)}" r="3" fill="#0D0E10" stroke="#5B82D6" stroke-width="2" vector-effect="non-scaling-stroke"/>`).join('')}
  </svg>
  <div style="display:flex;justify-content:space-between;margin-top:10px;font-family:var(--mono);font-size:10px;color:var(--text3);">
    <span>${fmtDate(pts[0].date)} · ${pts[0][chartMetric]}</span>
    <span style="color:var(--navy-text);font-weight:500;">${fmtDate(pts[pts.length-1].date)} · ${pts[pts.length-1][chartMetric]}</span>
  </div>`;
}

function setChartMetric(m){ chartMetric=m; renderStats(); }

function saveStatEntry(){
  const date=document.getElementById('statDate').value;
  if(!date){ alert('Pick a date'); return; }

  const entry={
    date,
    weight:  document.getElementById('statWeight').value||'',
    bodyfat: document.getElementById('statBodyfat').value||'',
    waist:   document.getElementById('statWaist').value||'',
  };

  if(!entry.weight&&!entry.bodyfat&&!entry.waist){
    alert('Enter at least one measurement');
    return;
  }

  let stats=getStats();
  stats=stats.filter(s=>s.date!==date); // replace same-date entry
  stats.push(entry);
  saveStats(stats);
  showToast('Entry saved 📊');
  renderStats();
  renderHome();
}

function deleteStatEntry(date){
  if(!confirm('Delete this entry?')) return;
  saveStats(getStats().filter(s=>s.date!==date));
  renderStats();
  renderHome();
}

function updateStatsSummary(){
  const el=document.getElementById('statsSummary');
  if(!el) return;
  const stats=getStats().sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(stats.length===0){ el.textContent='Weight · Body fat · Measurements'; return; }
  const l=stats[0];
  const parts=[];
  if(l.weight)  parts.push(`${l.weight} lbs`);
  if(l.bodyfat) parts.push(`${l.bodyfat}% BF`);
  if(l.waist)   parts.push(`${l.waist}" waist`);
  el.textContent=parts.length?parts.join(' · '):'Weight · Body fat · Measurements';
}
