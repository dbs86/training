<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="DBS PPLX" />
<meta name="application-name" content="DBS PPLX" />
<meta name="theme-color" content="#0A0B0D" />
<link rel="manifest" href="./manifest.json" />
<title>DBS PPLX</title>
<script>
  /* Apply saved theme before first paint (no flash) */
  (function(){
    var pref = 'system';
    try { var raw = localStorage.getItem('ftx_theme'); if(raw) pref = JSON.parse(raw); } catch(e){}
    var dark = true;
    try { dark = pref === 'system' ? window.matchMedia('(prefers-color-scheme: dark)').matches : pref === 'dark'; } catch(e){}
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    var m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', dark ? '#0A0B0D' : '#F2F3F6');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  /* ============ THEME TOKENS ============ */
  :root, [data-theme="dark"]{
    --bg:#0A0B0D;
    --surface:#131417;
    --surface-2:#1A1C20;
    --surface-3:#25282D;
    --line:rgba(255,255,255,0.07);
    --line-strong:rgba(255,255,255,0.13);
    --text:#F2F3F5;
    --text-2:#A0A6B1;
    --text-3:#666D78;
    --accent:#5B8CFF;
    --accent-rgb:91,140,255;
    --accent-ink:#FFFFFF;
    --accent-soft:rgba(91,140,255,0.14);
    --accent-line:rgba(91,140,255,0.38);
    --success:#34D399;
    --success-soft:rgba(52,211,153,0.14);
    --warn:#F5B83D;
    --danger:#FF6B6B;
    --shadow:0 1px 0 rgba(255,255,255,0.035) inset, 0 12px 32px -16px rgba(0,0,0,0.7);
    --backdrop:rgba(0,0,0,0.62);
    --chart-grid:rgba(255,255,255,0.06);
    --glow:radial-gradient(120% 60% at 0% 0%, rgba(91,140,255,0.10) 0%, rgba(91,140,255,0) 60%);
    --seg-bg:rgba(255,255,255,0.04);
    --seg-on:#30343B;
    color-scheme:dark;
  }
  [data-theme="light"]{
    --bg:#F2F3F6;
    --surface:#FFFFFF;
    --surface-2:#F4F5F8;
    --surface-3:#E6E8ED;
    --line:rgba(16,18,24,0.08);
    --line-strong:rgba(16,18,24,0.15);
    --text:#0E1014;
    --text-2:#565D69;
    --text-3:#8A919C;
    --accent:#2F5BD8;
    --accent-rgb:47,91,216;
    --accent-ink:#FFFFFF;
    --accent-soft:rgba(47,91,216,0.09);
    --accent-line:rgba(47,91,216,0.32);
    --success:#0F9A64;
    --success-soft:rgba(15,154,100,0.10);
    --warn:#B87A05;
    --danger:#D14343;
    --shadow:0 1px 2px rgba(16,18,24,0.04), 0 10px 28px -14px rgba(16,18,24,0.16);
    --backdrop:rgba(14,16,20,0.38);
    --chart-grid:rgba(16,18,24,0.07);
    --glow:radial-gradient(120% 60% at 0% 0%, rgba(47,91,216,0.07) 0%, rgba(47,91,216,0) 60%);
    --seg-bg:rgba(16,18,24,0.05);
    --seg-on:#FFFFFF;
    color-scheme:light;
  }
  :root{
    --font-display:'Barlow Condensed','Oswald','Arial Narrow',system-ui,sans-serif;
    --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --r-xl:26px; --r-lg:20px; --r-md:14px; --r-sm:10px;
    --gutter:18px;
    --sunrise:linear-gradient(135deg,#FF7A3D 0%,#FFB23D 100%);
  }

  /* ============ BASE ============ */
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:var(--font-body); font-size:15px; line-height:1.4;
    min-height:100vh; overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
    transition:background-color .25s ease, color .25s ease;
  }
  #root{max-width:520px; margin:0 auto; min-height:100vh; position:relative;}
  ::-webkit-scrollbar{display:none;} *{scrollbar-width:none;}
  button{font-family:inherit; cursor:pointer; color:inherit; text-align:inherit; background:none; border:none; padding:0; font-size:inherit;}
  button:disabled{cursor:default;}
  input,select{font-family:inherit;}
  h1,h2,h3{margin:0;}

  .page{padding:calc(env(safe-area-inset-top) + 10px) var(--gutter) calc(env(safe-area-inset-bottom) + 32px); animation:fadeIn .22s ease-out;}
  .has-ticker .page{padding-bottom:calc(env(safe-area-inset-bottom) + 100px);}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow);}
  .pad{padding:18px;}
  .eyebrow{font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--text-3);}
  .display{font-family:var(--font-display); font-weight:700; letter-spacing:.01em; text-transform:uppercase; line-height:.95;}
  .muted{color:var(--text-2);}
  .faint{color:var(--text-3);}
  .c-ink{color:var(--c);}
  [data-theme="light"] .c-ink{color:color-mix(in srgb, var(--c) 72%, #000);}
  .tabnum{font-variant-numeric:tabular-nums;}

  .sec{margin-top:26px;}
  .sec-head{display:flex; align-items:baseline; justify-content:space-between; margin:0 2px 10px;}
  .sec-head h2{font-size:13px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--text-2);}
  .sec-head .meta{font-size:12px; color:var(--text-3); font-weight:600;}

  .icon-btn{
    width:40px; height:40px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--surface); border:1px solid var(--line); color:var(--text);
    transition:transform .12s, background .15s;
  }
  .icon-btn:active{transform:scale(.94); background:var(--surface-2);}
  .icon-btn.sm{width:30px; height:30px; border-radius:9px; background:var(--surface-2); color:var(--text-3);}
  .icon-btn:disabled{opacity:.35;}

  .chip{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:4px 9px; border-radius:99px; background:var(--surface-2); color:var(--text-2); border:1px solid var(--line); white-space:nowrap;}
  .chip.accent{background:var(--accent-soft); color:var(--accent); border-color:var(--accent-line);}
  .chip.done{background:var(--success-soft); color:var(--success); border-color:transparent;}
  .chip.gold{background:rgba(245,184,61,.14); color:var(--warn); border-color:transparent;}

  /* Buttons */
  .btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:14px 16px; border-radius:var(--r-md); font-weight:700; font-size:14.5px; transition:transform .12s, opacity .15s, background .15s;}
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.4; transform:none;}
  .btn-primary{background:var(--accent); color:var(--accent-ink); box-shadow:0 8px 20px -10px rgba(var(--accent-rgb),.8);}
  .btn-soft{background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent-line);}
  .btn-ghost{background:var(--surface-2); color:var(--text); border:1px solid var(--line);}
  .btn-danger{background:transparent; color:var(--danger); border:1px solid color-mix(in srgb, var(--danger) 40%, transparent);}
  .btn-sunrise{background:var(--sunrise); color:#1B1004; box-shadow:0 10px 24px -12px rgba(255,140,61,.9);}
  .btn-row{display:flex; gap:10px;}
  .btn-row .btn{flex:1;}

  /* Segmented control */
  .seg{display:flex; background:var(--seg-bg); border:1px solid var(--line); border-radius:13px; padding:3px; gap:2px;}
  .seg button{flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:9px 6px; border-radius:10px; font-weight:700; font-size:13px; color:var(--text-2); transition:background .15s, color .15s;}
  .seg button.on{background:var(--seg-on); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.16), 0 0 0 1px var(--line);}

  /* Stats */
  .stat-grid{display:grid; gap:10px;}
  .stat-grid.c2{grid-template-columns:1fr 1fr;}
  .stat-grid.c3{grid-template-columns:repeat(3,1fr);}
  .stat{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-md); padding:12px 12px 11px; min-width:0;}
  .stat .v{font-family:var(--font-display); font-size:30px; font-weight:700; line-height:1; letter-spacing:.01em; white-space:nowrap;}
  .stat .v small{font-family:var(--font-body); font-size:11px; font-weight:600; color:var(--text-3); margin-left:3px; letter-spacing:0;}
  .stat .l{font-size:10.5px; font-weight:700; color:var(--text-3); margin-top:6px; text-transform:uppercase; letter-spacing:.08em;}

  /* History list */
  .hist{display:flex; flex-direction:column;}
  .hist-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 2px; border-bottom:1px solid var(--line); font-size:13.5px;}
  .hist-row:last-child{border-bottom:none;}
  .hist-row .d{color:var(--text-2); font-weight:500; white-space:nowrap;}
  .hist-row .r{display:flex; align-items:center; gap:8px; font-weight:700; text-align:right; min-width:0;}
  .hist-row .r small{color:var(--text-3); font-weight:500;}
  .hist-row .note{color:var(--text-3); font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:140px;}
  .empty{color:var(--text-3); font-size:13px; text-align:center; padding:22px 0;}

  .chart-box{height:150px; margin:16px 0 14px;}

  /* ============ HOME ============ */
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:6px 0 0;}
  .brand{display:flex; align-items:center; gap:8px;}
  .brand-mark{font-family:var(--font-display); font-weight:800; font-size:15px; letter-spacing:.06em; background:var(--text); color:var(--bg); padding:5px 7px 4px; border-radius:7px; line-height:1;}
  .brand-name{font-family:var(--font-display); font-weight:800; font-size:21px; letter-spacing:.08em; line-height:1;}
  .brand-name span{color:var(--accent);}
  .hello{margin:22px 2px 0;}
  .hello-title{font-size:27px; font-weight:800; letter-spacing:-.02em; margin-top:4px; line-height:1.15;}

  .week-card{margin-top:18px; padding:18px; background-image:var(--glow);}
  .week-top{display:flex; justify-content:space-between; align-items:flex-end; gap:12px;}
  .week-big{display:flex; align-items:baseline; gap:8px; margin-top:6px;}
  .week-big .n{font-family:var(--font-display); font-size:64px; font-weight:800; line-height:.85;}
  .week-big .of{font-family:var(--font-display); font-size:24px; font-weight:700; color:var(--text-3);}
  .week-sub{font-size:13px; color:var(--text-2); margin-top:8px;}
  .week-arrows{display:flex; gap:8px;}
  .week-segs{display:grid; grid-template-columns:repeat(12,1fr); gap:4px; margin-top:18px;}
  .week-segs i{height:6px; border-radius:3px; background:var(--surface-3); display:block;}
  .week-segs i.past{background:color-mix(in srgb, var(--accent) 45%, var(--surface-3));}
  .week-segs i.now{background:var(--accent); box-shadow:0 0 12px rgba(var(--accent-rgb),.7);}

  .morning-card{position:relative; display:flex; align-items:center; gap:16px; width:100%; padding:18px; overflow:hidden; text-align:left;}
  .morning-card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--sunrise);}
  .morning-card::after{content:""; position:absolute; right:-40px; top:-60px; width:180px; height:180px; border-radius:50%; background:radial-gradient(circle, rgba(255,150,61,.20), rgba(255,150,61,0) 70%); pointer-events:none;}
  .morning-card:active{transform:scale(.99);}
  .morning-main{flex:1; min-width:0;}
  .morning-title{font-family:var(--font-display); font-size:30px; font-weight:800; text-transform:uppercase; line-height:.95; margin-top:6px;}
  .morning-sub{font-size:12.5px; color:var(--text-2); margin-top:6px; line-height:1.45;}
  .morning-foot{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;}
  .sun-tag{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:#E0701F;}
  [data-theme="dark"] .sun-tag{color:#FFA24D;}

  .s-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .s-card{position:relative; overflow:hidden; padding:16px 16px 14px; text-align:left; display:flex; flex-direction:column; min-height:186px; gap:0; transition:transform .12s;}
  .s-card:active{transform:scale(.97);}
  .s-card::before{content:""; position:absolute; left:16px; right:16px; top:0; height:3px; border-radius:0 0 3px 3px; background:var(--c);}
  .s-card::after{content:""; position:absolute; right:-50px; bottom:-60px; width:140px; height:140px; border-radius:50%; background:radial-gradient(circle, color-mix(in srgb, var(--c) 22%, transparent), transparent 70%); pointer-events:none;}
  .s-top{display:flex; justify-content:space-between; align-items:center; gap:6px;}
  .s-icon{width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:color-mix(in srgb, var(--c) 15%, transparent);}
  .s-name{font-family:var(--font-display); font-size:34px; font-weight:800; text-transform:uppercase; line-height:.9; margin-top:18px;}
  .s-sub{font-size:11.5px; color:var(--text-2); margin-top:6px; line-height:1.35; min-height:2.7em;}
  .s-foot{display:flex; align-items:center; justify-content:space-between; gap:6px; margin-top:auto; padding-top:10px; border-top:1px solid var(--line); font-size:11px; color:var(--text-3); font-weight:600;}
  .s-foot span{display:inline-flex; align-items:center; gap:4px;}

  .log-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .log-card{display:flex; align-items:center; gap:12px; padding:14px; text-align:left; transition:transform .12s;}
  .log-card:active{transform:scale(.97);}
  .log-card .s-icon{width:40px; height:40px;}
  .log-card .t{font-weight:700; font-size:14.5px;}
  .log-card .s{font-size:11.5px; color:var(--text-3); margin-top:2px;}

  .row-card{display:flex; align-items:center; gap:14px; width:100%; padding:16px; text-align:left; transition:transform .12s;}
  .row-card:active{transform:scale(.99);}
  .row-card .grow{flex:1; min-width:0;}
  .row-card .t{font-weight:700; font-size:15px;}
  .row-card .s{font-size:12.5px; color:var(--text-2); margin-top:3px;}
  .row-icon{width:44px; height:44px; border-radius:14px; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; flex-shrink:0;}

  .stats-btn{display:block; width:100%; padding:12px; text-align:left;}
  .stats-btn .stat{background:transparent; border:none; padding:6px 8px;}
  .stats-btn .stat + .stat{border-left:1px solid var(--line); border-radius:0;}
  .stats-btn .stat-grid{gap:0;}

  .heat{display:grid; grid-template-columns:repeat(12,1fr); gap:5px; margin-top:16px;}
  .heat-cell{aspect-ratio:1; border-radius:6px; background:var(--surface-2); border:1px solid var(--line); position:relative;}
  .heat-cell.l1{background:rgba(var(--accent-rgb),.28); border-color:transparent;}
  .heat-cell.l2{background:rgba(var(--accent-rgb),.6); border-color:transparent;}
  .heat-cell.l3{background:var(--accent); border-color:transparent;}
  .heat-cell.now{box-shadow:0 0 0 2px var(--bg), 0 0 0 3.5px var(--text-2);}
  .heat-labels{display:flex; justify-content:space-between; margin-top:8px; font-size:10.5px; color:var(--text-3); font-weight:600;}

  .foot-brand{text-align:center; margin-top:34px; font-size:11px; color:var(--text-3); letter-spacing:.14em; text-transform:uppercase; font-weight:700;}

  /* ============ SUB-PAGE HEADER ============ */
  .ph{position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; margin:0 calc(var(--gutter) * -1); padding:calc(env(safe-area-inset-top) + 10px) var(--gutter) 12px; background:color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);}
  .page > .ph{margin-top:calc((env(safe-area-inset-top) + 10px) * -1);}
  .ph .titles{flex:1; min-width:0;}
  .ph .t{font-family:var(--font-display); font-size:26px; font-weight:800; text-transform:uppercase; line-height:1.05; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ph .s{font-size:12px; color:var(--text-2); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* ============ SHEET (MODAL) ============ */
  .sheet-bg{position:fixed; inset:0; background:var(--backdrop); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); z-index:80; display:flex; align-items:flex-end; animation:bgIn .18s ease-out;}
  @keyframes bgIn{from{opacity:0;} to{opacity:1;}}
  .sheet{width:100%; max-width:520px; margin:0 auto; background:var(--surface); border-radius:28px 28px 0 0; border:1px solid var(--line); border-bottom:none; padding:10px 20px calc(env(safe-area-inset-bottom) + 22px); max-height:88vh; overflow-y:auto; animation:sheetUp .26s cubic-bezier(.2,.9,.3,1);}
  @keyframes sheetUp{from{transform:translateY(40px); opacity:.4;} to{transform:none; opacity:1;}}
  .sheet-grip{width:38px; height:5px; border-radius:3px; background:var(--surface-3); margin:0 auto 14px;}
  .sheet-title{font-family:var(--font-display); font-size:26px; font-weight:800; text-transform:uppercase; margin-bottom:16px; line-height:1;}
  .sheet-actions{display:flex; gap:10px; margin-top:20px;}
  .sheet-actions .btn{flex:1;}
  .sheet-actions .btn-primary{flex:1.4;}

  .field{margin-bottom:14px;}
  .field > label, .field-label{display:block; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); margin-bottom:7px;}
  .input{width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-md); padding:13px 14px; color:var(--text); font-size:16px; font-weight:600; outline:none; transition:border-color .15s, box-shadow .15s; -webkit-appearance:none; appearance:none;}
  .input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  .input::placeholder{color:var(--text-3); font-weight:500;}
  .help{font-size:12px; color:var(--text-3); margin-top:8px; line-height:1.5;}
  .help b{color:var(--text-2); word-break:break-all;}

  .set-group{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-lg); padding:14px; margin-bottom:12px;}
  .set-group-title{display:flex; align-items:center; gap:8px; font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--text-2); margin-bottom:12px;}
  .set-group .input{background:var(--surface);}
  .set-group .btn-ghost{background:var(--surface);}

  /* ============ SESSION ============ */
  .progress{display:flex; align-items:center; gap:10px; margin:14px 0 14px;}
  .progress-bar{flex:1; display:flex; gap:4px;}
  .progress-bar i{flex:1; height:5px; border-radius:3px; background:var(--surface-3); display:block; transition:background .2s;}
  .progress-bar i.done{background:color-mix(in srgb, var(--c) 55%, var(--surface-3));}
  .progress-bar i.now{background:var(--c);}
  .progress-lbl{font-size:12px; font-weight:700; color:var(--text-2); white-space:nowrap;}

  .step{padding:20px 18px 18px; position:relative;}
  .step-title{font-family:var(--font-display); font-size:32px; font-weight:800; text-transform:uppercase; line-height:.95; margin-top:6px; padding-right:78px;}
  .step-note{font-size:12.5px; color:var(--text-2); margin-top:8px; padding-right:78px;}

  .timer{position:absolute; top:16px; right:16px; width:64px; height:64px;}
  .timer svg{transform:rotate(-90deg); display:block;}
  .timer .bg{fill:none; stroke:var(--surface-3); stroke-width:5;}
  .timer .fg{fill:none; stroke:var(--accent); stroke-width:5; stroke-linecap:round; transition:stroke-dashoffset 1s linear;}
  .timer .lbl{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:800; font-size:14px;}

function applyTheme(resolved){
  const root = document.documentElement;
  if(root.getAttribute('data-theme') !== resolved) root.setAttribute('data-theme', resolved);
  const m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', THEME_COLORS[resolved]);

function useSystemDark(){
  const get = () => { try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch(e){ return true; } };
  const [dark, setDark] = useState(get);
  useEffect(()=>{
    let mq; try { mq = window.matchMedia('(prefers-color-scheme: dark)'); } catch(e){ return; }
    const on = () => setDark(mq.matches);
    if(mq.addEventListener) mq.addEventListener('change', on); else if(mq.addListener) mq.addListener(on);
    return () => { if(mq.removeEventListener) mq.removeEventListener('change', on); else if(mq.removeListener) mq.removeListener(on); };
  }, []);
  return dark;
}

/* ---------------- BEEP / NOTIFY ---------------- */
let _audioCtx = null;
function getAudioCtx(){
  try{
    if(!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(_audioCtx.state === 'suspended') _audioCtx.resume().catch(()=>{});
    return _audioCtx;
  }catch(e){ return null; }
}
function playBeep(){
  const ctx = getAudioCtx();
  if(!ctx) return;
  try{
    [0,0.18,0.36].forEach((t,i)=>{
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type='sine'; o.frequency.value = i===2?1050:850;
      g.gain.setValueAtTime(0.0001, ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+t+0.15);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.16);
    });
  }catch(e){}
}
function vibrate(p){ if(navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} } }
function requestNotifyPermission(cb){
  try{
    if('Notification' in window && Notification.permission==='default'){
      const r = Notification.requestPermission(()=>cb && cb());
      if(r && r.then) r.then(()=>cb && cb());
    }
  }catch(e){}
}
function notify(title, body){
  try{
    if('Notification' in window && Notification.permission==='granted'){
      new Notification(title, {body});
    }
  }catch(e){}
}

/* ---------------- SPOTIFY (PKCE) ---------------- */
const SPOTIFY_SCOPES = 'user-read-currently-playing user-read-playback-state user-modify-playback-state';
function getRedirectUri(){ return window.location.origin + window.location.pathname; }
function base64UrlEncode(buffer){
  return btoa(String.fromCharCode(...new Uint8Array(buffer))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function generateRandomString(len){
  const arr = new Uint8Array(len);
  crypto.getRandomValues(arr);
  return base64UrlEncode(arr.buffer).slice(0,len);
}
async function sha256(plain){
  return await crypto.subtle.digest('SHA-256', new TextEncoder().encode(plain));
}
async function startSpotifyAuth(clientId){
  const verifier = generateRandomString(64);
  localStorage.setItem('ftx_spotify_verifier', verifier);
  const challenge = base64UrlEncode(await sha256(verifier));
  const params = new URLSearchParams({
    client_id: clientId, response_type: 'code', redirect_uri: getRedirectUri(),
    scope: SPOTIFY_SCOPES, code_challenge_method: 'S256', code_challenge: challenge,
  });
  window.location.href = `https://accounts.spotify.com/authorize?${params.toString()}`;
}
async function exchangeSpotifyCode(clientId, code){
  const verifier = localStorage.getItem('ftx_spotify_verifier');
  const body = new URLSearchParams({client_id: clientId, grant_type:'authorization_code', code, redirect_uri:getRedirectUri(), code_verifier:verifier});
  const res = await fetch('https://accounts.spotify.com/api/token', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body});
  if(!res.ok) throw new Error('token exchange failed');
  return res.json();
}
async function refreshSpotifyToken(clientId, refreshToken){
  const body = new URLSearchParams({client_id: clientId, grant_type:'refresh_token', refresh_token: refreshToken});
  const res = await fetch('https://accounts.spotify.com/api/token', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body});
  if(!res.ok) throw new Error('refresh failed');
  return res.json();
}
async function getValidSpotifyToken(clientId, tokens, setTokens){
  if(!tokens) return null;
  if(Date.now() < tokens.expires_at - 15000) return tokens.access_token;
  try{
    const data = await refreshSpotifyToken(clientId, tokens.refresh_token);
    const next = {access_token:data.access_token, refresh_token:data.refresh_token || tokens.refresh_token, expires_at:Date.now()+data.expires_in*1000};
    setTokens(next);
    return next.access_token;
  }catch(e){ return null; }
}

/* ---------------- HELPERS ---------------- */
function roundTo(v, step){ return Math.round(v/step)*step; }
function estimate1RM(weight, reps){ return weight*(1+reps/30); }
function firstNumber(str){
  if(str==null) return null;
  const m = String(str).match(/\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : null;
}
function computeWarmup(weight){
  return [
    {pct:40, w:roundTo(weight*0.4,2.5), reps:5},
    {pct:60, w:roundTo(weight*0.6,2.5), reps:3},
    {pct:80, w:roundTo(weight*0.8,2.5), reps:2},
  ];
}
const PLATES = [25,20,15,10,5,2.5,1.25];
function computePlates(weight){
  const bar = 20;
  if(weight < bar) return null;
  let remaining = roundTo((weight-bar)/2, 1.25);
  const used = [];
  for(const p of PLATES){
    while(remaining >= p - 0.001){ used.push(p); remaining = Math.round((remaining-p)*100)/100; }
  }
  return used;
}
function kgToUnit(kg, unit){ return unit==='lb' ? kg*2.20462 : kg; }
function unitToKg(val, unit){ return unit==='lb' ? val/2.20462 : val; }
function computeBMI(weightKg, heightCm){
  if(!weightKg || !heightCm) return null;
  const h = heightCm/100;
  return weightKg/(h*h);
}
function computeSessionVolume(session, week, logs){
  let total = 0;
  session.groups.forEach((g, gi)=>{
    g.exercises.forEach((ex, ei)=>{
      const entry = logs[`w${week}_${session.id}_${gi}_${ei}`];
      if(!entry || !entry.done) return;
      const doneCount = entry.done.filter(Boolean).length;
      if(doneCount<=0) return;
      const w = parseFloat(entry.weight);
      const r = firstNumber(entry.reps) || firstNumber(ex.reps);
      if(isFinite(w) && w>0 && r) total += w*r*doneCount;
    });
  });
  return total;
}
const pad2 = n => String(n).padStart(2,'0');
function dayKey(d){ const x = new Date(d); return `${x.getFullYear()}-${pad2(x.getMonth()+1)}-${pad2(x.getDate())}`; }
function fmtDate(d, opts){ return new Date(d).toLocaleDateString('en-GB', opts || {day:'numeric', month:'short'}); }
function fmtHMS(totalSec){
  const s = Math.max(0, Math.floor(totalSec));
  const hh = Math.floor(s/3600), mm = Math.floor((s%3600)/60), ss = s%60;
  return `${hh}:${pad2(mm)}:${pad2(ss)}`;
}
function fmtMS(totalSec){
  const s = Math.max(0, Math.floor(totalSec));
  const hh = Math.floor(s/3600), mm = Math.floor((s%3600)/60), ss = s%60;
  return hh ? `${hh}:${pad2(mm)}:${pad2(ss)}` : `${mm}:${pad2(ss)}`;
}
function toDatetimeLocalValue(iso){
  const d = new Date(iso);
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function fromDatetimeLocalValue(val){ return new Date(val).toISOString(); }
function greetingWord(){
  const h = new Date().getHours();
  if(h<5) return 'Up early';
  if(h<12) return 'Good morning';
  if(h<18) return 'Good afternoon';
  return 'Good evening';
}
function plural(n, word){ return `${n} ${word}${n===1?'':'s'}`; }
function useNow(active, ms=1000){
  const [now, setNow] = useState(Date.now());
  useEffect(()=>{
    if(!active) return;
    const tick = () => setNow(Date.now());
    tick();
    const iv = setInterval(tick, ms);
    const onVis = () => { if(document.visibilityState==='visible') tick(); };
    document.addEventListener('visibilitychange', onVis);
    window.addEventListener('focus', tick);
    return () => { clearInterval(iv); document.removeEventListener('visibilitychange', onVis); window.removeEventListener('focus', tick); };
  }, [active, ms]);
  return now;
}

        <circle className="bg" cx={size/2} cy={size/2} r={r} strokeWidth={stroke}/>
        {pct>0 && <circle className="fg" cx={size/2} cy={size/2} r={r} strokeWidth={stroke}
          stroke={gradientId ? `url(#${gradientId})` : color} strokeDasharray={c} strokeDashoffset={off}/>}
      </svg>
      <div className="in">{children}</div>
    </div>
  );
}

function LineChart({labels, data, fill=true, height=150}){
  const theme = useContext(ThemeContext);
  const ref = useRef(null);
  const inst = useRef(null);
  const sig = JSON.stringify([labels, data]);
  useEffect(()=>{
    if(!ref.current || typeof Chart==='undefined') return;
    if(inst.current) inst.current.destroy();
    const ctx = ref.current.getContext('2d');
    inst.current = new Chart(ctx, lineChartConfig(labels, data, {fill, height}, ctx));
    return () => { if(inst.current){ inst.current.destroy(); inst.current = null; } };
    // eslint-disable-next-line
  }, [sig, theme]);
  return <div className="chart-box" style={{height}}><canvas ref={ref}></canvas></div>;
}

function morningStreak(log){
  const days = new Set(log.map(e=>dayKey(e.date)));
  const d = new Date();
  if(!days.has(dayKey(d))) d.setDate(d.getDate()-1);
  let n = 0;
  while(days.has(dayKey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
const isMorningV2 = (x) => !!x && x.v===2;
function mRoundDone(r){ return !!r && MORNING.circuit.every(ex=> ex.logActual ? r[ex.id]!=null : !!r[ex.id]); }
function mRoundsDone(active){ return isMorningV2(active) ? (active.rounds||[]).filter(mRoundDone).length : 0; }
function mRepTotals(active){
  const out = {};
  MORNING.circuit.forEach(ex=> out[ex.id] = 0);
  if(!isMorningV2(active)) return out;
  (active.rounds||[]).forEach(r=>{
    MORNING.circuit.forEach(ex=>{
      if(ex.logActual){ if(r[ex.id]!=null) out[ex.id] += Number(r[ex.id])||0; }
      else if(r[ex.id]) out[ex.id] += circuitReps(ex, active.plan);
    });
  });
  return out;
}
function morningPullPB(log){
  return log.filter(isMorningV2).reduce((m,e)=> Math.max(m, (e.reps && e.reps.pullup) || 0), 0);
}

function MorningCard({active, log, plan, onOpen}){
  const today = dayKey(new Date());
  const v2log = log.filter(isMorningV2);
  const todays = v2log.filter(e=>dayKey(e.date)===today);
  const doneToday = todays.length>0;
  const activeToday = isMorningV2(active) && active.date===today && !!active.startedAt;
  const target = activeToday ? active.plan.rounds : plan.rounds;
  const shown = activeToday ? mRoundsDone(active) : doneToday ? Math.max(...todays.map(e=>e.rounds||0)) : 0;
  const streak = morningStreak(log);
  const pb = morningPullPB(log);
  return (
    <button className="card morning-card" onClick={onOpen}>
      <div className="morning-main">
        <div className="sun-tag"><Icon name="sunrise" size={13}/>Daily · {MORNING.duration}</div>
        <div className="morning-title">Morning</div>
        <div className="morning-sub">Warm-up · {plan.rounds}-round circuit · Cool-down<br/>KB swings · Press-ups · Squats · Pull-ups</div>
        <div className="morning-foot">
          {doneToday && !activeToday ? <span className="chip done"><Icon name="check" size={11} stroke={3}/>Done today</span>
            : activeToday ? <span className="chip gold">In progress</span>
            : <span className="chip">Not started</span>}
          {streak>0 && <span className="chip"><Icon name="flame" size={11}/>{plural(streak,'day')}</span>}
          {pb>0 && <span className="chip"><Icon name="trophy" size={11}/>{pb} pull-ups</span>}
        </div>
      </div>
      <Ring size={92} stroke={9} pct={target ? shown/target : 0} gradientId="sunGradHome">
        <div className="display tabnum" style={{fontSize:30}}>{shown}</div>
        <div className="faint" style={{fontSize:10, fontWeight:700, marginTop:2}}>/ {target} ROUNDS</div>
      </Ring>
    </button>
  );
}

function ConsistencyCard({completions, week}){
  let streak = 0;
  for(let w=week; w>=1; w--){
    if(completions.some(c=>c.week===w)) streak++; else break;
  }
  const cellCount = (w) => completions.filter(c=>c.week===w).length;
  const totalVol = completions.reduce((s,c)=> s + (c.volume||0), 0);
  return (
    <div className="card pad">
      <div className="stat-grid c3">
        <Stat value={streak} unit="wk" label="Streak"/>
        <Stat value={completions.length} label="Sessions"/>
        <Stat value={totalVol>=1000 ? (totalVol/1000).toFixed(1) : Math.round(totalVol)} unit={totalVol>=1000?'t':'kg'} label="Volume"/>
      </div>
      <div className="heat">
        {Array.from({length:TOTAL_WEEKS}).map((_,i)=>{
          const c = cellCount(i+1);
          const cls = c===0?'':c===1?'l1':c===2?'l2':'l3';
          return <div key={i} className={`heat-cell ${cls} ${i+1===week?'now':''}`} title={`Week ${i+1}: ${plural(c,'session')}`}></div>;
        })}
      </div>
      <div className="heat-labels"><span>Wk 1</span><span>Wk 6</span><span>Wk 12</span></div>
    </div>
  );
}

function FastingView({fast, setFast, fastHistory, setFastHistory, onBack}){
  const now = useNow(!!fast);
  const [goalPick, setGoalPick] = useState(16);
  const [custom, setCustom] = useState(false);
  const [customHours, setCustomHours] = useState('');
  const [displayMode, setDisplayMode] = useState('elapsed');
  const [editingActive, setEditingActive] = useState(false);
  const [editingHistoryIdx, setEditingHistoryIdx] = useState(null);
  const notifiedRef = useRef(false);

  const elapsedSec = fast ? Math.max(0, Math.floor((now - new Date(fast.startTime).getTime())/1000)) : 0;
  const goalHours = fast ? fast.goalHours : goalPick;
  const goalSec = goalHours*3600;
  const remainingSec = Math.max(0, goalSec - elapsedSec);
  const overSec = Math.max(0, elapsedSec - goalSec);
  const goalReached = !!fast && elapsedSec >= goalSec;
  const pct = fast ? elapsedSec/goalSec : 0;

  useEffect(()=>{
    if(fast && goalReached && !notifiedRef.current){
      notifiedRef.current = true;
      notify('Fast complete', `You hit your ${fast.goalHours}h goal.`);
      vibrate([120,80,120,80,120]);
    }
    if(!fast) notifiedRef.current = false;
  }, [goalReached, fast]);

  const customVal = parseFloat(customHours);
  const chosenGoal = custom ? customVal : goalPick;
  const canStart = isFinite(chosenGoal) && chosenGoal > 0;
  const startFast = () => { if(!canStart) return; setFast({startTime:new Date().toISOString(), goalHours:chosenGoal}); notifiedRef.current=false; };
  const endFast = () => {
    if(!fast) return;
    setFastHistory(prev=>[...prev, {start:fast.startTime, end:new Date().toISOString(), hours:Number((elapsedSec/3600).toFixed(2)), goalHours:fast.goalHours, completed:goalReached}]);
    setFast(null);
  };

  const mainSec = displayMode==='elapsed' ? elapsedSec : (goalReached ? overSec : remainingSec);
  const mainLabel = displayMode==='elapsed' ? 'Elapsed' : (goalReached ? 'Over goal' : 'Remaining');
  const hit = fastHistory.filter(f=>f.completed).length;
  const longest = fastHistory.reduce((m,f)=> Math.max(m, f.hours||0), 0);

  return (
    <div className="page">
      <PageHeader title="Fasting" sub={fast ? `Goal ${fast.goalHours}h · ends ${new Date(new Date(fast.startTime).getTime()+goalSec*1000).toLocaleString('en-GB',{weekday:'short', hour:'2-digit', minute:'2-digit'})}` : 'Not currently fasting'} onBack={onBack}/>

      {!fast ? (
        <div className="card pad">
          <div className="field-label">Choose a goal</div>
          <div className="preset-grid">
            {FAST_PRESETS.map(h=>(
              <button key={h} className={`preset ${!custom && goalPick===h?'on':''}`} onClick={()=>{ setCustom(false); setGoalPick(h); }}>{h}<small>hours</small></button>
            ))}
            <button className={`preset ${custom?'on':''}`} style={{gridColumn:'span 2'}} onClick={()=>setCustom(true)}>Custom<small>set hours</small></button>
          </div>
          {custom && (
            <div className="field" style={{marginTop:12, marginBottom:0}}>
              <input className="input" type="number" inputMode="decimal" placeholder="Goal in hours, e.g. 20" value={customHours} onChange={e=>setCustomHours(e.target.value)} autoFocus/>
            </div>
          )}
          <button className="btn btn-primary" style={{marginTop:16}} disabled={!canStart} onClick={startFast}><Icon name="play" size={15}/>Start {canStart ? `${chosenGoal}h ` : ''}fast</button>
        </div>
      ) : (
        <div className="card pad">
          <Segmented value={displayMode} onChange={setDisplayMode} options={[
            {value:'elapsed', label:'Elapsed'},
            {value:'remaining', label: goalReached ? 'Over goal' : 'Remaining'},
          ]}/>
          <div style={{display:'flex', justifyContent:'center', marginTop:20}}>
            <Ring size={236} stroke={14} pct={pct} color={goalReached ? 'var(--success)' : 'var(--accent)'}>
              <div className="eyebrow">{mainLabel}</div>
              <div className="fast-time tabnum" style={{marginTop:6}}>{fmtHMS(mainSec)}</div>
              <div className={goalReached ? '' : 'faint'} style={{fontSize:12.5, fontWeight:700, marginTop:6, color: goalReached ? 'var(--success)' : undefined}}>
                {goalReached ? 'Goal reached' : `${Math.floor(Math.min(1,pct)*100)}% of ${fast.goalHours}h`}
              </div>
            </Ring>
          </div>
          <div className="fast-start">
            <span>Started {new Date(fast.startTime).toLocaleString('en-GB',{weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'})}</span>
            <button className="icon-btn sm" onClick={()=>setEditingActive(true)} aria-label="Edit start time"><Icon name="edit" size={13}/></button>
          </div>
          <button className="btn btn-ghost" style={{marginTop:16}} onClick={endFast}>End fast</button>
        </div>
      )}

      <div className="sec">
        <div className="sec-head"><h2>History</h2><span className="meta">{fastHistory.length ? `${hit}/${fastHistory.length} goals hit · best ${longest}h` : ''}</span></div>
        <div className="card" style={{padding:'4px 16px'}}>
          {fastHistory.length===0 && <div className="empty">No fasts logged yet</div>}
          <div className="hist">
            {fastHistory.map((f,idx)=>idx).reverse().map((origIdx)=>{
              const f = fastHistory[origIdx];
              return (
                <div className="hist-row" key={origIdx}>
                  <span className="d">{fmtDate(f.start, {weekday:'short', day:'numeric', month:'short'})}</span>
                  <span className="r tabnum">
                    <span>{f.hours}h <small>/ {f.goalHours}h</small></span>
                    {f.completed && <span className="chip done" style={{padding:'3px 7px'}}><Icon name="check" size={10} stroke={3}/></span>}
                    <button className="icon-btn sm" onClick={()=>setEditingHistoryIdx(origIdx)} aria-label="Edit fast"><Icon name="edit" size={13}/></button>
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {editingActive && fast && (
        <EditFastModal start={fast.startTime} end={null} onClose={()=>setEditingActive(false)}
          onSave={(newStart)=>{ setFast({...fast, startTime:newStart}); setEditingActive(false); }} />
      )}
      {editingHistoryIdx!=null && fastHistory[editingHistoryIdx] && (
        <EditFastModal start={fastHistory[editingHistoryIdx].start} end={fastHistory[editingHistoryIdx].end}
          onClose={()=>setEditingHistoryIdx(null)}
          onSave={(newStart, newEnd)=>{
            setFastHistory(prev=> prev.map((f,i)=>{
              if(i!==editingHistoryIdx) return f;
              const hours = Number(((new Date(newEnd) - new Date(newStart))/3600000).toFixed(2));
              return {...f, start:newStart, end:newEnd, hours, completed: hours >= f.goalHours};
            }));
            setEditingHistoryIdx(null);
          }} />
      )}
    </div>
  );
}

/* =========================================================
   SPOTIFY TICKER
   ========================================================= */
function SpotifyTicker({clientId, tokens, setTokens}){
  const [track, setTrack] = useState(null);

  useEffect(()=>{
    if(!tokens || !clientId){ setTrack(null); return; }
    let stopped = false;
    const poll = async () => {
      if(document.visibilityState==='hidden') return; // save battery in background
      const token = await getValidSpotifyToken(clientId, tokens, setTokens);
      if(!token || stopped) return;
      try{
        const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {headers:{Authorization:`Bearer ${token}`}});
        if(res.status===204){ if(!stopped) setTrack(null); return; }
        if(!res.ok) return;
        const data = await res.json();
        if(!data || !data.item){ if(!stopped) setTrack(null); return; }
        if(stopped) return;
        const imgs = (data.item.album && data.item.album.images) || [];
        setTrack({
          name:data.item.name,
          artists:(data.item.artists||[]).map(a=>a.name).join(', '),
          image: imgs.length ? (imgs[2] || imgs[0]).url : null,
          isPlaying:data.is_playing, progressMs:data.progress_ms || 0, durationMs:data.item.duration_ms || 0,
        });
      }catch(e){}
    };
    poll();
    const iv = setInterval(poll, 6000);
    const onVis = () => { if(document.visibilityState==='visible') poll(); };
    document.addEventListener('visibilitychange', onVis);
    return () => { stopped=true; clearInterval(iv); document.removeEventListener('visibilitychange', onVis); };
  }, [tokens, clientId]);

  const control = async (action) => {
    const token = await getValidSpotifyToken(clientId, tokens, setTokens);
    if(!token) return;
    try{
      if(action==='toggle'){
        const url = track && track.isPlaying ? 'https://api.spotify.com/v1/me/player/pause' : 'https://api.spotify.com/v1/me/player/play';
        await fetch(url, {method:'PUT', headers:{Authorization:`Bearer ${token}`}});
        setTrack(t=> t ? {...t, isPlaying:!t.isPlaying} : t);
      } else if(action==='next'){
        await fetch('https://api.spotify.com/v1/me/player/next', {method:'POST', headers:{Authorization:`Bearer ${token}`}});
      }
    }catch(e){}
  };

  if(!tokens || !track) return null;
  const pct = track.durationMs ? Math.min(100, (track.progressMs/track.durationMs)*100) : 0;
  return (
    <div className="ticker">
      <div className="ticker-prog"><i style={{width:pct+'%'}}></i></div>
      <div className="ticker-row">
        {track.image ? <img src={track.image} className="ticker-art" alt=""/> : <div className="ticker-art"></div>}
        <div className="ticker-meta">
          <div className="ticker-name">{track.name}</div>
          <div className="ticker-artist">{track.artists}</div>
        </div>
        <button className="icon-btn" onClick={()=>control('toggle')} aria-label={track.isPlaying?'Pause':'Play'}><Icon name={track.isPlaying ? 'pause' : 'play'} size={15}/></button>
        <button className="icon-btn" onClick={()=>control('next')} aria-label="Next track"><Icon name="next" size={15}/></button>
      </div>
    </div>
  );
}

/* =========================================================
   WORKOUT SESSION
   ========================================================= */
function RestTimerBox({duration, triggerToken}){
  const [endAt, setEndAt] = useState(null);
  const [justDone, setJustDone] = useState(false);
  const prevToken = useRef(null);
  const doneFired = useRef(false);
  const now = useNow(!!endAt, 250);

  useEffect(()=>{
    if(triggerToken==null || triggerToken===prevToken.current) return;
    prevToken.current = triggerToken;
    if(duration>0){
      doneFired.current = false;
      setJustDone(false);
      setEndAt(Date.now()+duration*1000);
    }
  }, [triggerToken, duration]);

  const remaining = endAt ? Math.max(0, Math.ceil((endAt-now)/1000)) : 0;
  const running = !!endAt && remaining>0;

  useEffect(()=>{
    if(endAt && remaining<=0 && !doneFired.current){
      doneFired.current = true;
      playBeep();
      vibrate([120,80,120]);
      notify('Rest complete', 'Time for your next set.');
      setJustDone(true);
      setEndAt(null);
    }
  }, [remaining, endAt]);

  useEffect(()=>{
    if(!justDone) return;
    const t = setTimeout(()=> setJustDone(false), 3000);
    return ()=>clearTimeout(t);
  }, [justDone]);

  const r = 28; const c = 2*Math.PI*r;
  const pct = duration && running ? remaining/duration : 0;
  return (
    <div className={`timer ${justDone?'done-pulse':''}`} aria-live="polite">
      <svg width="64" height="64">
        <circle className="bg" cx="32" cy="32" r={r}/>
        {running && <circle className="fg" cx="32" cy="32" r={r} strokeDasharray={c} strokeDashoffset={c*(1-pct)}/>}
      </svg>
      <div className={`lbl ${running?'run':justDone?'done':''}`}>
        {running ? <React.Fragment><span className="tabnum">{remaining}</span><small>rest</small></React.Fragment>
          : justDone ? <React.Fragment><Icon name="check" size={20} stroke={3}/><small>go</small></React.Fragment>
          : <React.Fragment><span className="faint tabnum">{duration ? duration : '—'}</span><small>{duration ? 'sec' : 'rest'}</small></React.Fragment>}
      </div>
    </div>
  );
}

function targetLine(ex){ return ex.sets ? `${ex.sets} × ${ex.reps}` : ex.reps; }
function groupKindLabel(g){
  switch(g.type){
    case 'straight': return 'Straight sets';
    case 'superset': return 'Superset';
    case 'triset': return 'Tri-set';
    case 'finisher': return 'Finisher';
    case 'circuit': return 'Circuit';
    default: return g.title;
  }
}
function exBadge(g, i){
  if(g.type==='superset'){ const m = /Superset\s+([A-Z])/i.exec(g.title||''); return `${m ? m[1].toUpperCase() : 'S'}${i+1}`; }
  if(g.type==='triset') return `T${i+1}`;
  return String(i+1);
}

function StepCard({group, color, sessionId, week, stepIndex, total, logs, setLogs, prs, setPrs, swaps, setSwaps, setToast}){
  const isRoundsBased = !!group.rounds;
  const nSets = isRoundsBased ? group.rounds : null;
  const logKey = `w${week}_${sessionId}_${stepIndex}`;
  const prevLogKey = week>1 ? `w${week-1}_${sessionId}_${stepIndex}` : null;

  const getExRest = (exIdx) => {
    if(isRoundsBased) return exIdx===group.exercises.length-1 ? (group.restBetweenRounds||0) : 0;
    if(group.type==='straight') return group.exercises[exIdx].rest || 60;
    return exIdx===group.exercises.length-1 ? (group.restAfter||60) : 0;
  };

  const [triggerTok, setTriggerTok] = useState(0);
  const [activeRest, setActiveRest] = useState(()=> getExRest(0) || group.restAfter || group.restBetweenRounds || 0);
  const [editingIdx, setEditingIdx] = useState(null);
  const [historyIdx, setHistoryIdx] = useState(null);
  const seeded = useRef(false);

  const blank = {weight:'', reps:'', rpe:'', done:[]};
  const getEntry = (exIdx) => logs[`${logKey}_${exIdx}`] || blank;
  const updateEntry = (exIdx, patch) => {
    const k = `${logKey}_${exIdx}`;
    setLogs(prev=> ({...prev, [k]: {...(prev[k]||blank), ...patch}}));
  };

  // Progressive overload prefill from last week
  useEffect(()=>{
    if(seeded.current || !prevLogKey || isRoundsBased) return;
    seeded.current = true;
    group.exercises.forEach((ex, exIdx)=>{
      if(logs[`${logKey}_${exIdx}`]) return;
      const prevEntry = logs[`${prevLogKey}_${exIdx}`];
      if(!prevEntry || !prevEntry.weight) return;
      const count = ex.sets || 0;
      const allDone = count>0 && (prevEntry.done||[]).filter(Boolean).length >= count;
      const prevW = parseFloat(prevEntry.weight);
      if(!isFinite(prevW)) return;
      const suggested = allDone ? roundTo(prevW+2.5, 2.5) : prevW;
      updateEntry(exIdx, {weight:String(suggested), reps: prevEntry.reps || ''});
    });
    // eslint-disable-next-line
  }, []);

  const slotKey = (exIdx) => `${sessionId}_${stepIndex}_${exIdx}`;

  const toggleSet = (exIdx, setIdx) => {
    const exRest = getExRest(exIdx);
    const entry = getEntry(exIdx);
    const done = [...(entry.done||[])];
    const willComplete = !done[setIdx];
    done[setIdx] = willComplete;
    updateEntry(exIdx, {done});
    if(willComplete){
      vibrate(15);
      const w = parseFloat(entry.weight);
      const r = firstNumber(entry.reps) || firstNumber(group.exercises[exIdx].reps);
      if(isFinite(w) && w>0 && r){
        const est = estimate1RM(w, r);
        const key = slotKey(exIdx);
        const prevPR = prs[key];
        if(!prevPR || est > prevPR.est1RM + 0.01){
          const name = swaps[key] || group.exercises[exIdx].name;
          setPrs(p=>({...p, [key]: {est1RM:est, weight:w, reps:r, date:new Date().toISOString(), name}}));
          if(setToast) setToast(`New PR — ${name}: ${w}kg × ${r}`);
        }
      }
      if(exRest>0){ setActiveRest(exRest); setTriggerTok(t=>t+1); }
    }
  };

  const setCountFor = (exIdx) => isRoundsBased ? nSets : group.exercises[exIdx].sets;
  const linked = group.type==='superset' || group.type==='triset';
  const restNote = isRoundsBased
    ? `${plural(group.rounds,'round')}${group.restBetweenRounds ? ` · rest ${group.restBetweenRounds}s between rounds` : ''}`
    : group.restAfter ? `Rest ${group.restAfter}s after each round` : null;

  return (
    <div className="card step" style={{'--c':color}}>
      <RestTimerBox duration={activeRest} triggerToken={triggerTok} />
      <div className="eyebrow c-ink">{groupKindLabel(group)} · {stepIndex+1} of {total}</div>
      <div className="step-title">{group.title}</div>
      {(group.note || restNote) && <div className="step-note">{[group.note, restNote].filter(Boolean).join(' · ')}</div>}

      {group.exercises.map((ex, exIdx)=>{
        const entry = getEntry(exIdx);
        const count = setCountFor(exIdx);
        const key = slotKey(exIdx);
        const displayName = swaps[key] || ex.name;
        const weightNum = parseFloat(entry.weight);
        const showWarmup = !isRoundsBased && isFinite(weightNum) && weightNum>0 && (count||0)>=3;
        const showPlates = !isRoundsBased && isFinite(weightNum) && weightNum>=20 && displayName.toLowerCase().includes('barbell');
        const plateInfo = showPlates ? (computePlates(weightNum)||[]) : [];
        const pr = prs[key];
        const exRest = !isRoundsBased && group.type==='straight' ? (ex.rest || 60) : null;
        return (
          <React.Fragment key={exIdx}>
            {linked && exIdx>0 && <div className="ex-link"><Icon name="pull" size={12}/>Straight into</div>}
            <div className="ex">
              <div className="ex-head">
                <div className="ex-badge c-ink">{exBadge(group, exIdx)}</div>
                {editingIdx===exIdx ? (
                  <input className="ex-edit" autoFocus defaultValue={displayName}
                    onBlur={e=>{ const v=e.target.value.trim(); setSwaps(s=>({...s, [key]: v||ex.name})); setEditingIdx(null); }}
                    onKeyDown={e=>{ if(e.key==='Enter') e.target.blur(); }} />
                ) : (
                  <button className="ex-name-btn" onClick={()=>setHistoryIdx(exIdx)}>
                    <span className="ex-name">{displayName}</span>
                    {!isRoundsBased && <span className="hint">Tap for history</span>}
                  </button>
                )}
                <button className="icon-btn sm" onClick={()=>setEditingIdx(editingIdx===exIdx?null:exIdx)} aria-label="Rename or swap exercise">
                  <Icon name="edit" size={13}/>
                </button>
              </div>
              <div className="ex-chips">
                <span className="chip big tabnum">{targetLine(ex)}</span>
                {exRest ? <span className="chip"><Icon name="timer" size={11}/>{exRest}s</span> : null}
                {pr && <span className="chip gold"><Icon name="trophy" size={11}/>PR {pr.weight}kg × {pr.reps}</span>}
              </div>
              {ex.note && <div className="ex-note">{ex.note}</div>}
              {!isRoundsBased && (
                <div className="ex-inputs">
                  <div>
                    <label>Weight kg</label>
                    <input type="number" inputMode="decimal" placeholder="—" value={entry.weight} onChange={e=>updateEntry(exIdx, {weight:e.target.value})}/>
                  </div>
                  <div>

/* =========================================================
   MORNING — warm-up checklist → circuit rounds → cool-down timers
   ========================================================= */
function newMorningSession(plan){
  return {
    v:2, date:dayKey(new Date()), startedAt:null, completedAt:null,
    plan:{...plan}, step:0,
    warm: MORNING.warmup.map(()=>false),
    rounds: Array.from({length:plan.rounds}, ()=>({})),
    cool: MORNING.cooldown.map(()=>false),
    restStartedAt:null, restEndsAt:null, coolTimer:null,
  };
}
// A session only "exists" once something has been ticked; before that it follows the current plan.
function resolveMorning(active, plan){
  if(isMorningV2(active) && active.startedAt) return active;
  const fresh = newMorningSession(plan);
  if(isMorningV2(active)) fresh.step = Math.min(active.step||0, fresh.plan.rounds+1);
  return fresh;
}
const FEELS = [{value:'easy', label:'Easy'},{value:'solid', label:'Solid'},{value:'hard', label:'Hard'}];

function MorningStepPills({s, step, onJump}){
  const R = s.plan.rounds;
  const items = [{k:'W', done:s.warm.every(Boolean)}];
  for(let i=0;i<R;i++) items.push({k:String(i+1), done:mRoundDone(s.rounds[i])});
  items.push({k:'C', done:s.cool.every(Boolean)});
  return (
    <div className="m-steps" style={{gridTemplateColumns:`repeat(${items.length},1fr)`}}>
      {items.map((it,i)=>(
        <button key={i} className={`m-step ${it.done?'done':''} ${i===step?'now':''}`} onClick={()=>onJump(i)} aria-label={i===0?'Warm-up':i===items.length-1?'Cool-down':`Round ${i}`}>
          {it.done && i!==step ? <Icon name="check" size={13} stroke={3}/> : it.k}
        </button>
      ))}
    </div>
  );
}

function RestBanner({s, now, onSkip}){
  if(!s.restEndsAt) return null;
  const total = MORNING.restMax;
  const elapsed = Math.max(0, (now - new Date(s.restStartedAt).getTime())/1000);
  const remaining = Math.max(0, Math.ceil(total - elapsed));
  const ready = elapsed >= MORNING.restMin;
  return (
    <div className={`card rest-banner ${ready?'ready':''}`}>
      <Ring size={64} stroke={6} pct={Math.min(1, elapsed/total)} color={ready ? 'var(--success)' : 'var(--accent)'}>
        <div className="tabnum" style={{fontWeight:800, fontSize:15}}>{remaining}</div>
      </Ring>
      <div style={{flex:1, minWidth:0}}>
        <div className="eyebrow" style={{color: ready ? 'var(--success)' : undefined}}>{ready ? 'Ready' : 'Rest'}</div>
        <div style={{fontWeight:700, fontSize:15, marginTop:2}}>{ready ? 'Go when you are' : `${MORNING.restMin}–${MORNING.restMax}s between rounds`}</div>
        <div className="faint tabnum" style={{fontSize:12, marginTop:2}}>{fmtMS(elapsed)} rested</div>
      </div>
      <button className="btn btn-ghost" style={{width:'auto', padding:'10px 14px', fontSize:13}} onClick={onSkip}>{ready ? 'Go' : 'Skip'}</button>
    </div>
  );
}

function Stepper({value, onChange, min=0, max=30}){
  return (
    <div className="stepper" onClick={e=>e.stopPropagation()}>
      <button onClick={()=>onChange(Math.max(min, value-1))} aria-label="Fewer">−</button>
      <span className="tabnum">{value}</span>
      <button onClick={()=>onChange(Math.min(max, value+1))} aria-label="More">+</button>
    </div>
  );
}

function MorningFinishSheet({s, log, roundsDone, totals, elapsed, onClose, onSave}){
  const P = s.plan;
  const [feel, setFeel] = useState('solid');
  const allRounds = roundsDone >= P.rounds;
  const pulls = s.rounds.slice(0, P.rounds).map(r=>r.pullup);
  const prevPB = morningPullPB(log);
  const newPB = totals.pullup > prevPB && totals.pullup > 0;

  const suggestions = [];
  if(allRounds && pulls.every(v=> v!=null && v >= P.pullMax)){
    suggestions.push({id:'pull', label:`Every round hit ${P.pullMax} pull-ups`, detail:`Next time aim for ${P.pullMin+1}–${P.pullMax+1} per round`,
      apply:p=>({...p, pullMin:p.pullMin+1, pullMax:p.pullMax+1})});
  }
  if(feel==='easy' && allRounds){
    if(P.rounds < 5){
      suggestions.push({id:'round', label:`${P.rounds} rounds felt easy`, detail:`Add a round — ${P.rounds+1} next time`, apply:p=>({...p, rounds:p.rounds+1})});
    } else {
      suggestions.push({id:'reps', label:`${P.rounds} rounds felt easy`, detail:`+2 reps per movement per round (swings ${10+P.bonus+2}, press-ups ${10+P.bonus+2}, squats ${12+P.bonus+2})`, apply:p=>({...p, bonus:(p.bonus||0)+2})});
    }
  }
  const [off, setOff] = useState({});
  const chosen = suggestions.filter(x=>!off[x.id]);

  return (
    <Sheet title="Finish Morning" onClose={onClose} actions={<React.Fragment>
      <button className="btn btn-ghost" onClick={onClose}>Back</button>
      <button className="btn btn-sunrise" onClick={()=>onSave(feel, chosen)}><Icon name="check" size={16} stroke={3}/>Save session</button>
    </React.Fragment>}>
      <div className="stat-grid c3">
        <Stat value={`${roundsDone}/${P.rounds}`} label="Rounds"/>
        <Stat value={totals.pullup} label={newPB ? 'New PB' : 'Pull-ups'}/>
        <Stat value={elapsed ? fmtMS(elapsed) : '—'} label="Time"/>
      </div>
      <div className="m-totals">
        {MORNING.circuit.map(ex=>(
          <div key={ex.id}><span>{ex.name}</span><b className="tabnum">{totals[ex.id]}</b></div>
        ))}
      </div>
      <div className="field" style={{marginTop:16}}>
        <label>How did it feel?</label>
        <Segmented value={feel} onChange={setFeel} options={FEELS}/>
      </div>
      {suggestions.length>0 ? (
        <div className="field">
          <label>Progression</label>
          {suggestions.map(x=>(
            <button key={x.id} className={`prog-opt ${off[x.id]?'':'on'}`} onClick={()=>setOff(o=>({...o, [x.id]:!o[x.id]}))}>
              <span className="tick"><Icon name="check" size={14} stroke={3}/></span>
              <span style={{flex:1}}><b>{x.label}</b><small>{x.detail}</small></span>
            </button>
          ))}
        </div>
      ) : (
        <div className="help">{allRounds ? 'Mark it Easy to get a progression step.' : `Complete all ${P.rounds} rounds to unlock progression.`}</div>
      )}
    </Sheet>
  );
}
